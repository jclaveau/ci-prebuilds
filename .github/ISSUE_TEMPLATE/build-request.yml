name: Build request (specific version combo)
description: Request a build of a specific (OS, image, flavor) tuple at custom versions
title: "[build] "
labels: ["build-request"]
body:
  - type: markdown
    attributes:
      value: |
        On submit, a workflow auto-builds the requested combination and pushes the
        version-pinned tag to Docker Hub. **`:latest` is NOT updated** — only the
        pinned tag is published.

        Rate-limiting is by **serial execution**: one on-demand build runs at a
        time; new requests queue. There is no per-requester quota.

        Each (OS, OS version) tuple is its own matrix cell — picking
        `ubuntu_version=22.04,24.04` builds both as separate cells in parallel.
        Tags include the OS version (e.g. `jclaveau/ubuntu-24.04-gha-tools:...`).

        Build wall-clock: ~5 min (gha-tools, one cell) up to ~30 min (playwright,
        full matrix). The workflow comments here when the build starts and again
        when it finishes.
  - type: dropdown
    id: os
    attributes:
      label: OS family
      description: 'Pick one or more. Picking `All` (or leaving empty) builds both — ~2x wall-clock.'
      multiple: true
      options:
        - All
        - ubuntu
        - alpine
  - type: dropdown
    id: ubuntu_version
    attributes:
      label: Ubuntu version(s)
      description: 'Pick one or more. Empty = the Ubuntu default (highest LTS in the list). Each pick is its own matrix cell. List is refreshed weekly by `refresh-os-version-options.yml`.'
      multiple: true
      options:
        - '24.04'
        - '22.04'
        - '20.04'
  - type: input
    id: ubuntu_version_extra
    attributes:
      label: Ubuntu extra version(s)
      description: 'Free-text CSV for Ubuntu versions NOT in the dropdown above (e.g. point releases like `22.04.1` or an unreleased rc). Not validated — typos build broken images.'
      placeholder: '22.04.1'
  - type: dropdown
    id: alpine_version
    attributes:
      label: Alpine version(s)
      description: 'Pick one or more. Empty = the Alpine default (highest in the list). Each pick is its own matrix cell. List is refreshed weekly by `refresh-os-version-options.yml`.'
      multiple: true
      options:
        - '3.21'
        - '3.20'
        - '3.19'
        - '3.18'
  - type: input
    id: alpine_version_extra
    attributes:
      label: Alpine extra version(s)
      description: 'Free-text CSV for Alpine versions NOT in the dropdown above. Not validated.'
      placeholder: '3.21.3'
  - type: dropdown
    id: image
    attributes:
      label: Image variant(s)
      description: 'Pick one or more. `gha-tools` is the OS-only base; the full list mirrors the matrix in `test-and-publish.yml`. Each picked variant becomes one cell in the build matrix.'
      multiple: true
      options:
        - gha-tools
        - dood
        - dind
        - dood-node
        - dind-node
        - dood-pnpm
        - dind-pnpm
        - dood-pnpm-gyp
        - dind-pnpm-gyp
        - dood-playwright
        - dind-playwright
        - dood-playwright-gyp
        - dind-playwright-gyp
    validations: { required: true }
  - type: dropdown
    id: flavor
    attributes:
      label: Flavor
      description: 'Pick one or more. Picking `All` (or leaving empty) builds both. `hardened` is the consumer default (no broad sudo); `sudoer` is the build-chain image (runner NOPASSWD intact).'
      multiple: true
      options:
        - All
        - hardened
        - sudoer
  - type: input
    id: node_version
    attributes:
      label: Node version (optional)
      description: 'Leave empty for `gha-tools` / `dood` / `dind`. Otherwise e.g. `20.18.0`.'
      placeholder: '22.12.0'
  - type: input
    id: pnpm_version
    attributes:
      label: pnpm version (optional)
      description: 'Leave empty if the variant has no pnpm. Otherwise e.g. `9.15.3`.'
      placeholder: '9.15.3'
  - type: input
    id: pw_version
    attributes:
      label: Playwright version (optional)
      description: 'Only for `*-playwright[-gyp]` variants. e.g. `1.50.1`.'
      placeholder: '1.50.1'
