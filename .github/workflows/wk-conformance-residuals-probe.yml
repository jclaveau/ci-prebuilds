name: WebKit conformance residuals probe

# The six WebKit conformance failures that survive on Alpine, measured against
# three browsers in one run so the arms are directly comparable:
#
#   ours       our published artifact, inside our own conformance runner image
#   baseline   the webkit PW ships with 1.62.1 (r2336, built from WebKit 343e13bf)
#   candidate  the webkit PW ships today (r2355+, built from 4d05d732 — our base)
#
# The reds are the right-click event order (page-click.spec.ts:1203), CacheStorage
# surviving page.reload() in a persistent context (defaultbrowsercontext-2.spec.ts:285)
# and the four camera/microphone tests (permissions.spec.ts:349-386). None of them
# carries an exemption we inherit, so every upstream arm is expected to pass.
#
#   upstream arms PASS      → the reds are ours: cmake flags, musl, strip, runner env
#   candidate arm FAILS     → the base move carries them, and it is worth filing upstream
#
# All three arms run one script (scripts/probe-webkit-conformance-residuals.cjs) in
# one job, so they share a summary table and the run can assert the upstream arms
# actually differ — a control that silently probed the same build twice would
# report a flat result and read as an answer.
#
# Builds only our runner image, never a browser, so an iteration is ~15 minutes.

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: our WebKit artifact to probe
        default: ghcr.io/jclaveau/playwright-alpine-browsers:wk-edge
        type: string
      pw_version:
        description: PW SDK version installed in our runner image
        default: '1.62.1'
        type: string
      artifact_rev:
        description: WK_REV to stage at PW's cache path (webkit browsers.json revision)
        default: '2336'
        type: string
      baseline_pw_version:
        description: npm version whose webkit build is the older upstream arm
        default: '1.62.1'
        type: string
      candidate_pw_version:
        description: npm version (or dist-tag) whose webkit build is the newer upstream arm
        default: 'next'
        type: string
      probe_unstripped:
        description: also probe our artifact with the stripped libs restored (the strip A/B)
        default: true
        type: boolean

concurrency:
  group: wk-conformance-residuals-probe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install both upstream arms
        id: install
        env:
          BASELINE_PW_VERSION: ${{ inputs.baseline_pw_version }}
          CANDIDATE_PW_VERSION: ${{ inputs.candidate_pw_version }}
        run: |
          set -euo pipefail
          for arm in baseline candidate; do
            case "$arm" in
              baseline) version="$BASELINE_PW_VERSION" ;;
              candidate) version="$CANDIDATE_PW_VERSION" ;;
            esac
            mkdir -p "arms/$arm"
            (
              cd "arms/$arm"
              npm init -y >/dev/null
              npm install "playwright@${version}"
              # Read the files directly: playwright-core's `exports` map does not
              # expose browsers.json, so require() of it throws.
              rev=$(jq -r '.browsers[] | select(.name == "webkit") | .revision' \
                node_modules/playwright-core/browsers.json)
              resolved=$(jq -r .version node_modules/playwright-core/package.json)
              echo "${arm}_revision=${rev}" >> "$GITHUB_OUTPUT"
              echo "${arm}_resolved=${resolved}" >> "$GITHUB_OUTPUT"
              npx playwright install --with-deps webkit
            )
          done

      # The upstream comparison rests on the two arms carrying different WebKit
      # builds. npm dist-tags move, so this is checked rather than assumed.
      - name: Assert the upstream arms differ
        env:
          BASELINE_REV: ${{ steps.install.outputs.baseline_revision }}
          CANDIDATE_REV: ${{ steps.install.outputs.candidate_revision }}
        run: |
          set -euo pipefail
          if [[ "$BASELINE_REV" == "$CANDIDATE_REV" ]]; then
            echo "both arms resolved to webkit r${BASELINE_REV} — nothing to compare" >&2
            exit 1
          fi
          if (( CANDIDATE_REV < BASELINE_REV )); then
            echo "candidate r${CANDIDATE_REV} is OLDER than baseline r${BASELINE_REV}" >&2
            exit 1
          fi

      - name: Build our conformance runner
        env:
          BROWSER: webkit
          IMAGE_REF: ${{ inputs.image_ref }}
          PW_VERSION: ${{ inputs.pw_version }}
          ARTIFACT_REV: ${{ inputs.artifact_rev }}
          HEADED: '0'
          IMAGE_TAG_OUT: wkresiduals:${{ github.run_id }}
        # build-runner.sh IS what the conformance shards run, strip and all —
        # a hand-rolled apk list would probe something other than what ships.
        run: ./playwright/alpine-browsers/conformance/build-runner.sh

      - name: Open the summary table
        run: |
          {
            echo '| arm | probe | verdict | detail |'
            echo '| --- | --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"

      # This dump is what corrected the identifier: MiniBrowser exposes
      # `MockCaptureDevices`, not the preference key `MockCaptureDevicesEnabled`,
      # and it answers an unknown name with a stderr line and carries on — which
      # reads exactly like a flag that had no effect. Kept so a rename upstream
      # shows up as a changed dump rather than as a silently inert flag.
      # PW's own libWPEWebKit carries "Mock audio device 1" and the mock
      # GStreamer sources. Whether ours does splits the camera cluster in two:
      # present means the mock centre is merely switched off at runtime, absent
      # means mock capture was never compiled and only a rebuild can fix it.
      - name: Check whether our libWPEWebKit carries the mock capture sources
        continue-on-error: true
        run: |
          docker run --rm --entrypoint sh "wkresiduals:${{ github.run_id }}" -c '
            lib=$(find /ms-playwright/webkit-${{ inputs.artifact_rev }}/minibrowser-wpe               -name "libWPEWebKit-*.so.*" -type f | head -1)
            echo "lib=$lib"
            strings -a "$lib" | grep -aiE "Mock audio device|Mock video device|MockRealtime(Audio|Video)SourceGStreamer|MockDeviceProvider"               | sort -u | head -12 || echo "NO mock capture strings in our libWPEWebKit"
          '

      - name: List the MiniBrowser feature identifiers matching mock/capture
        continue-on-error: true
        run: |
          docker run --rm --entrypoint sh \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            "wkresiduals:${{ github.run_id }}" \
            -c '/ms-playwright/webkit-${{ inputs.artifact_rev }}/pw_run.sh --headless --features=help 2>&1' \
            | grep -iE 'mock|capture' || echo 'no feature identifier matched mock/capture'

      # Our arm runs the same script inside the runner image. The container has
      # no access to the host's step summary, so its PROBE_RESULT lines are
      # turned into table rows here instead of by the script itself.
      - name: Probe our artifact
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          # Same sandbox strip the conformance shards use for WebKit — WPE's
          # bwrap needs seccomp+apparmor unconfined AND the caps AND the env
          # escape hatch.
          docker run --rm \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --cap-add SYS_ADMIN --cap-add NET_ADMIN \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            -e WEBKIT_FORCE_SANDBOX=0 \
            -e NODE_PATH=/usr/local/lib/node_modules:/usr/lib/node_modules \
            -e GST_DEBUG=webkitcapturedevicemanager:6 \
            -e DEBUG=pw:browser,pw:protocol \
            -v "$PWD/scripts:/probe:ro" \
            "wkresiduals:${{ github.run_id }}" \
            node /probe/probe-webkit-conformance-residuals.cjs > /tmp/ours.log 2>&1 \
            || { echo 'the probe container exited non-zero; last 80 lines:'; tail -80 /tmp/ours.log; exit 1; }
          # pw:protocol is far too noisy to stream, so the full log goes up as an
          # artifact and only the answers are printed here.
          grep -a PROBE_RESULT /tmp/ours.log
          echo '### mouse events on the wire (dispatchMouseEvent, in order)'
          # Whether the driver ever sent the release, and whether the browser
          # answered it, is the whole contextmenu question: a release absent
          # here was never sent, one present with no response was dropped.
          grep -aoE 'Input\.dispatchMouseEvent","params":\{[^}]*\}' /tmp/ours.log \
            | head -30 || echo 'no dispatchMouseEvent frames in the protocol log'
          echo '### console events the page reported (ours)'
          # The release is ACKed with {"result":{}} and no mouseup ever reaches
          # the page, so the count of console events beside the acks is the
          # evidence that WebKit accepted the event and dropped it.
          grep -aoE 'Console\.messageAdded[^}]*' /tmp/ours.log | head -12 \
            || echo 'no console events in the protocol log'
          # GStreamerCaptureDeviceManager names the branch it took. "Could not
          # start device monitor" means no provider matched the filters;
          # "Refreshing capture devices" followed by nothing means the mock
          # provider declined to probe, which is the mock centre being off.
          echo '### capture device manager log (ours)'
          grep -aiE 'device monitor|Refreshing capture' /tmp/ours.log | head -20 \
            || echo 'the capture device manager logged nothing'

          awk -v arm="ours · ${IMAGE_REF##*:}" '
            $1 == "PROBE_RESULT" {
              detail = ""
              for (i = 4; i <= NF; i++) {
                detail = detail (i > 4 ? " " : "") $i
              }
              printf "| %s | %s | %s | `%s` |\n", arm, $2, $3, detail
            }
          ' /tmp/ours.log >> "$GITHUB_STEP_SUMMARY"


      - name: Probe each upstream arm
        env:
          BASELINE_REV: ${{ steps.install.outputs.baseline_revision }}
          CANDIDATE_REV: ${{ steps.install.outputs.candidate_revision }}
          BASELINE_RESOLVED: ${{ steps.install.outputs.baseline_resolved }}
          CANDIDATE_RESOLVED: ${{ steps.install.outputs.candidate_resolved }}
        run: |
          set -euo pipefail
          for arm in baseline candidate; do
            case "$arm" in
              baseline) rev="$BASELINE_REV"; resolved="$BASELINE_RESOLVED" ;;
              candidate) rev="$CANDIDATE_REV"; resolved="$CANDIDATE_RESOLVED" ;;
            esac
            echo "==== ${arm}: playwright-core ${resolved}, webkit r${rev} ===="
            ARM_LABEL="${arm} · pw ${resolved} · webkit r${rev}" \
            PW_MODULE="${GITHUB_WORKSPACE}/arms/${arm}/node_modules/playwright" \
            GST_DEBUG=webkitcapturedevicemanager:6 \
            DEBUG=pw:browser,pw:protocol \
              node scripts/probe-webkit-conformance-residuals.cjs > "/tmp/${arm}.log" 2>&1
            grep -a PROBE_RESULT "/tmp/${arm}.log"
            # The same log from a build that DOES enumerate devices is the
            # control: it shows which lines ours never reaches.
            echo "### capture device manager log (${arm})"
            grep -aiE 'device monitor|Refreshing capture' "/tmp/${arm}.log" | head -12 \
              || echo "the capture device manager logged nothing"
            # The same wire from a build that delivers the release: ours ACKs it
            # and drops it, so what upstream does differently is the fix.
            echo "### mouse events on the wire (${arm})"
            grep -aoE 'Input\.dispatchMouseEvent","params":\{[^}]*\}' "/tmp/${arm}.log" | head -12 \
              || echo "no dispatchMouseEvent frames"
          done

      # A/B on the consumer strip, not on WebKit. strip-bundled-libs.sh removes
      # every bundled lib that has an apk twin — including libwpe and
      # libWPEBackend-fdo, which own the view backend and its mouse events, and
      # glib/gio, which the persistent store's file IO goes through. So the
      # runner loads different libraries than WebKit was COMPILED against, while
      # upstream builds and ships one set. Restoring the artifact's own lib
      # directory over the stripped tree reverses the strip exactly, without
      # re-deriving the apk list that build-runner.sh already owns.
      - name: Probe our artifact with the bundled libs restored
        if: inputs.probe_unstripped
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          # build-runner.sh stages the artifact with exactly this COPY and strips
          # it afterwards, so re-applying the same COPY over the stripped image
          # restores every removed file in its own layout — provably the reverse
          # of the strip, and it cannot drift from the artifact's structure the
          # way a hand-written subpath can (an earlier guess at
          # /webkit/minibrowser-wpe/lib was taken from PW's artifact, not ours,
          # and did not exist).
          cat > /tmp/Dockerfile.unstripped <<DOCKERFILE
          FROM wkresiduals:${{ github.run_id }}
          COPY --from=${{ inputs.image_ref }} /webkit /ms-playwright/webkit-${{ inputs.artifact_rev }}
          DOCKERFILE
          docker build -t wkunstripped:${{ github.run_id }} -f /tmp/Dockerfile.unstripped /tmp
          # A restore that restored nothing would read as "the strip is innocent".
          # bundle-dist.sh uses a FLAT layout — every .so sits beside MiniBrowser
          # with RPATH=$ORIGIN, there is no lib/ subdir (that is PW's layout, and
          # counting it there reported 0 for both images and verified nothing).
          for image in wkresiduals wkunstripped; do
            echo -n "$image bundled libwpe/fdo: "
            docker run --rm --entrypoint sh "$image:${{ github.run_id }}" -c \
              'ls /ms-playwright/webkit-${{ inputs.artifact_rev }}/minibrowser-wpe/ 2>/dev/null \
                 | grep -cE "^lib(wpe|WPEBackend-fdo)" || true'
          done
          # And prove which copy the process actually MAPS: RPATH=$ORIGIN should
          # prefer the restored one, but "present on disk" is not "loaded".
          docker run --rm \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --cap-add SYS_ADMIN --cap-add NET_ADMIN \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            --entrypoint sh "wkunstripped:${{ github.run_id }}" -c \
            'ldd /ms-playwright/webkit-${{ inputs.artifact_rev }}/minibrowser-wpe/MiniBrowser 2>&1 \
               | grep -iE "wpe" || echo "ldd named no wpe libs"'
          docker run --rm \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --cap-add SYS_ADMIN --cap-add NET_ADMIN \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            -e WEBKIT_FORCE_SANDBOX=0 \
            -e NODE_PATH=/usr/local/lib/node_modules:/usr/lib/node_modules \
            -e DEBUG=pw:browser \
            -v "$PWD/scripts:/probe:ro" \
            "wkunstripped:${{ github.run_id }}" \
            node /probe/probe-webkit-conformance-residuals.cjs > /tmp/unstripped.log 2>&1 \
            || { echo 'the unstripped probe exited non-zero; last 60 lines:'; tail -60 /tmp/unstripped.log; }
          grep -a PROBE_RESULT /tmp/unstripped.log
          awk -v arm="ours UNSTRIPPED" '
            $1 == "PROBE_RESULT" {
              detail = ""
              for (i = 4; i <= NF; i++) {
                detail = detail (i > 4 ? " " : "") $i
              }
              printf "| %s | %s | %s | `%s` |\n", arm, $2, $3, detail
            }
          ' /tmp/unstripped.log >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the full probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wk-residuals-logs-${{ github.run_id }}
          path: /tmp/*.log
          if-no-files-found: warn
