name: screenshot encode diagnosis

# Runs playwright/bench/screenshot-encode-probe.cjs against TWO artifacts of the
# SAME browser, to split the one `screenshot` number the runtime probe reports
# into codec, capture and per-shot floor.
#
# ff-perf-ab.yml put our musl Firefox at 0.68x on screenshots (32.5 ms/shot vs
# 22.2 official, samples non-overlapping) while every other metric sat at
# parity — so the cost is specific to that path rather than a build-wide
# regression, and one number cannot say which part of it.
#
# The decisive row is `png_canvas_control`: a fonts-free deterministic bitmap,
# so an identical `jpeg_q80_canvas_control` sha proves both sides rasterized the
# same pixels and any PNG byte difference is the encoder. That question is not
# firefox-specific — webkit links Alpine's libpng AND libz, and chromium takes
# its own bundled libpng against Alpine's system zlib — hence the browser input.
#
# Staging is ff-perf-ab.yml's, including the ICU + Juggler launch shim: without
# it a PW-driven launch of the musl build measures a launch failure rather than
# a browser.

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to probe (both artifacts must carry it)'
        default: 'firefox'
        type: choice
        options:
          - firefox
          - webkit
          - chromium
      image_a:
        description: 'Baseline artifact (e.g. ghcr.io/…:sha-<sha>)'
        required: true
        type: string
      label_a:
        description: 'Name for A in the report'
        default: 'control'
        type: string
      image_b:
        description: 'Candidate artifact, or the literal `official` for PW''s published image as reference'
        required: true
        type: string
      label_b:
        description: 'Name for B in the report'
        default: 'candidate'
        type: string
      browser_rev:
        description: 'Revision the artifacts carry for THIS browser (PW browsers.json)'
        required: true
        type: string
      pw_version:
        description: 'Playwright version to drive the probe'
        default: '1.62.1'
        type: string

concurrency:
  # Suffixed by browser: the three browsers are independent questions, and a
  # shared group would make a second dispatch cancel the first.
  group: ${{ github.workflow }}-${{ inputs.browser }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe both artifacts on this runner
        env:
          BROWSER: ${{ inputs.browser }}
          IMAGE_A: ${{ inputs.image_a }}
          IMAGE_B: ${{ inputs.image_b }}
          LABEL_A: ${{ inputs.label_a }}
          LABEL_B: ${{ inputs.label_b }}
          REV: ${{ inputs.browser_rev }}
          PW: ${{ inputs.pw_version }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          mkdir -p perf-out && chmod 777 perf-out

          # WebKit's bwrap sandbox can't nest inside the runner's default
          # seccomp profile. Applied to BOTH arms rather than only ours: the
          # probe's whole claim rests on the two sides differing in one
          # variable, so runtime flags stay symmetric even where one side
          # would not have needed them.
          RUN_FLAGS=""
          if [ "$BROWSER" = webkit ]; then
            RUN_FLAGS="--security-opt seccomp=unconfined --env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1"
          fi

          # Per-browser apk extras on top of the shared base, appended rather
          # than merged so the firefox arm's environment stays byte-identical to
          # the runs already on record.
          #
          #   webkit    libwpe + GTK4 + the gstreamer and Mesa stack WPE loads.
          #   chromium  the delta against chs-perf-ab.yml's validated list —
          #             Alpine splits harfbuzz-subset out of harfbuzz, and the
          #             headless shell links it, so without this the binary dies
          #             at load with `hb_subset_or_fail: symbol not found`.
          BROWSER_EXTRA_APKS=""
          case "$BROWSER" in
            webkit)
              BROWSER_EXTRA_APKS="libwpe libwpebackend-fdo gtk4.0 at-spi2-core cairo pango gdk-pixbuf mesa-gles mesa-gbm mesa-dri-gallium mesa-vulkan-swrast gst-plugins-bad"
              ;;
            chromium)
              BROWSER_EXTRA_APKS="freetype harfbuzz-subset libxdamage libxrandr libxscrnsaver libxtst libx11 libxcb libxext libxi cups-libs pango cairo dav1d ffmpeg-libavformat libatk-1.0 libatk-bridge-2.0 at-spi2-core libxkbcommon mesa-gbm eudev-libs flac"
              ;;
          esac

          # `official` names PW's own published image rather than one of our
          # artifacts: it already carries every browser and a global playwright,
          # so it needs no staging. It answers "how far off the official build
          # are we", which is a different question from arm-vs-arm and the
          # reason the probe reports ratios at all.
          probe_official() {
            local label="$1" image="mcr.microsoft.com/playwright:v${PW}-noble"
            echo "::group::probe ${label} (${image})"
            # shellcheck disable=SC2086  # RUN_FLAGS is a deliberate word-split
            docker run --rm $RUN_FLAGS \
              --env "PROBE_TARGET=${label}" \
              --env "PROBE_BROWSER=${BROWSER}" \
              --env HOME=/root \
              -v "$PWD/playwright/bench:/probe:ro" \
              -v "$PWD/playwright/scripts:/pwscripts:ro" \
              -v "$PWD/perf-out:/out" \
              --env "PW_VERSION=${PW}" \
              "$image" \
              sh -c '
                NODE_PATH="$(sh /pwscripts/global-node-path.sh)"
                export NODE_PATH
                node -e "require(\"playwright\")" 2>/dev/null \
                  || npm install -g --no-fund --no-audit "playwright@$PW_VERSION" >/dev/null 2>&1
                node /probe/screenshot-encode-probe.cjs \
                  --browser "$PROBE_BROWSER" --target "$PROBE_TARGET" --out /out
              ' 2>&1 | tee "perf-out/probe-${label}.log"
            echo "::endgroup::"
          }

          # Per-browser staging, mirroring playwright/Dockerfile.alpine. Each
          # browser's producer artifact ships a different tree at a different
          # PW SDK auto-discovery path, and only firefox needs a launch shim.
          emit_stage_lines() {
            local image="$1"
            case "$BROWSER" in
              firefox)
          cat <<EOF
          COPY --from=${image} /firefox /ms-playwright/firefox-${REV}/firefox
          RUN touch /ms-playwright/firefox-${REV}/INSTALLATION_COMPLETE \\
           && chmod 755 /ms-playwright/firefox-${REV}
          # Same launch shim playwright/Dockerfile.alpine installs: aports builds
          # firefox --with-system-icu and Alpine's libicudata is a stub, so
          # ICU_DATA has to point at the artifact dir; and PW's m-remote handler
          # is shadowed by Mozilla's RemoteAgent, so Juggler only wakes up when
          # --remote-debugging-port is passed. Probing without this measures a
          # launch failure, not a browser.
          RUN mv /ms-playwright/firefox-${REV}/firefox/firefox \\
                 /ms-playwright/firefox-${REV}/firefox/firefox.real \\
           && printf '%s\\n' \\
                  '#!/bin/sh' \\
                  'DIR="\$(dirname "\$0")"' \\
                  'ICU_DATA="\$DIR" exec "\$DIR/firefox.real" --remote-debugging-port=0 "\$@"' \\
                > /ms-playwright/firefox-${REV}/firefox/firefox \\
           && chmod +x /ms-playwright/firefox-${REV}/firefox/firefox
          EOF
                ;;
              webkit)
          # Only minibrowser-wpe, as the shipped image does: pw_run.sh picks the
          # gtk port only for headed, which musl doesn't support.
          cat <<EOF
          COPY --from=${image} /webkit/minibrowser-wpe /ms-playwright/webkit-${REV}/minibrowser-wpe
          COPY --from=${image} /webkit/pw_run.sh /ms-playwright/webkit-${REV}/pw_run.sh
          RUN touch /ms-playwright/webkit-${REV}/INSTALLATION_COMPLETE \\
           && chmod 755 /ms-playwright/webkit-${REV}
          EOF
                ;;
              chromium)
          cat <<EOF
          COPY --from=${image} /chrome-headless-shell-linux64 /ms-playwright/chromium_headless_shell-${REV}/chrome-headless-shell-linux64
          RUN touch /ms-playwright/chromium_headless_shell-${REV}/INSTALLATION_COMPLETE \\
           && chmod 755 /ms-playwright/chromium_headless_shell-${REV}
          EOF
                ;;
              *)
                echo "unknown browser: $BROWSER" >&2
                return 1
                ;;
            esac
          }

          probe_one() {
            local image="$1" label="$2"
            if [ "$image" = official ]; then
              probe_official "$label"
              return
            fi
            echo "::group::stage + probe ${label} (${image})"
            {
          cat <<EOF
          FROM alpine:edge
          RUN apk update && apk add --no-cache \\
              nodejs npm bash \\
              ca-certificates font-opensans ttf-freefont \\
              alsa-lib dbus-libs fontconfig glib gtk+3.0 harfbuzz \\
              libdrm libevent libffi libjpeg-turbo libnotify libogg libtheora \\
              libvorbis libvpx libwebp libwebpdemux libxcomposite libxt mesa-gl \\
              nspr nss pipewire-libs libpulse libstdc++ libgcc \\
              gstreamer gst-plugins-base gst-plugins-good gst-libav \\
              opus libsecret libxslt double-conversion minizip crc32c ${BROWSER_EXTRA_APKS}
          EOF
              emit_stage_lines "$image"
          cat <<EOF
          ENV PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          ENV PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
          # musl ldconfig rejects -p, so PW's host validator reports false
          # missing libraries on Alpine.
          ENV PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1
          RUN npm install -g --no-fund --no-audit playwright@${PW}
          EOF
            } > "/tmp/Dockerfile.${label}"
            echo "--- staged Dockerfile (${label}) ---"
            sed 's/^/    /' "/tmp/Dockerfile.${label}"
            docker build -t "probe-${BROWSER}-${label}:${RUN_ID}" -f "/tmp/Dockerfile.${label}" /tmp
            # The probe is CommonJS precisely so NODE_PATH resolution applies to
            # the global playwright install — ESM ignores NODE_PATH.
            # shellcheck disable=SC2086  # RUN_FLAGS is a deliberate word-split
            docker run --rm $RUN_FLAGS \
              --env "PROBE_TARGET=${label}" \
              --env "PROBE_BROWSER=${BROWSER}" \
              -v "$PWD/playwright/bench:/probe:ro" \
              -v "$PWD/perf-out:/out" \
              "probe-${BROWSER}-${label}:${RUN_ID}" \
              sh -c '
                export NODE_PATH="$(npm root -g)"
                node /probe/screenshot-encode-probe.cjs \
                  --browser "$PROBE_BROWSER" --target "$PROBE_TARGET" --out /out
              ' 2>&1 | tee "perf-out/probe-${label}.log"
            echo "::endgroup::"
          }

          probe_one "$IMAGE_A" "$LABEL_A"
          probe_one "$IMAGE_B" "$LABEL_B"

      - name: Report
        env:
          BROWSER: ${{ inputs.browser }}
          LABEL_A: ${{ inputs.label_a }}
          LABEL_B: ${{ inputs.label_b }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os

          a_name, b_name = os.environ['LABEL_A'], os.environ['LABEL_B']
          browser = os.environ['BROWSER']
          a = json.load(open(f'perf-out/{a_name}-screenshot.json'))
          b = json.load(open(f'perf-out/{b_name}-screenshot.json'))

          print(f"## {browser} screenshot breakdown — {b_name} vs {a_name}\n")
          print(f"- {a_name}: `{a['binary_version']}` ({a['libc']})")
          print(f"- {b_name}: `{b['binary_version']}` ({b['libc']})")
          print(f"- playwright `{a['playwright_version']}`\n")
          print(f"| case | {a_name} ms | {b_name} ms | ratio | {a_name} bytes | {b_name} bytes | same sha |")
          print("|---|---:|---:|---:|---:|---:|:--:|")

          bi = {r['label']: r for r in b['results']}
          for ra in a['results']:
              rb = bi.get(ra['label'])
              if not rb:
                  continue
              av, bv = ra['median_ms'], rb['median_ms']
              ratio = f"{bv / av:.2f}x" if av else "—"
              # Same spread rule as the runtime probe: a difference inside the
              # samples' own range is not a measurement.
              spread = max(max(ra['samples']) - min(ra['samples']),
                           max(rb['samples']) - min(rb['samples']))
              if av and abs(bv - av) < spread:
                  ratio += " n.s."
              # The sha column is what makes the canvas control readable at a
              # glance: identical jpeg sha means the bitmap is shared, so a
              # differing png sha on the same row is the encoder and nothing else.
              same = "yes" if ra['digest'] == rb['digest'] else "no"
              print(f"| {ra['label']} | {av:.1f} | {bv:.1f} | {ratio} "
                    f"| {ra['bytes']} | {rb['bytes']} | {same} |")
          PY
          cat "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-diagnosis-${{ inputs.browser }}
          path: perf-out/
          if-no-files-found: warn
          retention-days: 30
