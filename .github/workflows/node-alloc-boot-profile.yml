name: node alloc + boot profile (node 26 gate rows)

# Why do alloc_buffers and boot_e0 breach node-perf-gate on node 26 (9V74,
# run 42308999875: alloc_buffers 271 vs ubuntu 240 ms, boot_e0 27.3 vs 25.2 ms)
# when node 24 sat at parity on the same CPU model (run 41931856074)? Each
# replicate is one runner; every arm is timed there, interleaved per round,
# with node/bench/alloc-boot-probe.cjs splitting each row into its parts.
# Round 3 times each arm three ways: the probe with the gate's live inputs
# (ballast), the same after the rows the gate runs first (prelude), and the
# gate's own node-perf-kernel.cjs as the control that the breach reproduces.
# Round 3 put alloc_buffers on the allocator: official node with mimalloc
# preloaded breaches as much as ours. Round 4 tried mimalloc's options on b26:
# none closed alloc_buffers, large OS pages lowered boot_e0 3-8% with the arm
# order fixed. Round 5 rotates the order to check that.
#
# Arms:
#   b26              alpine-dood-node:latest, Stage B node 26 (clang23, mimalloc LD_PRELOAD)
#   b26_purge_never  same, MIMALLOC_PURGE_DELAY=-1: freed pages are never returned
#   b26_thp          same, MIMALLOC_ALLOW_LARGE_OS_PAGES=1
#   ubuntu26         ubuntu-dood-node:latest (NodeSource, glibc)
#   off26            node:26.13.0-bookworm-slim
#   off26_mi         node:26.13.0-bookworm-slim with Debian's mimalloc LD_PRELOADed

on:
  workflow_dispatch:
    inputs:
      replicates:
        description: 'Runners (one job each)'
        default: '4'
      rounds:
        description: 'interleaved rounds per runner'
        default: '5'
      loop_seconds:
        description: 'perf stat / perf record loop length per arm and row'
        default: '10'

permissions:
  contents: read
  packages: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      replicate_list: ${{ steps.list.outputs.replicate_list }}
    steps:
      - id: list
        env:
          REPLICATES: ${{ inputs.replicates }}
        run: echo "replicate_list=$(python3 -c "import json,os; print(json.dumps(list(range(1, int(os.environ['REPLICATES']) + 1))))")" >> "$GITHUB_OUTPUT"

  profile:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        replicate: ${{ fromJSON(needs.matrix.outputs.replicate_list) }}
    env:
      ROUNDS: ${{ inputs.rounds }}
      LOOP_SECONDS: ${{ inputs.loop_seconds }}
      PROFILED_ARMS: b26 b26_thp off26
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Runner CPU and PMU
        run: |
          set -euo pipefail
          mkdir -p out && chmod 777 out
          grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ //' | tee out/cpu.txt
          sudo sysctl -w kernel.perf_event_paranoid=-1
          if python3 playwright/bench/pmu-check.py; then echo "HAVE_PMU=1" >> "$GITHUB_ENV"
          else echo "::warning::no PMU on $(cat out/cpu.txt): software counters only"; fi

      - name: Stage the arms
        run: |
          set -euo pipefail
          for image in ghcr.io/jclaveau/alpine-dood-node:latest ghcr.io/jclaveau/ubuntu-dood-node:latest \
                       node:26.13.0-bookworm-slim; do
            docker pull -q "$image"
          done
          mkdir -p mimalloc-src
          cat > mimalloc-src/Dockerfile <<'EOF'
          FROM node:26.13.0-bookworm-slim
          RUN apt-get update -qq && apt-get install -y -qq --no-install-recommends libmimalloc2.0 >/dev/null \
              && rm -rf /var/lib/apt/lists/* \
              && library_path=$(dpkg -L libmimalloc2.0 | grep -E '/libmimalloc\.so\.2' | head -n1) \
              && test -n "$library_path" \
              && ln -s "$library_path" /usr/local/lib/libmimalloc-preload.so
          ENV LD_PRELOAD=/usr/local/lib/libmimalloc-preload.so
          RUN node -e "if (!require('fs').readFileSync('/proc/self/maps', 'utf8').includes('mimalloc')) throw new Error('mimalloc is not mapped')"
          EOF
          docker build -q -t probe-arm:off26_mi mimalloc-src
          # <arm> <image> <docker run env flag or ->
          cat > out/arms.txt <<'EOF'
          b26 ghcr.io/jclaveau/alpine-dood-node:latest -
          b26_thp ghcr.io/jclaveau/alpine-dood-node:latest MIMALLOC_ALLOW_LARGE_OS_PAGES=1
          b26_purge_never ghcr.io/jclaveau/alpine-dood-node:latest MIMALLOC_PURGE_DELAY=-1
          ubuntu26 ghcr.io/jclaveau/ubuntu-dood-node:latest -
          off26 node:26.13.0-bookworm-slim -
          off26_mi probe-arm:off26_mi -
          EOF
          sed -i 's/^ *//' out/arms.txt
          cat out/arms.txt

      # Every arm runs this before it is timed: the A/B must vary what it says.
      - name: Build config and ELF of each node
        run: |
          set -euo pipefail
          while read -r arm image env_flag; do
            env_args=(); [ "$env_flag" = - ] || env_args=(--env "$env_flag")
            docker run --rm --user root "${env_args[@]}" --entrypoint node "$image" -e '
              const maps = require("fs").readFileSync("/proc/self/maps", "utf8");
              console.log(JSON.stringify({
                version: process.version, v8: process.versions.v8,
                ld_preload: process.env.LD_PRELOAD || "",
                mapped_allocators: [...new Set(maps.match(/\S*(malloc|jemalloc|tcmalloc)\S*/g) || [])],
                config: process.config.variables,
              }));' >| "out/config-$arm.json"
            node_path=$(docker run --rm --user root --entrypoint sh "$image" -c 'readlink -f "$(command -v node)"')
            container_id=$(docker create "$image")
            docker cp -q "$container_id:$node_path" "out/node-$arm"
            docker rm "$container_id" >/dev/null
            {
              echo "path $node_path size $(stat -c %s "out/node-$arm")"
              readelf -d "out/node-$arm" | grep -E 'NEEDED|FLAGS|RELR|RELACOUNT|BIND_NOW' || true
              readelf -SW "out/node-$arm" | grep -E '\] \.(text|rodata|data\.rel\.ro|data|bss|rela\.dyn|relr\.dyn|rela\.plt|lrodata|ldata|eh_frame|tbss|tdata) ' || true
              echo "dynamic relocations $(readelf -rW "out/node-$arm" | grep -cE '^[0-9a-f]{8,} ' || true)"
              echo "exported dynamic symbols $(readelf --dyn-syms -W "out/node-$arm" | grep -c ' GLOBAL ' || true)"
              echo "program headers"; readelf -lW "out/node-$arm" | grep -E 'LOAD|GNU_RELRO|GNU_STACK|TLS'
            } >| "out/elf-$arm.txt"
            rm "out/node-$arm"
            echo "--- $arm"; cat "out/elf-$arm.txt"
          done < out/arms.txt

      - name: Time every row, interleaved
        run: |
          set -euo pipefail
          mkdir -p out/kernel && chmod 777 out/kernel
          cat /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/defrag | tee out/thp.txt
          for round in $(seq 1 "$ROUNDS"); do
            # Rotated one arm per round, so no arm always runs first.
            arm_count=$(wc -l < out/arms.txt)
            { tail -n +"$(( (round - 1) % arm_count + 1 ))" out/arms.txt; head -n "$(( (round - 1) % arm_count ))" out/arms.txt; } >| out/arms-round.txt
            while read -r arm image env_flag; do
              env_args=(); [ "$env_flag" = - ] || env_args=(--env "$env_flag")
              docker run --rm "${env_args[@]}" --env PROBE_BALLAST=1 --entrypoint node -v "$PWD/node/bench:/bench:ro" \
                "$image" /bench/alloc-boot-probe.cjs time >| "out/ballast-$arm-$round.json" < /dev/null
              echo "round $round $arm ballast $(cat "out/ballast-$arm-$round.json")"
              docker run --rm "${env_args[@]}" --env PROBE_BALLAST=1 --env PROBE_PRELUDE=1 --entrypoint node \
                -v "$PWD/node/bench:/bench:ro" "$image" \
                /bench/alloc-boot-probe.cjs time >| "out/prelude-$arm-$round.json" < /dev/null
              echo "round $round $arm prelude $(cat "out/prelude-$arm-$round.json")"
              # As node-perf-gate runs it: the dood images as runner, the official ones as root.
              case "$arm" in off*) home=/root ;; *) home=/home/runner ;; esac
              docker run --rm "${env_args[@]}" --env "HOME=$home" --entrypoint node -v "$PWD/node/bench:/bench:ro" \
                -v "$PWD/out/kernel:/out" "$image" /bench/node-perf-kernel.cjs --target "$arm" --run "$round" --out /out \
                < /dev/null | grep -E ' (boot_e0|alloc_buffers) '
            done < out/arms-round.txt
          done

      - name: GC count of one alloc_touch run
        run: |
          set -euo pipefail
          while read -r arm image env_flag; do
            env_args=(); [ "$env_flag" = - ] || env_args=(--env "$env_flag")
            docker run --rm "${env_args[@]}" --entrypoint node -v "$PWD/node/bench:/bench:ro" "$image" \
              --trace-gc /bench/alloc-boot-probe.cjs once alloc_touch < /dev/null >| "out/gc-$arm.txt"
            echo "$arm $(grep -oE '(Scavenge|Mark-Compact|Mark-Sweep|Minor Mark-Sweep)' "out/gc-$arm.txt" | sort | uniq -c | tr '\n' ' ')"
          done < out/arms.txt

      - name: perf stat, strace and perf record per arm
        run: |
          set -euo pipefail
          if [ "${HAVE_PMU:-0}" = 1 ]; then
            stat_events=task-clock,page-faults,context-switches,cpu-migrations,cycles,instructions
            record_event=cycles
          else
            stat_events=task-clock,page-faults,context-switches,cpu-migrations
            record_event=cpu-clock
          fi
          while read -r arm image env_flag; do
            case " $PROFILED_ARMS " in *" $arm "*) ;; *) continue ;; esac
            env_args=(); [ "$env_flag" = - ] || env_args=(--env "$env_flag")
            docker run --rm --privileged --user root --security-opt seccomp=unconfined "${env_args[@]}" \
              --entrypoint sh -v "$PWD/node/bench:/bench:ro" -v "$PWD/out:/out" "$image" -c '
                set -e
                if command -v apk >/dev/null; then apk add --no-cache perf strace >/dev/null
                else apt-get update -qq && apt-get install -y -qq --no-install-recommends linux-perf strace >/dev/null; fi
                export PROBE_BALLAST=1 PROBE_PRELUDE=1
                suffix=-prelude
                for row in alloc_touch boot_e0; do
                  perf stat -x, -e '"$stat_events"' -o /out/stat-'"$arm"'-$row$suffix.csv -- \
                    node /bench/alloc-boot-probe.cjs loop $row '"$LOOP_SECONDS"' >| /out/loopcount-'"$arm"'-$row$suffix.txt
                  perf record -q -e '"$record_event"' -F 4999 -o /tmp/perf-$row.data -- \
                    node /bench/alloc-boot-probe.cjs loop $row '"$LOOP_SECONDS"' >/dev/null
                  perf report -f -i /tmp/perf-$row.data --no-children --no-inline --sort comm,dso,sym --stdio \
                    --percent-limit 0.1 2>/dev/null | grep -E "^ +[0-9]" | head -120 >| /out/report-'"$arm"'-$row$suffix.txt
                  perf report -f -i /tmp/perf-$row.data --no-children --sort comm,dso --stdio \
                    2>/dev/null | grep -E "^ +[0-9]" >| /out/dso-'"$arm"'-$row$suffix.txt
                done
                PROBE_PRELUDE=0 strace -f -e trace=clone,clone3,fork,vfork,execve,wait4 -o /out/spawn-'"$arm"'-ballast.txt \
                  node /bench/alloc-boot-probe.cjs once boot_e0
                export PROBE_BALLAST=0 PROBE_PRELUDE=0
                strace -f -c -o /out/strace-'"$arm"'-alloc_touch.txt node /bench/alloc-boot-probe.cjs once alloc_touch
                strace -f -c -o /out/strace-'"$arm"'-boot_e0.txt node -e 0
                strace -f -o /out/strace-full-'"$arm"'-boot_e0.txt node -e 0
              ' < /dev/null 2>&1 | tail -5
            sudo chown -R "$(id -u):$(id -g)" out
          done < out/arms.txt

      - name: Report
        if: always()
        run: |
          set -o pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, os, statistics
          cpu = open('out/cpu.txt').read().strip()
          print(f'## alloc + boot profile on {cpu}\n')
          arms = [line.split()[0] for line in open('out/arms.txt') if line.strip()]
          for variant, heading in (('ballast', 'With the gate kernel\'s 120 MB of live inputs (PROBE_BALLAST=1)'),
                                   ('prelude', 'Same, after the rows the gate runs before alloc_buffers (PROBE_PRELUDE=1)')):
              for key, unit in (('medians', 'CPU-ms'), ('faults', 'page faults')):
                  by_arm = {}
                  for arm in arms:
                      docs = [json.load(open(path)) for path in sorted(glob.glob(f'out/{variant}-{arm}-*.json'))]
                      if docs:
                          by_arm[arm] = {row: statistics.median(doc[key][row] for doc in docs) for row in docs[0][key]}
                  rows = list(next(iter(by_arm.values())).keys()) if by_arm else []
                  print(f'{heading}: {unit} per rep, median of the round medians; ratio vs off26\n')
                  print('| arm | ' + ' | '.join(rows) + ' |')
                  print('| --- |' + ' --- |' * len(rows))
                  for arm, by_row in by_arm.items():
                      cells = []
                      for row in rows:
                          reference = by_arm.get('off26', {}).get(row)
                          ratio = f' ({by_row[row] / reference:.3f}x)' if reference else ''
                          cells.append(f'{by_row[row]:.1f}{ratio}')
                      print(f'| {arm} | ' + ' | '.join(cells) + ' |')
                  print()
          kernel_medians = {}
          for arm in arms:
              docs = [json.load(open(path)) for path in sorted(glob.glob(f'out/kernel/{arm}-node-run*.json'))]
              if docs:
                  kernel_medians[arm] = {row: statistics.median(doc['metrics'][row]['median_ms'] for doc in docs)
                                         for row in ('boot_e0', 'alloc_buffers')}
          print('The gate\'s own node-perf-kernel.cjs: CPU-ms; ratio vs off26\n')
          print('| arm | boot_e0 | alloc_buffers |\n| --- | --- | --- |')
          for arm, by_row in kernel_medians.items():
              reference = kernel_medians.get('off26', {})
              print(f'| {arm} | ' + ' | '.join(
                  f'{by_row[row]:.1f}' + (f' ({by_row[row] / reference[row]:.3f}x)' if row in reference else '')
                  for row in ('boot_e0', 'alloc_buffers')) + ' |')
          print()
          for arm in arms:
              path = f'out/gc-{arm}.txt'
              if os.path.exists(path):
                  kinds = {}
                  for line in open(path):
                      for kind in ('Minor Mark-Sweep', 'Scavenge', 'Mark-Compact', 'Mark-Sweep'):
                          if kind in line:
                              kinds[kind] = kinds.get(kind, 0) + 1
                              break
                  print(f'- gc {arm}: {json.dumps(kinds)}')
          print()
          for arm in arms:
              for row in ('alloc_touch', 'boot_e0'):
                  stat_path = f'out/stat-{arm}-{row}-prelude.csv'
                  if not os.path.exists(stat_path):
                      continue
                  loop_line = open(f'out/loopcount-{arm}-{row}-prelude.txt').read().split()
                  run_count = int(loop_line[2])
                  counters = []
                  for line in open(stat_path):
                      fields = line.strip().split(',')
                      if len(fields) > 3 and fields[0][:1].isdigit():
                          counters.append(f'{fields[2]} {float(fields[0]) / run_count:,.1f}')
                  print(f'- per {row} run, {arm} ({run_count} runs): ' + ', '.join(counters))
          print()
          for arm in arms:
              for row in ('alloc_touch', 'boot_e0'):
                  for kind, suffix in (('strace', ''), ('report', '-prelude')):
                      path = f'out/{kind}-{arm}-{row}{suffix}.txt'
                      if os.path.exists(path):
                          print(f'### {kind} {arm} {row}\n```')
                          print(''.join(open(path).readlines()[:40]))
                          print('```')
          for arm in arms:
              path = f'out/elf-{arm}.txt'
              if os.path.exists(path):
                  print(f'### elf {arm}\n```\n{open(path).read()}```')
          print('=== DONE ===')
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: node-alloc-boot-profile-${{ matrix.replicate }}
          path: out/
          retention-days: 90
