name: WebKit persistent-context probe

# One-shot bisection for the launchPersistentContext hang that accounts for 64 of
# WebKit 26.5's 155 conformance failures (defaultbrowsercontext-1/-2 36,
# page-close 18, browsercontext-storage-state 10). They all time out on the FIRST
# line, before a page exists; everything after in the same worker then reports
# "Test ended", which is what made one hang look like ~90 crashes.
#
# Runs against an ALREADY-BUILT artifact, so an iteration is ~10 minutes rather
# than the ~10h a WebKit rebuild costs. Re-dispatch with a different image_ref to
# compare builds, or edit the probe to add a variant.

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: WebKit artifact to probe
        default: ghcr.io/jclaveau/playwright-alpine-browsers:wk-edge
        type: string
      pw_version:
        description: PW SDK version to install in the runner
        default: '1.62.1'
        type: string
      artifact_rev:
        description: WK_REV to stage at PW's cache path (webkit browsers.json revision)
        default: '2336'
        type: string
      timeout_ms:
        description: Per-variant timeout
        default: '25000'
        type: string
      isolated_spec:
        description: >-
          Spec file to run ISOLATED inside the same runner, after the variants.
          Every launchPersistentContext variant passes standalone in ~400ms, yet
          the same calls time out at 30s in the suite — so the question is no
          longer whether the API works but whether an earlier test wedges the
          worker. In shard 7 the first failure was client-certificates.spec.ts
          and defaultbrowsercontext only failed after it.
        default: 'tests/library/defaultbrowsercontext-1.spec.ts'
        type: string

concurrency:
  group: wk-persistent-probe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the CONFORMANCE runner (not a hand-rolled one)
        env:
          BROWSER: webkit
          IMAGE_REF: ${{ inputs.image_ref }}
          PW_VERSION: ${{ inputs.pw_version }}
          ARTIFACT_REV: ${{ inputs.artifact_rev }}
          HEADED: '0'
          IMAGE_TAG_OUT: wkprobe:${{ github.run_id }}
        # build-runner.sh IS what the conformance shards run, strip and all.
        # The first version of this probe hand-rolled an apk list and its image
        # build died on the strip's ldd gate — "WPENetworkProcess has 103
        # unresolved deps", libavif missing libyuv symbols — because the list
        # omitted libyuv/aom-libs/dav1d/libjxl/libhwy. Re-deriving a list that
        # already exists is how the probe ends up testing something other than
        # the thing under investigation.
        run: ./playwright/alpine-browsers/conformance/build-runner.sh

      - name: Run the probe
        run: |
          # Same sandbox strip the conformance shards use for WebKit — WPE's bwrap
          # needs seccomp+apparmor unconfined AND the caps AND the escape hatch.
          docker run --rm \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --cap-add SYS_ADMIN --cap-add NET_ADMIN \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            -e WEBKIT_FORCE_SANDBOX=0 \
            -v "$PWD/playwright/alpine-browsers/conformance/debug:/debug:ro" \
            -e NODE_PATH=/usr/local/lib/node_modules:/usr/lib/node_modules \
            wkprobe:${{ github.run_id }} \
            node /debug/probe-persistent-context.cjs --timeout ${{ inputs.timeout_ms }} \
            2>&1 | tee /tmp/probe.log
          {
            echo '## WebKit persistent-context probe'
            echo
            echo '```'
            grep -E '^(PASS|FAIL|---|  )' /tmp/probe.log || cat /tmp/probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the spec ISOLATED in the same runner
        if: inputs.isolated_spec != ''
        run: |
          # /pw-src does not exist in the runner image: build-runner.sh stages the
          # browser, and run.sh clones + builds Playwright at RUNTIME. The previous
          # attempt skipped that and died on "playwright.config.ts does not exist".
          # Same clone/build run.sh performs, then ONE spec instead of a shard.
          docker run --rm \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --cap-add SYS_ADMIN --cap-add NET_ADMIN \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            -e WEBKIT_FORCE_SANDBOX=0 \
            -e PROBE_PW_TAG=v${{ inputs.pw_version }} \
            -e SPEC="${{ inputs.isolated_spec }}" \
            wkprobe:${{ github.run_id }} \
            bash -c '
              set -e
              git clone --depth 1 --branch "$PROBE_PW_TAG" \
                https://github.com/microsoft/playwright.git /pw-src
              cd /pw-src
              npm ci --no-audit --no-fund --prefer-offline
              npm run build
              # One test, generous timeout, protocol logging. The 30s timeout tells
              # us nothing about WHERE it stalls; pw:protocol shows the last
              # message the driver sent and whether the browser ever answered.
              # pw:api names the CLIENT-side call that never resolves; pw:protocol
              # shows whether the browser was ever asked. The pair distinguishes
              # "driver never sent it" from "browser never answered".
              DEBUG=pw:api,pw:browser,pw:protocol \
              npx playwright test --config=tests/library/playwright.config.ts \
                --project=webkit-library --workers=1 --retries=0 --reporter=list \
                --timeout=90000 -g "context.cookies" \
                "$SPEC" 2>&1 | tail -400
            ' 2>&1 | tee /tmp/isolated.log || true
          {
            echo
            echo "### Isolated \`${{ inputs.isolated_spec }}\`"
            echo
            echo '```'
            grep -E "passed|failed|✓|✘|Error:|Timeout" /tmp/isolated.log | tail -40 || tail -30 /tmp/isolated.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
