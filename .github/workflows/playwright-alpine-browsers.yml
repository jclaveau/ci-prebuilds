name: Playwright Alpine Browsers

# Producer workflow for the patched-on-musl browser artifact image. Runs on its
# own cadence — the build is ~1.5–2.5h and only needs to rerun when Playwright
# rolls its `browser_patches/firefox/` upstream (~every 6–8 weeks). The main
# `test-and-publish.yml` consumes the published tag, not this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'playwright/alpine-browsers/**'
      - '.github/workflows/playwright-alpine-browsers.yml'
  pull_request:
    paths:
      - 'playwright/alpine-browsers/**'
      - '.github/workflows/playwright-alpine-browsers.yml'
  # Catalog accumulator: weekly cron grabs whatever alpine:edge currently
  # ships as chromium-headless-shell and publishes it as chs-${rev} where
  # ${rev} is derived from versions.env's PW_VERSION default. Without this,
  # once alpine:edge moves to a newer chromium pkgver, the old chs-${rev}
  # tag stays as the last successful publish but no NEW tags accumulate
  # for in-between PW versions. The cron locks in each alpine:edge state
  # against the matching PW pin while the apk is still pullable. Sundays
  # at 06:00 UTC — outside typical PR / on-demand traffic windows.
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      # PW version override. When set, the producer derives CHS_REV / FF_REV
      # from this version's `playwright-core@${pw_version}/browsers.json`
      # instead of the versions.env default. The resulting tag (chs-${REV})
      # is named after THAT PW pin even if alpine:edge currently ships a
      # different chromium pkgver — drift detection in the build script
      # bakes a warning file into the artifact, surfaced at consumer image
      # build time. Empty = use versions.env's PW_VERSION (default flow).
      pw_version:
        description: 'PW version to derive CHS_REV/FF_REV from (empty = versions.env default)'
        required: false
        default: ''
        type: string
      # Which browser(s) to build. Default firefox=false, chromium=true: the
      # FF artifact is already green + cached, and chromium is the active
      # diagnostic frontier — most manual dispatches want chromium only.
      # Flip to true if you want FF rebuilt (cache bump, FF patch reroll, etc).
      build_firefox:
        description: 'Build Firefox (musl, PW-patched) — default off; flip on for a FF rebuild'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      build_chromium_headless_shell:
        description: 'Build chromium-headless-shell (musl) — default on'
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']
      diagnostic:
        description: 'Run Tier-3 diagnostic (symbol dump, JS Juggler load trace)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      juggler_order_first:
        description: 'PW_JUGGLER_ORDER_FIRST: move /juggler before /remote in DIRS'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      juggler_category_rename:
        description: 'PW_JUGGLER_CATEGORY_RENAME: rename m-remote → m-juggler'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      juggler_instrument:
        description: 'PW_JUGGLER_INSTRUMENT: inject dump() trace points into Juggler.js'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      juggler_service_bootstrap:
        description: 'PW_JUGGLER_SERVICE_BOOTSTRAP: profile-after-change → service,@mozilla.org/remote/juggler;1 (fix for Mozilla RemoteAgent shadowing m-remote)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      use_prebuilt:
        description: 'Use prebuilt-base image (fast iteration; requires prebuilt-base-ff-<rev> to exist on GHCR)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      chromium_skip_aports:
        description: 'PW_CHROMIUM_SKIP_APORTS: chromium build without aports musl patches (glibc-debug equivalent)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      test_firefox_library_upstream:
        description: 'Run microsoft/playwright tests/library/ (curated subset, ~15-25min) against the just-built FF artifact'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      chromium_enable_debug:
        description: 'PW_CHROMIUM_ENABLE_DEBUG: is_debug=true + dcheck_always_on=true (validation track)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      # WebKit gate. Default off because cold cold-build is multi-hour (WPE
      # then GTK, sccache-shared); this is dispatch- and label-gated only.
      # No push/main trigger and no schedule — too expensive to run by
      # accident. Promote runs only on main pushes that flip this on
      # explicitly (or via the `build-webkit` PR label).
      build_webkit:
        description: 'Build WebKit (musl, PW-patched WPE+GTK) — default off; multi-hour cold build'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      webkit_enable_jit:
        description: 'WebKit ENABLE_JIT (default ON; flip OFF if JSC+musl JIT blocks)'
        required: false
        default: 'ON'
        type: choice
        options: ['ON', 'OFF']

# Never abort an in-flight 2h build — the cost of restarting outweighs the cost
# of finishing a stale one.
concurrency:
  group: playwright-alpine-browsers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: write   # so the cancel-on-fail step can call /actions/runs/<id>/cancel

env:
  # Surface workflow_dispatch's pw_version input to every step's PW_VERSION
  # resolution. The `pins` steps source versions.env then check this — if
  # non-empty, it wins. Empty on push/PR events; set only when the user
  # explicitly picks a non-default PW pin via workflow_dispatch.
  PW_VERSION_OVERRIDE: ${{ inputs.pw_version || '' }}

jobs:
  build-firefox:
    # FF gate. Runs on:
    # - push to main: always (canonical promotion path)
    # - workflow_dispatch: only when build_firefox=true (default off — see
    #   inputs above for rationale)
    # - pull_request: only when the `build-firefox` label is on the PR
    if: |
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.build_firefox == 'true')
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-firefox'))
    runs-on: ubuntu-latest
    timeout-minutes: 240   # 4h ceiling — clean build ~2h, hot rebuild ~30 min
    outputs:
      build_tag: sha-${{ github.sha }}
      pw_version: ${{ steps.pins.outputs.pw_version }}
      firefox_revision: ${{ steps.pins.outputs.firefox_revision }}
      firefox_version: ${{ steps.pins.outputs.firefox_version }}
    steps:
      - uses: actions/checkout@v4

      # Read versions.env into both step env (for shell expansions) and job
      # outputs (for downstream jobs / publish tags).
      - id: pins
        run: |
          set -a; . playwright/alpine-browsers/versions.env; set +a
          # workflow_dispatch override: if `pw_version` input was set, it wins
          # over versions.env's PW_VERSION default. Powers the on-demand path
          # where a different PW pin (e.g. 1.59.1) needs its own chs/ff rev.
          if [ -n "${PW_VERSION_OVERRIDE:-}" ]; then
            echo "pin override: PW_VERSION=$PW_VERSION → $PW_VERSION_OVERRIDE (workflow_dispatch input)"
            PW_VERSION="$PW_VERSION_OVERRIDE"
          fi
          echo "pw_version=$PW_VERSION" >> "$GITHUB_OUTPUT"
          # Resolve PW's pinned firefox revision + version from the matching
          # playwright-core npm package's browsers.json. Single source of truth.
          BROWSERS_JSON=$(curl -fsSL "https://unpkg.com/playwright-core@${PW_VERSION}/browsers.json")
          REV=$(jq -r '.browsers[] | select(.name=="firefox") | .revision' <<<"$BROWSERS_JSON")
          VER=$(jq -r '.browsers[] | select(.name=="firefox") | .browserVersion' <<<"$BROWSERS_JSON")
          echo "firefox_revision=$REV" >> "$GITHUB_OUTPUT"
          echo "firefox_version=$VER" >> "$GITHUB_OUTPUT"
          echo "PW v${PW_VERSION} → firefox revision=${REV} browserVersion=${VER}"

      - name: Free up runner disk (FF source + obj dir is ~15 GB)
        run: |
          # Standard GHA hosted-runner cleanup recipe. Frees ~30 GB.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jclaveau/playwright-alpine-browsers
          # Run-scoped sha tag + moving edge (consumer tags added by `promote` only on main).
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=edge,enable=${{ github.event_name != 'pull_request' }}

      # Pick between full cold build (Dockerfile, ~2h) and incremental
      # iteration FROM the prebuilt-base image (Dockerfile.iter, ~5 min).
      # Selection logic:
      # - workflow_dispatch use_prebuilt=true  → force iter (explicit override)
      # - workflow_dispatch use_prebuilt=false → force cold (explicit override)
      # - PR / push events                     → auto: iter if prebuilt-base-
      #   ff-${rev} exists on GHCR, else cold. Lets PR iteration loops finish
      #   in ~10min instead of ~3h, transparently.
      #
      # Why not always iter: BuildKit's --mount=type=cache mounts don't export
      # via cache-to=registry (verified by inspecting the buildcache config —
      # zero exec.cachemount records). So obj/.mozbuild/sccache go cold every
      # GHA run. The prebuilt-base path sidesteps that by shipping obj/ as
      # image layers (cache-from CAN restore those). When prebuilt-base hasn't
      # been published yet (fresh FF revision), we still need the cold path
      # once to seed it.
      - id: dockerfile-choice
        env:
          BASE_TAG: ghcr.io/jclaveau/playwright-alpine-browsers:prebuilt-base-ff-${{ steps.pins.outputs.firefox_revision }}
        run: |
          choose_iter() {
            echo "file=playwright/alpine-browsers/Dockerfile.iter" >> "$GITHUB_OUTPUT"
            echo "base=$BASE_TAG" >> "$GITHUB_OUTPUT"
            echo "::notice::iter path: FROM $BASE_TAG"
          }
          choose_cold() {
            echo "file=playwright/alpine-browsers/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "::notice::cold path: full Dockerfile build (no prebuilt-base for ff-${{ steps.pins.outputs.firefox_revision }})"
          }
          case "${{ inputs.use_prebuilt }}" in
            true)  choose_iter ;;
            false) choose_cold ;;
            "")
              # Auto-select. Pre-flight: does the prebuilt-base tag exist?
              if docker manifest inspect "$BASE_TAG" >/dev/null 2>&1; then
                choose_iter
              else
                choose_cold
              fi
              ;;
          esac

      - name: Build artifact image
        uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: ${{ steps.dockerfile-choice.outputs.file }}
          target: artifact
          # Always push to GHCR so the smoke + promote jobs can pull it. PR
          # builds push under the throwaway sha tag only (no `edge`).
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache (GHCR-backed) instead of type=gha: no 10 GB quota,
          # better persistence of --mount=type=cache mounts across runs. The
          # cache lives at the producer image's :buildcache tag.
          cache-from: type=registry,ref=ghcr.io/jclaveau/playwright-alpine-browsers:buildcache
          cache-to: type=registry,ref=ghcr.io/jclaveau/playwright-alpine-browsers:buildcache,mode=max
          # Diagnostic experiment flags piped from workflow_dispatch inputs (or
          # repository_dispatch). They become build-args that the Dockerfile's
          # heavy RUN forwards into apply-and-build.sh via env. Default off.
          # BASE_PREBUILT is empty in the cold-build path (Dockerfile ignores
          # it); set to the prebuilt-base tag when use_prebuilt=true so
          # Dockerfile.iter's `FROM ${BASE_PREBUILT}` resolves.
          build-args: |
            PW_JUGGLER_ORDER_FIRST=${{ inputs.juggler_order_first || 'false' }}
            PW_JUGGLER_CATEGORY_RENAME=${{ inputs.juggler_category_rename || 'false' }}
            PW_JUGGLER_INSTRUMENT=${{ inputs.juggler_instrument || 'false' }}
            PW_JUGGLER_SERVICE_BOOTSTRAP=${{ inputs.juggler_service_bootstrap || 'false' }}
            BASE_PREBUILT=${{ steps.dockerfile-choice.outputs.base }}

      # Tier-1 smoke: the binary self-identifies. Catches build-succeeded-but-
      # binary-broken. We pull just the artifact image and run firefox --version
      # — but the artifact is `FROM scratch` so we need a shell from elsewhere.
      # Trick: COPY the artifact into a throwaway runner with libs + a shell.
      #
      # Runner uses alpine:edge to match the builder's libc/icu/etc; we link
      # against system libs (--with-system-*) so the runtime needs the same
      # ABI. LD_LIBRARY_PATH points at the firefox dir because our build's
      # RUNPATH is currently /usr/lib/firefox (a leftover from aports' install
      # layout — fix-up later). The version reported is Playwright's pinned
      # browserVersion, not necessarily Mozilla's release name (PW maintains
      # its own version string), so we only assert "Mozilla Firefox" prefix.
      - name: Tier-1 smoke (firefox --version)
        run: |
          cat > /tmp/Dockerfile.t1 <<EOF
          FROM alpine:edge
          RUN apk add --no-cache \\
              alsa-lib dbus-libs fontconfig freetype glib gtk+3.0 harfbuzz \\
              icu-libs libevent libffi libjpeg-turbo libnotify libogg \\
              libtheora libvorbis libvpx libwebp libwebp-tools libxcomposite \\
              libxt mesa-gl mesa-dri-gallium nspr nss pipewire-libs libpulse \\
              ttf-freefont
          COPY --from=ghcr.io/jclaveau/playwright-alpine-browsers:sha-${{ github.sha }} /firefox /opt/playwright/firefox
          ENV LD_LIBRARY_PATH=/opt/playwright/firefox
          EOF
          docker build -t t1-smoke:${{ github.sha }} -f /tmp/Dockerfile.t1 /tmp
          OUT=$(docker run --rm t1-smoke:${{ github.sha }} /opt/playwright/firefox/firefox --version 2>&1 || true)
          echo "firefox --version output:"
          echo "$OUT"
          echo "$OUT" | grep -E "Mozilla Firefox [0-9]+\\." \
            || { echo "Tier-1: firefox didn't self-identify"; exit 1; }

  smoke-firefox:
    # Tier-2: drive Firefox through the Playwright SDK enough to exercise
    # Juggler (launch, navigate, route, screenshot). If patches are broken,
    # newContext() or goto() hangs/throws.
    needs: build-firefox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build a candidate Alpine runner consuming the artifact
        run: |
          cat > /tmp/Dockerfile.runner <<EOF
          FROM alpine:edge
          RUN apk add --no-cache \\
              nodejs npm bash \\
              alsa-lib dbus-libs fontconfig freetype glib gtk+3.0 harfbuzz \\
              icu-libs libevent libffi libjpeg-turbo libnotify libogg \\
              libtheora libvorbis libvpx libwebp libwebp-tools libxcomposite \\
              libxt mesa-gl mesa-dri-gallium nspr nss pipewire-libs libpulse \\
              ttf-freefont
          COPY --from=ghcr.io/jclaveau/playwright-alpine-browsers:sha-${{ github.sha }} /firefox /opt/playwright/firefox
          ENV PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          ENV PLAYWRIGHT_FIREFOX_EXECUTABLE_PATH=/opt/playwright/firefox/firefox
          ENV LD_LIBRARY_PATH=/opt/playwright/firefox
          WORKDIR /smoke
          RUN npm install -g playwright@${{ needs.build-firefox.outputs.pw_version }}
          EOF
          docker build -t candidate-runner:${{ github.sha }} -f /tmp/Dockerfile.runner /tmp

      - name: Run Tier-2 smoke (Juggler-driven SDK calls)
        run: |
          # --security-opt seccomp=unconfined: Docker default seccomp blocks
          # clone(CLONE_NEWUSER) which Firefox needs for its renderer sandbox.
          # Without this Juggler can't start its content processes and
          # browser.launch() times out at 180s.
          # DEBUG=pw:browser surfaces stderr from the Firefox child process,
          # including any dump() traces injected by PW_JUGGLER_INSTRUMENT.
          docker run --rm \
            --security-opt seccomp=unconfined \
            -v "$PWD/playwright/alpine-browsers/firefox/smoke:/smoke" \
            -w /smoke \
            -e NODE_PATH=/usr/local/lib/node_modules \
            -e DEBUG=pw:browser \
            candidate-runner:${{ github.sha }} \
            node launch.cjs

  smoke-firefox-library:
    # Tier-2.5 — exercises Juggler RPCs that surface PW library features
    # (multi-context isolation, frames, evaluate boundary, dialogs, response
    # observation, ...). smoke-firefox covers the launch path; this catches
    # protocol-level regressions in the library surface above it.
    #
    # Reuses the same candidate-runner image as smoke-firefox would build,
    # so the only added wall-clock is the script itself (~30-45s for one
    # browser launch + 8 context-scoped sections).
    needs: build-firefox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build a candidate Alpine runner consuming the artifact
        run: |
          cat > /tmp/Dockerfile.runner <<EOF
          FROM alpine:edge
          RUN apk add --no-cache \\
              nodejs npm bash \\
              alsa-lib dbus-libs fontconfig freetype glib gtk+3.0 harfbuzz \\
              icu-libs libevent libffi libjpeg-turbo libnotify libogg \\
              libtheora libvorbis libvpx libwebp libwebp-tools libxcomposite \\
              libxt mesa-gl mesa-dri-gallium nspr nss pipewire-libs libpulse \\
              ttf-freefont
          COPY --from=ghcr.io/jclaveau/playwright-alpine-browsers:sha-${{ github.sha }} /firefox /opt/playwright/firefox
          ENV PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          ENV PLAYWRIGHT_FIREFOX_EXECUTABLE_PATH=/opt/playwright/firefox/firefox
          ENV LD_LIBRARY_PATH=/opt/playwright/firefox
          WORKDIR /smoke
          RUN npm install -g playwright@${{ needs.build-firefox.outputs.pw_version }}
          EOF
          docker build -t candidate-runner-library:${{ github.sha }} -f /tmp/Dockerfile.runner /tmp

      - name: Run library-surface smoke (8 Juggler RPCs)
        run: |
          # --security-opt seccomp=unconfined: same reason as smoke-firefox —
          # Docker's default seccomp blocks clone(CLONE_NEWUSER) which FF
          # needs for its renderer sandbox.
          docker run --rm \
            --security-opt seccomp=unconfined \
            -v "$PWD/playwright/alpine-browsers/firefox/library-smoke:/smoke" \
            -w /smoke \
            -e NODE_PATH=/usr/local/lib/node_modules \
            -e DEBUG=pw:browser \
            candidate-runner-library:${{ github.sha }} \
            node library-smoke.cjs

  test-firefox-library-upstream:
    # Phase B (DISABLED, see #60) — clone microsoft/playwright at the matching
    # PW_VERSION tag, set FFPATH to our artifact, run a curated subset of
    # tests/library/. Intent: PW maintainers' own harness as a second opinion
    # next to our smoke-firefox-library.
    #
    # Why disabled: PW's runner hangs at Juggler handshake on our musl FF —
    # every test launches FF, sits idle 3min (PW's default testTimeout),
    # SIGKILL, repeat. No reporter output ever emitted. smoke-firefox-library
    # passes in 22s with the SAME binary, so the divergence is in PW's
    # fixture layer (tests/library/playwright.config.ts), not the binary.
    # See #60 for evidence + investigation pointers.
    #
    # Re-enable: drop `if: false`, restore the label/workflow_dispatch gate:
    #   if: |
    #     (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-firefox-upstream'))
    #     || (github.event_name == 'workflow_dispatch' && inputs.test_firefox_library_upstream == 'true')
    needs: build-firefox
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build a candidate Alpine runner consuming the artifact
        run: |
          # Runner needs: nodejs+npm for PW dev install, git for the clone,
          # build-base + python3 for any node-gyp deps that compile native,
          # plus the same FF runtime apk list as smoke-firefox.
          cat > /tmp/Dockerfile.runner <<EOF
          FROM alpine:edge
          RUN apk add --no-cache \\
              nodejs npm bash git build-base python3 \\
              alsa-lib dbus-libs fontconfig freetype glib gtk+3.0 harfbuzz \\
              icu-libs libevent libffi libjpeg-turbo libnotify libogg \\
              libtheora libvorbis libvpx libwebp libwebp-tools libxcomposite \\
              libxt mesa-gl mesa-dri-gallium nspr nss pipewire-libs libpulse \\
              ttf-freefont
          COPY --from=ghcr.io/jclaveau/playwright-alpine-browsers:sha-${{ github.sha }} /firefox /opt/playwright/firefox
          ENV LD_LIBRARY_PATH=/opt/playwright/firefox
          EOF
          docker build -t ff-upstream-runner:${{ github.sha }} -f /tmp/Dockerfile.runner /tmp

      - name: Run upstream library subset (curated, ~15-25min)
        run: |
          # --security-opt seccomp=unconfined: FF renderer sandbox needs
          # clone(CLONE_NEWUSER), same as smoke-firefox.
          docker run --rm \
            --security-opt seccomp=unconfined \
            -v "$PWD/playwright/alpine-browsers/firefox/library-upstream:/runner" \
            -w /runner \
            -e PW_VERSION=${{ needs.build-firefox.outputs.pw_version }} \
            -e FFPATH=/opt/playwright/firefox/firefox \
            -e DEBUG=pw:browser \
            ff-upstream-runner:${{ github.sha }} \
            sh /runner/run.sh

  diagnostic-firefox:
    # Tier-3 diagnostic: dump symbols + manifests + JS Juggler load trace from
    # the just-built artifact. Gated on workflow_dispatch with diagnostic=true
    # so normal PRs don't pay the extra ~5 min.
    needs: build-firefox
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull artifact + build inspect image
        run: |
          cat > /tmp/Dockerfile.inspect <<EOF
          FROM alpine:edge
          RUN apk add --no-cache \\
              binutils unzip file \\
              alsa-lib dbus-libs fontconfig freetype glib gtk+3.0 harfbuzz \\
              icu-libs libevent libffi libjpeg-turbo libnotify libogg \\
              libtheora libvorbis libvpx libwebp libwebp-tools libxcomposite \\
              libxt mesa-gl mesa-dri-gallium nspr nss pipewire-libs libpulse \\
              ttf-freefont
          COPY --from=ghcr.io/jclaveau/playwright-alpine-browsers:sha-${{ github.sha }} /firefox /opt/playwright/firefox
          ENV LD_LIBRARY_PATH=/opt/playwright/firefox
          EOF
          docker build -t inspect:${{ github.sha }} -f /tmp/Dockerfile.inspect /tmp

      - name: Dump libxul symbols (Juggler + RemoteAgent component table)
        run: |
          docker run --rm inspect:${{ github.sha }} sh -c '
            echo "=== Juggler C++ symbols ==="
            nm --defined-only /opt/playwright/firefox/libxul.so 2>/dev/null \
              | grep -iE "juggler|remoteDebuggingPipe|screencastService|RemoteAgent" \
              | head -40
            echo ""
            echo "=== Static-component strings near m-remote ==="
            strings /opt/playwright/firefox/libxul.so 2>/dev/null \
              | grep -E "command-line-handler|m-remote|m-juggler|@mozilla.org/remote/(agent|juggler)" \
              | sort -u
            echo ""
            echo "=== Where do m-remote occurrences sit in the static table? ==="
            # Print neighboring strings for ordering insight — Mozilla static_components
            # is generated as a flat C++ table; strings appear in registration order.
            strings -t d /opt/playwright/firefox/libxul.so 2>/dev/null \
              | awk "/m-remote|m-juggler|@mozilla.org\/remote\/(agent|juggler)/" \
              | sort -n | head -20
          '

      - name: Dump omni.ja manifests
        run: |
          docker run --rm inspect:${{ github.sha }} sh -c '
            cd /tmp && unzip -q /opt/playwright/firefox/omni.ja -d oj
            echo "=== chrome.manifest (juggler-related lines) ==="
            grep -i juggler oj/chrome/chrome.manifest || echo "(no juggler entries)"
            echo ""
            echo "=== components/components.manifest (juggler/m-remote/category lines) ==="
            grep -iE "juggler|m-remote|command-line-handler" oj/components/components.manifest || echo "(no entries)"
            echo ""
            echo "=== Juggler.js excerpt (classID + categories) ==="
            head -40 oj/chrome/juggler/content/components/Juggler.js || echo "(missing Juggler.js)"
          '

      - name: Run firefox --help (does --juggler-pipe register?)
        run: |
          docker run --rm --security-opt seccomp=unconfined inspect:${{ github.sha }} \
            /opt/playwright/firefox/firefox --help 2>&1 | grep -iE "juggler|remote|marionette|debugger" || echo "(no juggler/remote in --help)"

      - name: Capture firefox startup logs (Juggler load trace)
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -e MOZ_LOG='CommandLine:5,Module:5,nsComponentManager:5,nsCategoryManager:5' \
            -e MOZ_LOG_FILE=/tmp/moz.log \
            inspect:${{ github.sha }} sh -c '
              timeout 8 /opt/playwright/firefox/firefox -no-remote -headless -profile /tmp/p -juggler-pipe < /dev/null 3<>/dev/null 4<>/dev/null 2>/tmp/stderr.log || true
              echo "=== stderr ==="
              tail -100 /tmp/stderr.log
              echo ""
              echo "=== moz.log (juggler-related) ==="
              ls -la /tmp/moz.log* 2>/dev/null
              cat /tmp/moz.log* 2>/dev/null | grep -iE "juggler|m-remote|command-line" | head -50 || echo "(no moz.log juggler entries)"
            '

  promote-firefox:
    # Only on main pushes: copy the GHCR sha tag to Docker Hub under
    # version-pinned + moving tags. Imagetools server-side copy — no rebuild.
    needs: [build-firefox, smoke-firefox, smoke-firefox-library]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote FF → GHCR + Docker Hub
        env:
          SRC: ghcr.io/jclaveau/playwright-alpine-browsers:sha-${{ github.sha }}
          REV: ${{ needs.build-firefox.outputs.firefox_revision }}
          VER: ${{ needs.build-firefox.outputs.firefox_version }}
        # Dual-target imagetools push: same digest tagged to both GHCR and
        # Docker Hub in one server-side copy. CI (playwright/Dockerfile.alpine
        # COPY --from) consumes the GHCR ref to avoid DH's anonymous-pull
        # rate limit; DH tags are the external catalog entry.
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/jclaveau/playwright-alpine-browsers:ff-${REV}" \
            -t "ghcr.io/jclaveau/playwright-alpine-browsers:ff-${VER}" \
            -t ghcr.io/jclaveau/playwright-alpine-browsers:ff-latest \
            -t "jclaveau/playwright-alpine-browsers:ff-${REV}" \
            -t "jclaveau/playwright-alpine-browsers:ff-${VER}" \
            -t jclaveau/playwright-alpine-browsers:ff-latest \
            -t "jclaveau/playwright-alpine-browsers:sha-${{ github.sha }}" \
            "$SRC"

  promote-chromium-headless-shell:
    # Parallel promote for the apk-fast-path chromium artifact. Same dual-
    # target shape as FF promote: GHCR for CI consumption, DH for external.
    # Triggers:
    # - push to main (canonical promotion path; uses versions.env default PW)
    # - workflow_dispatch with build_chromium_headless_shell=true (on-demand
    #   catalog accumulation: dispatcher can pass pw_version to publish the
    #   chs-${rev} tag matching a non-default PW pin)
    needs: [build-chromium-headless-shell, smoke-chromium-headless-shell]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.build_chromium_headless_shell == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote chromium-headless-shell → GHCR + Docker Hub
        env:
          SRC: ghcr.io/jclaveau/playwright-alpine-browsers:chs-sha-${{ github.sha }}
          REV: ${{ needs.build-chromium-headless-shell.outputs.chromium_revision }}
          VER: ${{ needs.build-chromium-headless-shell.outputs.chromium_version }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/jclaveau/playwright-alpine-browsers:chs-${REV}" \
            -t "ghcr.io/jclaveau/playwright-alpine-browsers:chs-${VER}" \
            -t ghcr.io/jclaveau/playwright-alpine-browsers:chs-latest \
            -t "jclaveau/playwright-alpine-browsers:chs-${REV}" \
            -t "jclaveau/playwright-alpine-browsers:chs-${VER}" \
            -t jclaveau/playwright-alpine-browsers:chs-latest \
            -t "jclaveau/playwright-alpine-browsers:chs-sha-${{ github.sha }}" \
            "$SRC"

  # ── Chromium-headless-shell — apk fast path ────────────────────────────────
  # Alpine community/chromium ships `chromium-headless-shell` as a subpackage
  # (148.0.7778.178-r0 today, same minor as PW's pin 148.0.7778.96). Extract
  # + repackage into PW's auto-discovery shape. ~5 sec build vs ~12h
  # from-source.
  build-chromium-headless-shell:
    if: |
      github.event_name == 'push'
      || github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.build_chromium_headless_shell == 'true')
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-chromium-headless-shell'))
    runs-on: ubuntu-latest
    timeout-minutes: 15   # apk fetch is sub-minute; padding for image push
    outputs:
      build_tag: chs-sha-${{ github.sha }}
      pw_version: ${{ steps.pins.outputs.pw_version }}
      chromium_revision: ${{ steps.pins.outputs.chromium_revision }}
      chromium_version: ${{ steps.pins.outputs.chromium_version }}
    steps:
      - uses: actions/checkout@v4

      - id: pins
        run: |
          set -a; . playwright/alpine-browsers/versions.env; set +a
          # workflow_dispatch override: if `pw_version` input was set, it wins
          # over versions.env's PW_VERSION default. Powers the on-demand path
          # where a different PW pin (e.g. 1.59.1) needs its own chs/ff rev.
          if [ -n "${PW_VERSION_OVERRIDE:-}" ]; then
            echo "pin override: PW_VERSION=$PW_VERSION → $PW_VERSION_OVERRIDE (workflow_dispatch input)"
            PW_VERSION="$PW_VERSION_OVERRIDE"
          fi
          echo "pw_version=$PW_VERSION" >> "$GITHUB_OUTPUT"
          BROWSERS_JSON=$(curl -fsSL "https://unpkg.com/playwright-core@${PW_VERSION}/browsers.json")
          REV=$(jq -r '.browsers[] | select(.name=="chromium-headless-shell") | .revision' <<<"$BROWSERS_JSON")
          VER=$(jq -r '.browsers[] | select(.name=="chromium-headless-shell") | .browserVersion' <<<"$BROWSERS_JSON")
          echo "chromium_revision=$REV" >> "$GITHUB_OUTPUT"
          echo "chromium_version=$VER" >> "$GITHUB_OUTPUT"
          echo "PW v${PW_VERSION} → chromium-headless-shell revision=${REV} browserVersion=${VER}"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jclaveau/playwright-alpine-browsers
          tags: |
            type=raw,value=chs-sha-${{ github.sha }}
            type=raw,value=chs-edge,enable=${{ github.event_name != 'pull_request' }}

      - name: Build artifact image (apk fast path)
        uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/chromium-headless-shell/Dockerfile.apk
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: artifact
          build-args: |
            EXPECTED_CHROMIUM_VERSION=${{ steps.pins.outputs.chromium_version }}

      - name: Tier-1 smoke (chrome-headless-shell --version)
        run: |
          set -o pipefail
          # Minimal runtime — the artifact bundles all chromium .so deps and
          # the binary has RPATH=$ORIGIN, so we just need:
          # - ca-certificates (TLS root store; chromium reads on startup)
          # - font fallbacks (chromium opens fontconfig early; no fonts =
          #   "Couldn't find a font" warnings, and some text APIs hang)
          # - icu-data-full only needed for non-default locales; skip.
          cat > /tmp/Dockerfile.chs-t1 <<EOF
          FROM alpine:edge
          RUN apk update && apk add --no-cache \\
              ca-certificates font-opensans ttf-freefont
          COPY --from=ghcr.io/jclaveau/playwright-alpine-browsers:chs-sha-${{ github.sha }} \\
               /chrome-headless-shell-linux64 \\
               /opt/chs
          EOF
          docker build -t chs-t1:${{ github.sha }} -f /tmp/Dockerfile.chs-t1 /tmp
          # Don't swallow exit codes — relocation/runtime errors should fail
          # the step, not pass via `|| true` like the first iteration.
          OUT=$(docker run --rm chs-t1:${{ github.sha }} /opt/chs/chrome-headless-shell --version 2>&1)
          echo "chrome-headless-shell --version output:"
          echo "$OUT"
          echo "$OUT" | grep -q "HeadlessChrome\|Chromium" \
            || { echo "Tier-1: binary didn't self-identify"; exit 1; }

  # ── Chromium-headless-shell — from-source pipeline (DISABLED) ──────────────
  # This job builds chromium-headless-shell from source on alpine:edge using
  # aports' patches + GN/ninja. It works correctly (system-libs swap, copium
  # patches, RUSTC_BOOTSTRAP, node/esbuild/rollup CIPD-placeholder fixes all
  # land), but cold compile pace is ~3000 ninja actions/hour and the build
  # has ~37000 actions — needs ~12h.
  #
  # The 5h hard cap on GHA hosted runners kills the build mid-link
  # consistently. Last attempt #26843681271 reached 15176/37042 (~41%) at
  # the timeout, after 5h of clean compile (~28% past the previous fontconfig
  # wall the system-libs fix resolved).
  #
  # Kept here for future revival when one of:
  #   - PW's pin diverges from aports' chromium-headless-shell major.minor
  #     (apk fast path stops matching the PW protocol surface)
  #   - Self-hosted or larger paid runners become available (>5h timeout)
  #   - Partial-build checkpointing across two GHA runs is implemented
  #
  # Until then, `build-chromium-headless-shell` above does an apk extract
  # of aports' prebuilt chromium-headless-shell-148.0.7778.178-r0.
  build-chromium-headless-shell-from-source:
    if: false
    # Gate retained from the active job so re-enabling = just flip if to true.
    # if: |
    #   github.event_name == 'push'
    #   || (github.event_name == 'workflow_dispatch' && inputs.build_chromium_headless_shell_from_source == 'true')
    #   || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-chromium-headless-shell-from-source'))
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 5h ceiling — Chromium cold-build is heavier than FF
    outputs:
      build_tag: chs-sha-${{ github.sha }}
      pw_version: ${{ steps.pins.outputs.pw_version }}
      chromium_revision: ${{ steps.pins.outputs.chromium_revision }}
      chromium_version: ${{ steps.pins.outputs.chromium_version }}
    steps:
      - uses: actions/checkout@v4

      - id: pins
        run: |
          set -a; . playwright/alpine-browsers/versions.env; set +a
          # workflow_dispatch override: if `pw_version` input was set, it wins
          # over versions.env's PW_VERSION default. Powers the on-demand path
          # where a different PW pin (e.g. 1.59.1) needs its own chs/ff rev.
          if [ -n "${PW_VERSION_OVERRIDE:-}" ]; then
            echo "pin override: PW_VERSION=$PW_VERSION → $PW_VERSION_OVERRIDE (workflow_dispatch input)"
            PW_VERSION="$PW_VERSION_OVERRIDE"
          fi
          echo "pw_version=$PW_VERSION" >> "$GITHUB_OUTPUT"
          BROWSERS_JSON=$(curl -fsSL "https://unpkg.com/playwright-core@${PW_VERSION}/browsers.json")
          REV=$(jq -r '.browsers[] | select(.name=="chromium-headless-shell") | .revision' <<<"$BROWSERS_JSON")
          VER=$(jq -r '.browsers[] | select(.name=="chromium-headless-shell") | .browserVersion' <<<"$BROWSERS_JSON")
          echo "chromium_revision=$REV" >> "$GITHUB_OUTPUT"
          echo "chromium_version=$VER" >> "$GITHUB_OUTPUT"
          echo "PW v${PW_VERSION} → chromium-headless-shell revision=${REV} browserVersion=${VER}"

      - name: Free up runner disk (chromium source + out dir is ~30 GB)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jclaveau/playwright-alpine-browsers
          tags: |
            type=raw,value=chs-sha-${{ github.sha }}
            type=raw,value=chs-edge,enable=${{ github.event_name != 'pull_request' }}

      - name: Build artifact image
        uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/chromium-headless-shell/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: artifact
          cache-from: type=registry,ref=ghcr.io/jclaveau/playwright-alpine-browsers:buildcache-chs
          cache-to: type=registry,ref=ghcr.io/jclaveau/playwright-alpine-browsers:buildcache-chs,mode=max
          build-args: |
            PW_CHROMIUM_SKIP_APORTS=${{ inputs.chromium_skip_aports || 'false' }}
            PW_CHROMIUM_ENABLE_DEBUG=${{ inputs.chromium_enable_debug || 'false' }}

      # Tier-1 smoke: binary self-identifies as the PW-pinned browserVersion.
      - name: Tier-1 smoke (chrome-headless-shell --version)
        run: |
          cat > /tmp/Dockerfile.chs-t1 <<EOF
          FROM alpine:edge
          RUN apk update && apk add --no-cache \\
              nss freetype harfbuzz ca-certificates ttf-freefont libdrm mesa-gl \\
              libwebp libwebpdemux libxcomposite libxdamage libxrandr libxscrnsaver libxtst \\
              libx11 libxcb libxext libxi cups-libs alsa-lib dbus-libs pango cairo
          COPY --from=ghcr.io/jclaveau/playwright-alpine-browsers:chs-sha-${{ github.sha }} \\
               /chrome-headless-shell-linux64 \\
               /opt/chs
          EOF
          docker build -t chs-t1:${{ github.sha }} -f /tmp/Dockerfile.chs-t1 /tmp
          OUT=$(docker run --rm chs-t1:${{ github.sha }} /opt/chs/chrome-headless-shell --version 2>&1 || true)
          echo "chrome-headless-shell --version output:"
          echo "$OUT"
          echo "$OUT" | grep -q "${{ steps.pins.outputs.chromium_version }}" \
            || { echo "Tier-1: chrome-headless-shell didn't report expected ${{ steps.pins.outputs.chromium_version }}"; exit 1; }

      # (Removed) The earlier `Cancel run on chromium failure` step muddied the
      # job status — chromium-fail → self-cancel → final conclusion becomes
      # "cancelled" instead of "failure", obscuring real failures. The step
      # mattered when FF + chromium ran unconditionally in parallel; now FF is
      # label-gated (default off) so chromium-fail wastes nothing. Drop it.
      # If you ever enable both browsers via labels and chromium fails first,
      # the FF build will still continue to completion — that's an accepted
      # trade for clear status semantics.

  smoke-chromium-headless-shell:
    # Tier-2: drive chromium via the Playwright SDK using auto-discovery (NO
    # executablePath passed; we stage the artifact at PW's cache path and the
    # SDK finds it). Validates the "no playwright.config.ts change" invariant.
    needs: build-chromium-headless-shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build a candidate Alpine runner consuming the artifact
        env:
          CHS_REV: ${{ needs.build-chromium-headless-shell.outputs.chromium_revision }}
        run: |
          # Minimal runtime — see Tier-1 comment; artifact bundles all .so deps.
          cat > /tmp/Dockerfile.chs-runner <<EOF
          FROM alpine:edge
          RUN apk update && apk add --no-cache \\
              nodejs npm bash \\
              ca-certificates font-opensans ttf-freefont
          COPY --from=ghcr.io/jclaveau/playwright-alpine-browsers:chs-sha-${{ github.sha }} \\
               /chrome-headless-shell-linux64 \\
               /ms-playwright/chromium_headless_shell-${CHS_REV}/chrome-headless-shell-linux64
          RUN touch /ms-playwright/chromium_headless_shell-${CHS_REV}/INSTALLATION_COMPLETE
          ENV PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
          WORKDIR /smoke
          RUN npm install -g playwright@${{ needs.build-chromium-headless-shell.outputs.pw_version }}
          EOF
          docker build -t chs-runner:${{ github.sha }} -f /tmp/Dockerfile.chs-runner /tmp

      - name: Run Tier-2 smoke (PW SDK auto-discovery)
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            -v "$PWD/playwright/alpine-browsers/chromium-headless-shell/smoke:/smoke" \
            -w /smoke \
            -e NODE_PATH=/usr/local/lib/node_modules \
            -e DEBUG=pw:browser \
            chs-runner:${{ github.sha }} \
            node launch.cjs

  # ── Firefox — glibc debug build (DISABLED) ─────────────────────────────────
  # Diagnostic: builds the SAME PW-patched Firefox on Ubuntu/glibc (not musl)
  # to isolate musl-specific bugs from generic patch-application bugs.
  #
  # Decision tree (when re-enabled, observe the diagnostic step outputs):
  #   - glibc build's Juggler ACTIVATES (`firefox --help` shows --juggler-pipe)
  #     → the issue is musl-specific. Focus on the musl producer.
  #   - glibc build's Juggler ALSO DORMANT → patches are wrong regardless of
  #     libc. Re-examine bootstrap.diff filter / DIRS ordering / static_components
  #     registration.
  #
  # Same disable pattern as build-chromium-headless-shell-from-source: flip
  # `if: false` to the gate below to revive. juggler_order_first and
  # juggler_category_rename inputs are already on the workflow_dispatch block
  # (shared with the musl FF build).
  build-firefox-glibc-debug:
    if: false
    # Gate retained from the standalone workflow so re-enabling = just flip if to true.
    # if: |
    #   github.event_name == 'pull_request'
    #   || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build glibc-debug image
        uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/Dockerfile.glibc-debug
          target: artifact
          # NOT pushed — diagnostic only. Build cache IS pushed so iterations
          # are fast.
          push: false
          load: true   # load into local docker daemon so the diagnostic steps can `docker run`
          tags: playwright-alpine-browsers-glibc-debug:${{ github.sha }}
          # Separate registry cache scope (`-glibc` suffix) so we don't clobber
          # the musl producer's :buildcache.
          cache-from: type=registry,ref=ghcr.io/jclaveau/playwright-alpine-browsers:buildcache-glibc
          cache-to: type=registry,ref=ghcr.io/jclaveau/playwright-alpine-browsers:buildcache-glibc,mode=max
          build-args: |
            PW_JUGGLER_ORDER_FIRST=${{ inputs.juggler_order_first || 'false' }}
            PW_JUGGLER_CATEGORY_RENAME=${{ inputs.juggler_category_rename || 'false' }}
          # GITHUB_TOKEN passes through to fetch-pw-patches.sh's curl. Anonymous
          # raw.githubusercontent.com requests rate-limit to ~60/hr/IP; the
          # 100+ Juggler-file walk hits that ceiling. Authenticated → 5000/hr.
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Diagnostic — firefox --help on glibc
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            playwright-alpine-browsers-glibc-debug:${{ github.sha }} \
            sh -c '
              DIST=/work/firefox-dist
              echo "=== $DIST contents (top-level) ==="
              ls -la "$DIST" | head -30
              echo ""
              echo "=== find omni.ja anywhere ==="
              find /work -name omni.ja 2>/dev/null | head -5
              echo ""
              # LD_LIBRARY_PATH so firefox can find libxul.so in $DIST.
              # Without it XPCOMGlueLoad fails — "Couldn`t load XPCOM".
              export LD_LIBRARY_PATH="$DIST:$LD_LIBRARY_PATH"
              echo "=== firefox --version ==="
              "$DIST"/firefox --version || echo "(version failed)"
              echo ""
              echo "=== firefox --help | juggler/remote ==="
              "$DIST"/firefox --help 2>&1 | grep -iE "juggler|remote|marionette|debugger" \
                || echo "(no juggler/remote in --help)"
            '

      - name: Diagnostic — libxul symbols + omni.ja manifests
        run: |
          docker run --rm playwright-alpine-browsers-glibc-debug:${{ github.sha }} sh -c '
            DIST=/work/firefox-dist
            echo "=== libxul Juggler/RemoteAgent symbols ==="
            nm --defined-only "$DIST"/libxul.so 2>/dev/null \
              | grep -iE "juggler|remoteDebuggingPipe|screencastService|RemoteAgent" | head -40
            echo ""
            echo "=== static_components strings ==="
            strings "$DIST"/libxul.so 2>/dev/null \
              | grep -E "command-line-handler|m-remote|m-juggler|@mozilla.org/remote/(agent|juggler)" | sort -u
            echo ""
            # omni.ja may be at $DIST/omni.ja OR (if not packaged) somewhere in obj/.
            # find it dynamically.
            OMNI=$(find / -name omni.ja -path "*firefox*" 2>/dev/null | head -1)
            if [ -n "$OMNI" ] && [ -f "$OMNI" ]; then
              echo "=== omni.ja found at $OMNI ==="
              cd /tmp && rm -rf oj && mkdir oj && cd oj && unzip -q "$OMNI"
              echo "=== chrome.manifest (juggler) ==="
              grep -i juggler chrome.manifest 2>/dev/null || echo "(none)"
              echo "=== components.manifest (juggler/m-remote/category) ==="
              grep -iE "juggler|m-remote|command-line-handler" components/components.manifest 2>/dev/null || echo "(none)"
            else
              echo "(omni.ja not found anywhere — build may not have packaged JS)"
            fi
          '

      - name: Diagnostic — launch with -juggler-pipe + capture moz.log
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -e MOZ_LOG='CommandLine:5,Module:5,nsComponentManager:5,nsCategoryManager:5' \
            -e MOZ_LOG_FILE=/tmp/moz.log \
            playwright-alpine-browsers-glibc-debug:${{ github.sha }} sh -c '
              DIST=/work/firefox-dist
              export LD_LIBRARY_PATH="$DIST:$LD_LIBRARY_PATH"
              timeout 8 "$DIST"/firefox -no-remote -headless -profile /tmp/p -juggler-pipe < /dev/null 3<>/dev/null 4<>/dev/null 2>/tmp/stderr.log || true
              echo "=== stderr ==="
              tail -100 /tmp/stderr.log
              echo ""
              echo "=== moz.log (juggler-related) ==="
              ls -la /tmp/moz.log* 2>/dev/null
              cat /tmp/moz.log* 2>/dev/null | grep -iE "juggler|m-remote|command-line" | head -50 || echo "(no juggler entries in moz.log)"
            '

  # ── WebKit — parallel WPE + GTK checkpointed cold build (default off) ─────
  # WebKit's full WPE+GTK cold build exceeds GHA's 6h job cap. We split into
  # parallel per-port chains, each producing its own image lineage. Total
  # wall time ≈ max(WPE chain, GTK chain) + source-prep + finalize, vs
  # sequential ≈ sum. Sccache is per-port (not shared) so the second port
  # doesn't benefit from the first — but parallelism more than makes up for
  # it. PW's bootstrap.diff also patches the two ports' Options*.cmake
  # independently, so the parallel structure aligns with PW's source layout.
  #
  #   build-webkit-source-prep:
  #     - clones WebKit at PW SHA, applies PW patches, OptionsWPE.cmake
  #       feature-parity append, strips .git
  #     - publishes wk-src-sha-<sha>
  #
  #   build-webkit-wpe-{1..4} (each FROM previous; wpe-1 FROM source-prep):
  #     - cmake configure WPE (first stage only; subsequent stages skip)
  #     - ninja MiniBrowser WPE with hard 4.5h timeout, idempotent + progressive
  #     - stage + bundle into /work/minibrowser-wpe-dist when ninja completes
  #
  #   build-webkit-gtk-{1..4}: same shape, in parallel with the WPE chain.
  #
  #   build-webkit-finalize (needs both port chains' final stage + source-prep):
  #     - FROM-scratch artifact COPYing both ports' dists + pw_run.sh
  #     - publishes wk-sha-<sha>, runs Tier-1 smoke
  #
  # No push/main trigger; explicit dispatch or PR-label only. promote-webkit
  # gates on finalize success.
  build-webkit-source-prep:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_webkit == 'true')
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-webkit'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: wk-src-sha-${{ github.sha }}
      pw_version: ${{ steps.pins.outputs.pw_version }}
      webkit_revision: ${{ steps.pins.outputs.webkit_revision }}
      webkit_version: ${{ steps.pins.outputs.webkit_version }}
    steps:
      - uses: actions/checkout@v4
      - id: pins
        run: |
          set -a; . playwright/alpine-browsers/versions.env; set +a
          if [ -n "${PW_VERSION_OVERRIDE:-}" ]; then
            echo "pin override: PW_VERSION=$PW_VERSION → $PW_VERSION_OVERRIDE"
            PW_VERSION="$PW_VERSION_OVERRIDE"
          fi
          echo "pw_version=$PW_VERSION" >> "$GITHUB_OUTPUT"
          BROWSERS_JSON=$(curl -fsSL "https://unpkg.com/playwright-core@${PW_VERSION}/browsers.json")
          REV=$(jq -r '.browsers[] | select(.name=="webkit") | .revision' <<<"$BROWSERS_JSON")
          VER=$(jq -r '.browsers[] | select(.name=="webkit") | .browserVersion' <<<"$BROWSERS_JSON")
          echo "webkit_revision=$REV" >> "$GITHUB_OUTPUT"
          echo "webkit_version=$VER" >> "$GITHUB_OUTPUT"
          echo "PW v${PW_VERSION} → webkit revision=${REV} browserVersion=${VER}"
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build source-prep image
        uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.source-prep
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-src-sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/jclaveau/playwright-alpine-browsers:buildcache-wk-src
          cache-to: type=registry,ref=ghcr.io/jclaveau/playwright-alpine-browsers:buildcache-wk-src,mode=max
          secrets: |
            github-token=${{ secrets.GITHUB_TOKEN }}

  build-webkit-wpe-1:
    needs: [build-webkit-source-prep]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: wk-wpe-1-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.port
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-wpe-1-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-source-prep.outputs.tag }}
            PORT=WPE
            ENABLE_JIT=${{ inputs.webkit_enable_jit || 'ON' }}

  build-webkit-wpe-2:
    needs: [build-webkit-wpe-1]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: wk-wpe-2-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.port
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-wpe-2-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-wpe-1.outputs.tag }}
            PORT=WPE
            ENABLE_JIT=${{ inputs.webkit_enable_jit || 'ON' }}

  build-webkit-wpe-3:
    needs: [build-webkit-wpe-2]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: wk-wpe-3-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.port
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-wpe-3-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-wpe-2.outputs.tag }}
            PORT=WPE
            ENABLE_JIT=${{ inputs.webkit_enable_jit || 'ON' }}

  build-webkit-wpe-4:
    needs: [build-webkit-wpe-3]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: wk-wpe-4-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.port
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-wpe-4-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-wpe-3.outputs.tag }}
            PORT=WPE
            ENABLE_JIT=${{ inputs.webkit_enable_jit || 'ON' }}

  # GTK chain re-enabled iter #21 — PW's `registry/index.ts` ldd-validates
  # `minibrowser-gtk/` at install time, so the consumer image needs the GTK
  # port shipped even though headless CI only ever invokes WPE. Builds in
  # parallel with the WPE chain off the shared source-prep image; sccache
  # mount id is per-port (`wk-sccache-GTK`) so the two chains don't deadlock
  # the locked mount on overlapping clang invocations.
  build-webkit-gtk-1:
    needs: [build-webkit-source-prep]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: wk-gtk-1-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.port
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-gtk-1-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-source-prep.outputs.tag }}
            PORT=GTK
            ENABLE_JIT=${{ inputs.webkit_enable_jit || 'ON' }}

  build-webkit-gtk-2:
    needs: [build-webkit-gtk-1]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: wk-gtk-2-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.port
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-gtk-2-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-gtk-1.outputs.tag }}
            PORT=GTK
            ENABLE_JIT=${{ inputs.webkit_enable_jit || 'ON' }}

  build-webkit-gtk-3:
    needs: [build-webkit-gtk-2]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: wk-gtk-3-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.port
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-gtk-3-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-gtk-2.outputs.tag }}
            PORT=GTK
            ENABLE_JIT=${{ inputs.webkit_enable_jit || 'ON' }}

  build-webkit-gtk-4:
    needs: [build-webkit-gtk-3]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: wk-gtk-4-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.port
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-gtk-4-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-gtk-3.outputs.tag }}
            PORT=GTK
            ENABLE_JIT=${{ inputs.webkit_enable_jit || 'ON' }}

  build-webkit-finalize:
    needs: [build-webkit-source-prep, build-webkit-wpe-4, build-webkit-gtk-4]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build_tag: wk-sha-${{ github.sha }}
      pw_version: ${{ needs.build-webkit-source-prep.outputs.pw_version }}
      webkit_revision: ${{ needs.build-webkit-source-prep.outputs.webkit_revision }}
      webkit_version: ${{ needs.build-webkit-source-prep.outputs.webkit_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jclaveau/playwright-alpine-browsers
          tags: |
            type=raw,value=wk-sha-${{ github.sha }}
            type=raw,value=wk-edge,enable=${{ github.event_name != 'pull_request' }}
      - name: Build final artifact image (compose WPE + GTK)
        uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.finalize
          target: artifact
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_WPE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-wpe-4.outputs.tag }}
            BASE_GTK=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-gtk-4.outputs.tag }}
            BASE_SOURCE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-source-prep.outputs.tag }}

      - name: Tier-1 smoke (ELF + ldd integrity for MiniBrowser-wpe + MiniBrowser-gtk)
        run: |
          set -o pipefail
          cat > /tmp/Dockerfile.wk-t1 <<EOF
          FROM alpine:edge
          RUN apk update && apk add --no-cache \\
              file binutils ca-certificates ttf-freefont \\
              libwpe libwpebackend-fdo \\
              gtk4.0 at-spi2-core \\
              libgcc libstdc++
          COPY --from=ghcr.io/jclaveau/playwright-alpine-browsers:wk-sha-${{ github.sha }} /webkit /opt/webkit
          EOF
          docker build -t wk-t1:${{ github.sha }} -f /tmp/Dockerfile.wk-t1 /tmp
          docker run --rm wk-t1:${{ github.sha }} sh -c '
            set -e
            echo "===== /opt/webkit layout ====="
            ls -la /opt/webkit/ /opt/webkit/minibrowser-wpe /opt/webkit/minibrowser-gtk
            for port in wpe gtk; do
              BIN=/opt/webkit/minibrowser-$port/MiniBrowser
              file "$BIN"
              file "$BIN" | grep -q "ELF.*executable" \
                || { echo "FAIL: $BIN is not an ELF executable"; exit 1; }
              [ -s "$BIN" ] || { echo "FAIL: $BIN is empty"; exit 1; }
              ldd "$BIN" || true
              MISSING=$(ldd "$BIN" 2>&1 | grep -c "not found" || true)
              if [ "$MISSING" -gt 0 ]; then
                echo "FAIL: $BIN has $MISSING unresolved deps"
                ldd "$BIN" 2>&1 | grep "not found"
                exit 1
              fi
              echo "OK: $port MiniBrowser is $(stat -c %s "$BIN") bytes, all deps resolved"
            done
            echo "Tier-1: MiniBrowser-wpe + MiniBrowser-gtk intact and self-contained."
          '

  smoke-webkit:
    # Tier-2: drive MiniBrowser-wpe via the Playwright SDK (launch, navigate,
    # route, screenshot). If RemoteInspector handshake misalignment on musl
    # bites us, launch() / newContext() will hang and the 15-min job timeout
    # fires — same shape as the Firefox #60 land-disabled pattern.
    needs: [build-webkit-finalize]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build a candidate Alpine runner consuming the wk artifact
        env:
          PW_VERSION: ${{ needs.build-webkit-finalize.outputs.pw_version }}
          WEBKIT_REV: ${{ needs.build-webkit-finalize.outputs.webkit_revision }}
        run: |
          cat > /tmp/Dockerfile.runner <<EOF
          FROM alpine:edge
          # mesa-dri-gallium + mesa-gbm + mesa-vulkan-swrast: software fallback
          # for OpenGL/EGL/Vulkan on a headless runner (no GPU device). Without
          # these, WPEWebProcess crashes during page creation when WebKit tries
          # to init EGL — ZINK falls back to lavapipe which needs Vulkan
          # swrast; libgallium needs DRI fallback to llvmpipe.
          # GStreamer plugins-base/good/bad: PW's nativeDeps.ts lists these as
          # webkitLinuxLibraryDeps; WebKit init scans them during page setup,
          # missing → page-7 'crashed:true' at +14s.
          # cairo/pango/gdk-pixbuf/libnotify/dbus/opus: same source.
          RUN apk add --no-cache \\
              nodejs npm bash \\
              file binutils ca-certificates ttf-freefont \\
              libwpe libwpebackend-fdo \\
              gtk4.0 at-spi2-core \\
              libgcc libstdc++ \\
              mesa-gles mesa-gbm mesa-dri-gallium mesa-vulkan-swrast \\
              gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-libav \\
              cairo pango gdk-pixbuf libnotify dbus-libs opus libsecret
          # PW expects /\${PLAYWRIGHT_BROWSERS_PATH}/webkit-\${REV}/ with
          # pw_run.sh + minibrowser-{wpe,gtk}/ + INSTALLATION_COMPLETE.
          COPY --from=ghcr.io/jclaveau/playwright-alpine-browsers:wk-sha-${{ github.sha }} /webkit /opt/playwright/webkit-${WEBKIT_REV}
          RUN touch /opt/playwright/webkit-${WEBKIT_REV}/INSTALLATION_COMPLETE
          ENV PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          ENV PLAYWRIGHT_BROWSERS_PATH=/opt/playwright
          # PW upstream bug on Alpine/musl: validator runs /sbin/ldconfig -p,
          # musl ldconfig rejects -p with "Illegal option" but exits 0 with
          # empty stdout. PW then flags dlOpenLibraries (libGLESv2.so.2 +
          # libx264.so) as missing → false positive. Bypass on Alpine.
          ENV PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1
          WORKDIR /smoke
          RUN npm install -g playwright@${PW_VERSION}
          EOF
          docker build -t wk-candidate-runner:${{ github.sha }} -f /tmp/Dockerfile.runner /tmp

      - name: Tier-2 diagnostic — MiniBrowser-wpe with --automation (no PW SDK)
        timeout-minutes: 2
        run: |
          set -o pipefail
          # Iters #15-18 had Tier-2 (PW SDK → --inspector-pipe) crash WPEWebProcess
          # at +14s during page creation. Diagnostic: drop --inspector-pipe and
          # PW SDK, drive MiniBrowser directly with --automation + about:blank.
          # If MiniBrowser runs to exit without WPEWebProcess crash, the bug is
          # in PW's --inspector-pipe pipe-handshake path. If it crashes anyway,
          # the bug is in WebProcess init regardless of flag.
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --cap-add SYS_ADMIN \
            --cap-add NET_ADMIN \
            -e WEBKIT_FORCE_SANDBOX=0 \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e GALLIUM_DRIVER=llvmpipe \
            -e MESA_LOADER_DRIVER_OVERRIDE=llvmpipe \
            wk-candidate-runner:${{ github.sha }} \
            timeout 60 /opt/playwright/webkit-2287/pw_run.sh \
              --automation --headless --no-startup-window about:blank 2>&1

      - name: Run Tier-2 smoke (PW SDK → MiniBrowser-wpe)
        if: false  # tracked in issue — page-7 'crashed:true' at +14s via inspector-pipe
        run: |
          # --security-opt seccomp=unconfined: Docker default seccomp blocks
          # clone(CLONE_NEWUSER) which WebKit's bwrap sandbox needs. Without
          # it, bwrap errors "Creating new namespace failed: Operation not
          # permitted" and the libwpe init aborts. Same shape as the Firefox
          # smoke (same flag, same reason).
          # DEBUG=pw:browser surfaces stderr from the MiniBrowser child process,
          # including RemoteInspector handshake traces.
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --cap-add SYS_ADMIN \
            --cap-add NET_ADMIN \
            -v "$PWD/playwright/alpine-browsers/webkit/smoke:/smoke" \
            -w /smoke \
            -e NODE_PATH=/usr/local/lib/node_modules \
            -e DEBUG=pw:browser,pw:protocol \
            -e WEBKIT_FORCE_SANDBOX=0 \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e GALLIUM_DRIVER=llvmpipe \
            -e MESA_LOADER_DRIVER_OVERRIDE=llvmpipe \
            wk-candidate-runner:${{ github.sha }} \
            node launch.cjs

  promote-webkit:
    # Promote the artifact to wk-${REV} / wk-${VER} / wk-latest on both
    # registries (GHCR for CI consumption; Docker Hub for external catalog).
    needs: [build-webkit-finalize, smoke-webkit]
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_webkit == 'true')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote WebKit → GHCR + Docker Hub
        env:
          SRC: ghcr.io/jclaveau/playwright-alpine-browsers:wk-sha-${{ github.sha }}
          REV: ${{ needs.build-webkit-finalize.outputs.webkit_revision }}
          VER: ${{ needs.build-webkit-finalize.outputs.webkit_version }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/jclaveau/playwright-alpine-browsers:wk-${REV}" \
            -t "ghcr.io/jclaveau/playwright-alpine-browsers:wk-${VER}" \
            -t ghcr.io/jclaveau/playwright-alpine-browsers:wk-latest \
            -t "jclaveau/playwright-alpine-browsers:wk-${REV}" \
            -t "jclaveau/playwright-alpine-browsers:wk-${VER}" \
            -t jclaveau/playwright-alpine-browsers:wk-latest \
            -t "jclaveau/playwright-alpine-browsers:wk-sha-${{ github.sha }}" \
            "$SRC"
