  build-chromium-headless-shell-from-source-r1:
    # Each round carries its own buildcache ref (buildcache-chs-round-N) so a
    # round that has to be re-run — runner flake, a rerun of the job, a retried
    # dispatch — restores its 5h of ninja instead of redoing it. One ref per
    # round, not one shared ref: a single ref would be rewritten twelve times
    # per run and keep only the last round's entry. This is retry insurance and
    # nothing more: cache keys include the base image digest, and a fresh run
    # builds a fresh setup image, so a new sha still starts cold. Continuing a
    # chain across runs is what `resume_from` below is for.
    #
    # Round images are tagged with THIS run's sha and each round consumes the
    # previous one, so obj/ only survives inside a single run. A run that runs
    # out of rounds would otherwise start over from zero: `resume_from` points
    # r1 at a previous chain's last round image and the rounds pick up where
    # that one stopped. Rounds are interchangeable (each is "run ninja for 5h
    # from wherever we are"), so no round-skipping is needed — the ones past
    # the end of the work exit immediately.
