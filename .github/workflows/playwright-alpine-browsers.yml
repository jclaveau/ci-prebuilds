          cache-to: type=registry,ref=ghcr.io/jclaveau/playwright-alpine-browsers:buildcache-chs-round-1,mode=max
          build-args: |
            BASE_IMAGE=${{ inputs.resume_from || format('ghcr.io/jclaveau/playwright-alpine-browsers:chs-build-setup-sha-{0}', github.sha) }}
            ROUND_LABEL=round-1
          secrets: |
