  build-chromium-headed-finalize:
    # Final headed job — runs `ninja chrome` (VARIANT inherited) WITHOUT a
    # timeout; MUST complete. Consumes the last round's obj/ layer. Bigger
    # graph than headless_shell so the round count is generous — spare rounds
    # no-op fast once ninja is exhausted, keeping finalize's link step inside
    # the 350min GHA cap (a cap-killed finalize pushes no cache).
    needs: build-chromium-headed-r14
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_chromium_headed == 'true')
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-chromium-headed'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      build_tag: chr-sha-${{ github.sha }}
      pw_version: ${{ steps.pins.outputs.pw_version }}
      chromium_revision: ${{ steps.pins.outputs.chromium_revision }}
      chromium_version: ${{ steps.pins.outputs.chromium_version }}
    steps:
      - uses: actions/checkout@v7
      - id: pins
        run: |
          set -a; . playwright/alpine-browsers/versions.env; set +a
          if [ -n "${PW_VERSION_OVERRIDE:-}" ]; then
            echo "pin override: PW_VERSION=$PW_VERSION -> $PW_VERSION_OVERRIDE (workflow_dispatch input)"
            PW_VERSION="$PW_VERSION_OVERRIDE"
          fi
          echo "pw_version=$PW_VERSION" >> "$GITHUB_OUTPUT"
          BROWSERS_JSON=$(curl -fsSL "https://unpkg.com/playwright-core@${PW_VERSION}/browsers.json")
          REV=$(jq -r '.browsers[] | select(.name=="chromium") | .revision' <<<"$BROWSERS_JSON")
          VER=$(jq -r '.browsers[] | select(.name=="chromium") | .browserVersion' <<<"$BROWSERS_JSON")
          echo "chromium_revision=$REV" >> "$GITHUB_OUTPUT"
          echo "chromium_version=$VER" >> "$GITHUB_OUTPUT"
          echo "PW v${PW_VERSION} -> chromium revision=${REV} browserVersion=${VER}"
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jclaveau/playwright-alpine-browsers
          tags: |
            type=raw,value=chr-fs-sha-${{ github.sha }}
            type=raw,value=chr-fs-edge,enable=${{ github.event_name != 'pull_request' }}
      - name: Expose GHA cache env
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || process.env.ACTIONS_RUNTIME_URL || '');
      - name: Build final headed artifact image (ninja chrome must complete)
        uses: docker/build-push-action@v5
        env:
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_RESULTS_URL: ${{ env.ACTIONS_RESULTS_URL }}
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/chromium-headless-shell/Dockerfile.finalize
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: artifact
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:chr-build-r14-sha-${{ github.sha }}
            ARTIFACT_LAYOUT=chrome-linux
          secrets: |
            actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}
            actions_results_url=${{ env.ACTIONS_RESULTS_URL }}
      - name: Tier-1 smoke (chrome --version)
        run: |
          cat > /tmp/Dockerfile.chr-t1 <<EOF
          FROM alpine:edge
          # Full-chrome runtime deps = headless-shell set + the headed extras
          # (gtk3/mesa-dri/xdg-utils). --version needs the binary to load only,
          # but chrome links gtk3 so keep it in the closure.
          RUN apk update && apk add --no-cache \\
              nss freetype harfbuzz ca-certificates ttf-freefont libdrm mesa-gl \\
              libwebp libwebpdemux libxcomposite libxdamage libxrandr libxscrnsaver libxtst \\
              libx11 libxcb libxext libxi cups-libs alsa-lib dbus-libs pango cairo \\
              opus dav1d ffmpeg-libavformat libjpeg-turbo libxslt \\
              libatk-1.0 libatk-bridge-2.0 at-spi2-core minizip \\
              double-conversion crc32c libxkbcommon mesa-gbm eudev-libs flac \\
              harfbuzz-subset \\
              gtk+3.0 mesa-dri-gallium font-opensans xdg-utils
          COPY --from=ghcr.io/jclaveau/playwright-alpine-browsers:chr-fs-sha-${{ github.sha }} \\
               /chrome-linux \\
               /opt/chr
          EOF
          docker build -t chr-t1:${{ github.sha }} -f /tmp/Dockerfile.chr-t1 /tmp
          OUT=$(docker run --rm chr-t1:${{ github.sha }} /opt/chr/chrome --version 2>&1 || true)
          echo "chrome --version output:"
          echo "$OUT"
          echo "$OUT" | grep -q "${{ steps.pins.outputs.chromium_version }}" \
            || { echo "Tier-1: chrome didn't report expected ${{ steps.pins.outputs.chromium_version }}"; exit 1; }

  smoke-chromium-headless-shell:
    # Tier-2: drive chromium via the Playwright SDK using auto-discovery (NO
    # executablePath passed; we stage the artifact at PW's cache path and the
    # SDK finds it). Validates the "no playwright.config.ts change" invariant.
    needs: build-chromium-headless-shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build a candidate Alpine runner consuming the artifact
        env:
          CHS_REV: ${{ needs.build-chromium-headless-shell.outputs.chromium_revision }}
        run: |
          # Minimal runtime — see Tier-1 comment; artifact bundles all .so deps.
          cat > /tmp/Dockerfile.chs-runner <<EOF
          FROM alpine:edge
          RUN apk update && apk add --no-cache \\
              nodejs npm bash \\
              ca-certificates font-opensans ttf-freefont
          COPY --from=ghcr.io/jclaveau/playwright-alpine-browsers:chs-sha-${{ github.sha }} \\
               /chrome-headless-shell-linux64 \\
               /ms-playwright/chromium_headless_shell-${CHS_REV}/chrome-headless-shell-linux64
          RUN touch /ms-playwright/chromium_headless_shell-${CHS_REV}/INSTALLATION_COMPLETE
          ENV PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
          WORKDIR /smoke
          RUN npm install -g playwright@${{ needs.build-chromium-headless-shell.outputs.pw_version }}
          EOF
          docker build -t chs-runner:${{ github.sha }} -f /tmp/Dockerfile.chs-runner /tmp

      - name: Run Tier-2 smoke (PW SDK auto-discovery)
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            -v "$PWD/playwright/alpine-browsers/chromium-headless-shell/smoke:/smoke" \
            -w /smoke \
            -e NODE_PATH=/usr/local/lib/node_modules \
            -e DEBUG=pw:browser \
            chs-runner:${{ github.sha }} \
            node launch.cjs

  # ── Firefox — glibc debug build (DISABLED) ─────────────────────────────────
  # Diagnostic: builds the SAME PW-patched Firefox on Ubuntu/glibc (not musl)
  # to isolate musl-specific bugs from generic patch-application bugs.
  #
  # Decision tree (when re-enabled, observe the diagnostic step outputs):
  #   - glibc build's Juggler ACTIVATES (`firefox --help` shows --juggler-pipe)
  #     → the issue is musl-specific. Focus on the musl producer.
  #   - glibc build's Juggler ALSO DORMANT → patches are wrong regardless of
  #     libc. Re-examine bootstrap.diff filter / DIRS ordering / static_components
  #     registration.
  #
  # Same disable pattern as build-chromium-headless-shell-from-source: flip
  # `if: false` to the gate below to revive. juggler_order_first and
  # juggler_category_rename inputs are already on the workflow_dispatch block
  # (shared with the musl FF build).
  build-firefox-glibc-debug:
    if: false
    # Gate retained from the standalone workflow so re-enabling = just flip if to true.
    # if: |
    #   github.event_name == 'pull_request'
    #   || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build glibc-debug image
        uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/Dockerfile.glibc-debug
          target: artifact
          # NOT pushed — diagnostic only. Build cache IS pushed so iterations
          # are fast.
          push: false
          load: true   # load into local docker daemon so the diagnostic steps can `docker run`
          tags: playwright-alpine-browsers-glibc-debug:${{ github.sha }}
          # Separate registry cache scope (`-glibc` suffix) so we don't clobber
          # the musl producer's :buildcache.
          cache-from: type=registry,ref=ghcr.io/jclaveau/playwright-alpine-browsers:buildcache-glibc
          cache-to: type=registry,ref=ghcr.io/jclaveau/playwright-alpine-browsers:buildcache-glibc,mode=max
          build-args: |
            PW_JUGGLER_ORDER_FIRST=${{ inputs.juggler_order_first || 'false' }}
            PW_JUGGLER_CATEGORY_RENAME=${{ inputs.juggler_category_rename || 'false' }}
          # GITHUB_TOKEN passes through to fetch-pw-patches.sh's curl. Anonymous
          # raw.githubusercontent.com requests rate-limit to ~60/hr/IP; the
          # 100+ Juggler-file walk hits that ceiling. Authenticated → 5000/hr.
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Diagnostic — firefox --help on glibc
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            playwright-alpine-browsers-glibc-debug:${{ github.sha }} \
            sh -c '
              DIST=/work/firefox-dist
              echo "=== $DIST contents (top-level) ==="
              ls -la "$DIST" | head -30
              echo ""
              echo "=== find omni.ja anywhere ==="
              find /work -name omni.ja 2>/dev/null | head -5
              echo ""
              # LD_LIBRARY_PATH so firefox can find libxul.so in $DIST.
              # Without it XPCOMGlueLoad fails — "Couldn`t load XPCOM".
              export LD_LIBRARY_PATH="$DIST:$LD_LIBRARY_PATH"
              echo "=== firefox --version ==="
              "$DIST"/firefox --version || echo "(version failed)"
              echo ""
              echo "=== firefox --help | juggler/remote ==="
              "$DIST"/firefox --help 2>&1 | grep -iE "juggler|remote|marionette|debugger" \
                || echo "(no juggler/remote in --help)"
            '

      - name: Diagnostic — libxul symbols + omni.ja manifests
        run: |
          docker run --rm playwright-alpine-browsers-glibc-debug:${{ github.sha }} sh -c '
            DIST=/work/firefox-dist
            echo "=== libxul Juggler/RemoteAgent symbols ==="
            nm --defined-only "$DIST"/libxul.so 2>/dev/null \
              | grep -iE "juggler|remoteDebuggingPipe|screencastService|RemoteAgent" | head -40
            echo ""
            echo "=== static_components strings ==="
            strings "$DIST"/libxul.so 2>/dev/null \
              | grep -E "command-line-handler|m-remote|m-juggler|@mozilla.org/remote/(agent|juggler)" | sort -u
            echo ""
            # omni.ja may be at $DIST/omni.ja OR (if not packaged) somewhere in obj/.
            # find it dynamically.
            OMNI=$(find / -name omni.ja -path "*firefox*" 2>/dev/null | head -1)
            if [ -n "$OMNI" ] && [ -f "$OMNI" ]; then
              echo "=== omni.ja found at $OMNI ==="
              cd /tmp && rm -rf oj && mkdir oj && cd oj && unzip -q "$OMNI"
              echo "=== chrome.manifest (juggler) ==="
              grep -i juggler chrome.manifest 2>/dev/null || echo "(none)"
              echo "=== components.manifest (juggler/m-remote/category) ==="
              grep -iE "juggler|m-remote|command-line-handler" components/components.manifest 2>/dev/null || echo "(none)"
            else
              echo "(omni.ja not found anywhere — build may not have packaged JS)"
            fi
          '

      - name: Diagnostic — launch with -juggler-pipe + capture moz.log
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -e MOZ_LOG='CommandLine:5,Module:5,nsComponentManager:5,nsCategoryManager:5' \
            -e MOZ_LOG_FILE=/tmp/moz.log \
            playwright-alpine-browsers-glibc-debug:${{ github.sha }} sh -c '
              DIST=/work/firefox-dist
              export LD_LIBRARY_PATH="$DIST:$LD_LIBRARY_PATH"
              timeout 8 "$DIST"/firefox -no-remote -headless -profile /tmp/p -juggler-pipe < /dev/null 3<>/dev/null 4<>/dev/null 2>/tmp/stderr.log || true
              echo "=== stderr ==="
              tail -100 /tmp/stderr.log
              echo ""
              echo "=== moz.log (juggler-related) ==="
              ls -la /tmp/moz.log* 2>/dev/null
              cat /tmp/moz.log* 2>/dev/null | grep -iE "juggler|m-remote|command-line" | head -50 || echo "(no juggler entries in moz.log)"
            '

  # ── WebKit — parallel WPE + GTK checkpointed cold build (default off) ─────
  # WebKit's full WPE+GTK cold build exceeds GHA's 6h job cap. We split into
  # parallel per-port chains, each producing its own image lineage. Total
  # wall time ≈ max(WPE chain, GTK chain) + source-prep + finalize, vs
  # sequential ≈ sum. Sccache is per-port (not shared) so the second port
  # doesn't benefit from the first — but parallelism more than makes up for
  # it. PW's bootstrap.diff also patches the two ports' Options*.cmake
  # independently, so the parallel structure aligns with PW's source layout.
  #
  #   build-webkit-source-prep:
  #     - clones WebKit at PW SHA, applies PW patches, OptionsWPE.cmake
  #       feature-parity append, strips .git
  #     - publishes wk-src-sha-<sha>
  #
  #   build-webkit-wpe-{1..4} (each FROM previous; wpe-1 FROM source-prep):
  #     - cmake configure WPE (first stage only; subsequent stages skip)
  #     - ninja MiniBrowser WPE with hard 4.5h timeout, idempotent + progressive
  #     - stage + bundle into /work/minibrowser-wpe-dist when ninja completes
  #
  #   build-webkit-gtk-{1..4}: same shape, in parallel with the WPE chain.
  #
  #   build-webkit-finalize (needs both port chains' final stage + source-prep):
  #     - FROM-scratch artifacts: artifact-wpe (minibrowser-wpe + pw_run.sh +
  #       scripts/strip-mesa-closure.sh) → wk-sha-<sha>; artifact (WPE + GTK)
  #       → wk-gtk-sha-<sha>. Runs Tier-1 smoke on the gtk artifact (superset —
  #       it contains the exact wpe bytes the slim tag ships).
  #
  # No push/main trigger; explicit dispatch or PR-label only. promote-webkit
  # gates on finalize success.
  build-webkit-source-prep:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_webkit == 'true')
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-webkit'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: wk-src-sha-${{ github.sha }}
      pw_version: ${{ steps.pins.outputs.pw_version }}
      webkit_revision: ${{ steps.pins.outputs.webkit_revision }}
      webkit_version: ${{ steps.pins.outputs.webkit_version }}
    steps:
      - uses: actions/checkout@v4
      - id: pins
        run: |
          set -a; . playwright/alpine-browsers/versions.env; set +a
          if [ -n "${PW_VERSION_OVERRIDE:-}" ]; then
            echo "pin override: PW_VERSION=$PW_VERSION → $PW_VERSION_OVERRIDE"
            PW_VERSION="$PW_VERSION_OVERRIDE"
          fi
          echo "pw_version=$PW_VERSION" >> "$GITHUB_OUTPUT"
          BROWSERS_JSON=$(curl -fsSL "https://unpkg.com/playwright-core@${PW_VERSION}/browsers.json")
          REV=$(jq -r '.browsers[] | select(.name=="webkit") | .revision' <<<"$BROWSERS_JSON")
          VER=$(jq -r '.browsers[] | select(.name=="webkit") | .browserVersion' <<<"$BROWSERS_JSON")
          echo "webkit_revision=$REV" >> "$GITHUB_OUTPUT"
          echo "webkit_version=$VER" >> "$GITHUB_OUTPUT"
          echo "PW v${PW_VERSION} → webkit revision=${REV} browserVersion=${VER}"
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build source-prep image
        uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.source-prep
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-src-sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/jclaveau/playwright-alpine-browsers:buildcache-wk-src
          cache-to: type=registry,ref=ghcr.io/jclaveau/playwright-alpine-browsers:buildcache-wk-src,mode=max
          secrets: |
            github-token=${{ secrets.GITHUB_TOKEN }}

  build-webkit-wpe-1:
    needs: [build-webkit-source-prep]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: wk-wpe-1-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.port
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-wpe-1-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-source-prep.outputs.tag }}
            PORT=WPE
            ENABLE_JIT=${{ inputs.webkit_enable_jit || 'ON' }}

  build-webkit-wpe-2:
    needs: [build-webkit-wpe-1]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: wk-wpe-2-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.port
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-wpe-2-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-wpe-1.outputs.tag }}
            PORT=WPE
            ENABLE_JIT=${{ inputs.webkit_enable_jit || 'ON' }}

  build-webkit-wpe-3:
    needs: [build-webkit-wpe-2]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: wk-wpe-3-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.port
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-wpe-3-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-wpe-2.outputs.tag }}
            PORT=WPE
            ENABLE_JIT=${{ inputs.webkit_enable_jit || 'ON' }}

  build-webkit-wpe-4:
    needs: [build-webkit-wpe-3]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: wk-wpe-4-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.port
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-wpe-4-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-wpe-3.outputs.tag }}
            PORT=WPE
            ENABLE_JIT=${{ inputs.webkit_enable_jit || 'ON' }}

  # GTK chain re-enabled iter #26 — WPE Tier-2 PW SDK green confirmed the
  # _FORTIFY_SOURCE=0 cmake fix. GTK uses the same Skia codepaths so the
  # same fix carries through. PW's `registry/index.ts` ldd-validates BOTH
  # minibrowser-wpe AND minibrowser-gtk for full install + headed launch
  # support; need real GTK binaries (not the WPE stub) for the goal's
  # "both cases" criterion. Builds in parallel with the WPE chain off the
  # shared source-prep image; sccache mount id is per-port (`wk-sccache-GTK`)
  # so the two chains don't deadlock the locked mount on overlapping clang
  # invocations.
  build-webkit-gtk-1:
    # GTK port gated OFF by default — headed WebKit is unsupported on musl today,
    # and the WPE-only artifact ships without it. Skipping GTK ~halves the WebKit
    # build. Flip on via the build_webkit_gtk dispatch input or a `build-webkit-gtk`
    # PR label. When skipped, finalize substitutes an empty gtk dir (GTK_STAGE=none).
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_webkit == 'true' && inputs.build_webkit_gtk == 'true')
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-webkit-gtk'))
    needs: [build-webkit-source-prep]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: wk-gtk-1-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.port
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-gtk-1-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-source-prep.outputs.tag }}
            PORT=GTK
            ENABLE_JIT=${{ inputs.webkit_enable_jit || 'ON' }}

  build-webkit-gtk-2:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_webkit == 'true' && inputs.build_webkit_gtk == 'true')
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-webkit-gtk'))
    needs: [build-webkit-gtk-1]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: wk-gtk-2-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.port
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-gtk-2-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-gtk-1.outputs.tag }}
            PORT=GTK
            ENABLE_JIT=${{ inputs.webkit_enable_jit || 'ON' }}

  build-webkit-gtk-3:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_webkit == 'true' && inputs.build_webkit_gtk == 'true')
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-webkit-gtk'))
    needs: [build-webkit-gtk-2]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: wk-gtk-3-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.port
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-gtk-3-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-gtk-2.outputs.tag }}
            PORT=GTK
            ENABLE_JIT=${{ inputs.webkit_enable_jit || 'ON' }}

  build-webkit-gtk-4:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_webkit == 'true' && inputs.build_webkit_gtk == 'true')
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-webkit-gtk'))
    needs: [build-webkit-gtk-3]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: wk-gtk-4-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.port
          push: true
          tags: ghcr.io/jclaveau/playwright-alpine-browsers:wk-gtk-4-sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-gtk-3.outputs.tag }}
            PORT=GTK
            ENABLE_JIT=${{ inputs.webkit_enable_jit || 'ON' }}

  build-webkit-finalize:
    # Runs when WPE + source-prep succeed, whether or not GTK was built — a
    # skipped `needs` job would otherwise skip this one too. GTK skipped →
    # GTK_STAGE=none (WPE-only artifact); GTK built → stripped + shipped.
    if: |
      !cancelled()
      && needs.build-webkit-source-prep.result == 'success'
      && needs.build-webkit-wpe-4.result == 'success'
      && (needs.build-webkit-gtk-4.result == 'success' || needs.build-webkit-gtk-4.result == 'skipped')
    needs: [build-webkit-source-prep, build-webkit-wpe-4, build-webkit-gtk-4]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build_tag: wk-sha-${{ github.sha }}
      pw_version: ${{ needs.build-webkit-source-prep.outputs.pw_version }}
      webkit_revision: ${{ needs.build-webkit-source-prep.outputs.webkit_revision }}
      webkit_version: ${{ needs.build-webkit-source-prep.outputs.webkit_version }}
      # Whether the artifact carries the GTK port (headed) — gates the Tier-2
      # headed smoke below; false → WPE-only (empty gtk dir).
      gtk_built: ${{ needs.build-webkit-gtk-4.result == 'success' }}
    # Both build steps below read the same GTK base, including the WPE-only one:
    # BuildKit parses every stage in the file, so `FROM ${BASE_GTK} AS gtk_real`
    # has to resolve even when that stage goes unused. Held in one place because
    # the two steps carried the same ternary and only one of them got fixed.
    env:
      BASE_GTK: ${{ needs.build-webkit-gtk-4.result == 'success' && format('ghcr.io/jclaveau/playwright-alpine-browsers:{0}', needs.build-webkit-gtk-4.outputs.tag) || 'scratch' }}
      GTK_STAGE: ${{ needs.build-webkit-gtk-4.result == 'success' && 'real' || 'none' }}
    steps:
      - uses: actions/checkout@v4
      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"; df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta-wpe
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jclaveau/playwright-alpine-browsers
          tags: |
            type=raw,value=wk-sha-${{ github.sha }}
            type=raw,value=wk-edge,enable=${{ github.event_name != 'pull_request' }}
      - id: meta-gtk
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jclaveau/playwright-alpine-browsers
          tags: |
            type=raw,value=wk-gtk-sha-${{ github.sha }}
            type=raw,value=wk-gtk-edge,enable=${{ github.event_name != 'pull_request' }}
      - name: Build WPE-only artifact (wk-sha-<sha>)
        uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.finalize
          target: artifact-wpe
          push: true
          tags: ${{ steps.meta-wpe.outputs.tags }}
          labels: ${{ steps.meta-wpe.outputs.labels }}
          build-args: |
            BASE_WPE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-wpe-4.outputs.tag }}
            BASE_GTK=${{ env.BASE_GTK }}
            BASE_SOURCE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-source-prep.outputs.tag }}
      - name: Build WPE+GTK artifact (wk-gtk-sha-<sha>)
        uses: docker/build-push-action@v5
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/webkit/Dockerfile.finalize
          target: artifact
          push: true
          tags: ${{ steps.meta-gtk.outputs.tags }}
          labels: ${{ steps.meta-gtk.outputs.labels }}
          build-args: |
            BASE_WPE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-wpe-4.outputs.tag }}
            BASE_GTK=${{ env.BASE_GTK }}
            GTK_STAGE=${{ env.GTK_STAGE }}
            BASE_SOURCE=ghcr.io/jclaveau/playwright-alpine-browsers:${{ needs.build-webkit-source-prep.outputs.tag }}

      - name: Tier-1 smoke (ELF + ldd integrity for MiniBrowser-wpe + MiniBrowser-gtk)
        run: |
          set -o pipefail
          cat > /tmp/Dockerfile.wk-t1 <<EOF
          FROM alpine:edge
          RUN apk update && apk add --no-cache \\
              file binutils ca-certificates ttf-freefont \\
              libwpe libwpebackend-fdo \\
              gtk4.0 at-spi2-core \\
              libgcc libstdc++
          COPY --from=ghcr.io/jclaveau/playwright-alpine-browsers:wk-gtk-sha-${{ github.sha }} /webkit /opt/webkit
          EOF
          docker build -t wk-t1:${{ github.sha }} -f /tmp/Dockerfile.wk-t1 /tmp
          docker run --rm wk-t1:${{ github.sha }} sh -c '
            set -e
            echo "===== /opt/webkit layout ====="
            ls -la /opt/webkit/ /opt/webkit/minibrowser-wpe /opt/webkit/minibrowser-gtk
            for port in wpe gtk; do
              BIN=/opt/webkit/minibrowser-$port/MiniBrowser
              # GTK is gated off by default (empty dir) — WPE is required, GTK optional.
              if [ ! -f "$BIN" ]; then
                [ "$port" = wpe ] && { echo "FAIL: wpe MiniBrowser missing"; exit 1; }
                echo "skip: $port MiniBrowser not built (GTK port gated off)"; continue
              fi
              file "$BIN"
              file "$BIN" | grep -q "ELF.*executable" \
                || { echo "FAIL: $BIN is not an ELF executable"; exit 1; }
              [ -s "$BIN" ] || { echo "FAIL: $BIN is empty"; exit 1; }
              ldd "$BIN" || true
              MISSING=$(ldd "$BIN" 2>&1 | grep -c "not found" || true)
              if [ "$MISSING" -gt 0 ]; then
                echo "FAIL: $BIN has $MISSING unresolved deps"
                ldd "$BIN" 2>&1 | grep "not found"
                exit 1
              fi
              echo "OK: $port MiniBrowser is $(stat -c %s "$BIN") bytes, all deps resolved"
            done
            echo "Tier-1: MiniBrowser-wpe + MiniBrowser-gtk intact and self-contained."
          '

  smoke-webkit:
    # Tier-2: drive MiniBrowser-wpe via the Playwright SDK (launch, navigate,
    # route, screenshot). If RemoteInspector handshake misalignment on musl
    # bites us, launch() / newContext() will hang and the 15-min job timeout
    # fires — same shape as the Firefox #60 land-disabled pattern.
    # `!cancelled()` breaks GHA's transitive-needs skip cascade: when GTK is
    # gated off (build_webkit_gtk=false), gtk-4 is skipped and a bare-`if` job
    # downstream is auto-skipped (actions/runner#491). Keep explicit so smoke
    # still runs on the WPE-only artifact.
    if: |
      !cancelled()
      && needs.build-webkit-finalize.result == 'success'
    needs: [build-webkit-finalize]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build a candidate Alpine runner consuming the wk artifact
        env:
          PW_VERSION: ${{ needs.build-webkit-finalize.outputs.pw_version }}
          WEBKIT_REV: ${{ needs.build-webkit-finalize.outputs.webkit_revision }}
        run: |
          cat > /tmp/Dockerfile.runner <<EOF
          FROM alpine:edge
          # mesa-dri-gallium + mesa-gbm + mesa-vulkan-swrast: software fallback
          # for OpenGL/EGL/Vulkan on a headless runner (no GPU device). Without
          # these, WPEWebProcess crashes during page creation when WebKit tries
          # to init EGL — ZINK falls back to lavapipe which needs Vulkan
          # swrast; libgallium needs DRI fallback to llvmpipe.
          # GStreamer plugins-base/good/bad: PW's nativeDeps.ts lists these as
          # webkitLinuxLibraryDeps; WebKit init scans them during page setup,
          # missing → page-7 'crashed:true' at +14s.
          # cairo/pango/gdk-pixbuf/libnotify/dbus/opus: same source.
          RUN apk add --no-cache \\
              nodejs npm bash \\
              file binutils ca-certificates ttf-freefont \\
              libwpe libwpebackend-fdo \\
              gtk4.0 at-spi2-core \\
              libgcc libstdc++ \\
              mesa-gles mesa-gbm mesa-dri-gallium mesa-vulkan-swrast \\
              gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-libav \\
              cairo pango gdk-pixbuf libnotify dbus-libs opus libsecret \\
              xvfb xvfb-run gdb
          # PW expects /\${PLAYWRIGHT_BROWSERS_PATH}/webkit-\${REV}/ with
          # pw_run.sh + minibrowser-{wpe,gtk}/ + INSTALLATION_COMPLETE.
          COPY --from=ghcr.io/jclaveau/playwright-alpine-browsers:wk-gtk-sha-${{ github.sha }} /webkit /opt/playwright/webkit-${WEBKIT_REV}
          RUN touch /opt/playwright/webkit-${WEBKIT_REV}/INSTALLATION_COMPLETE
          ENV PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          ENV PLAYWRIGHT_BROWSERS_PATH=/opt/playwright
          # PW upstream bug on Alpine/musl: validator runs /sbin/ldconfig -p,
          # musl ldconfig rejects -p with "Illegal option" but exits 0 with
          # empty stdout. PW then flags dlOpenLibraries (libGLESv2.so.2 +
          # libx264.so) as missing → false positive. Bypass on Alpine.
          ENV PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1
          WORKDIR /smoke
          RUN npm install -g playwright@${PW_VERSION}
          EOF
          docker build -t wk-candidate-runner:${{ github.sha }} -f /tmp/Dockerfile.runner /tmp

      - name: Configure host for core dumps (Tier-2 diagnostic safety net)
        run: |
          sudo mkdir -p /tmp/cores
          sudo chmod 1777 /tmp/cores
          sudo sh -c 'echo "/tmp/cores/core.%e.%p.%s" > /proc/sys/kernel/core_pattern'

      - name: Run Tier-2 smoke (PW SDK → MiniBrowser-wpe)
        timeout-minutes: 5
        run: |
          # Re-enabled after disabling _FORTIFY_SOURCE in cmake-flags.overlay
          # (see project_webkit_fortify_source_skia_trap.md). If the rebuild
          # fixed the SIGILL, launch.cjs runs the full Tier-2 sequence
          # (launch, page, route, screenshot). If something else still
          # crashes WPEWebProcess, the core-dump step below captures bt.
          #
          # versions.env carries PW_WEBKIT_WPE_SOVERSION, the expected so-version
          # of the shipped libWPEWebKit — the one version assertion that reads the
          # built binary rather than playwright's own package.
          set -a; . playwright/alpine-browsers/versions.env; set +a
          : "${PW_WEBKIT_WPE_SOVERSION:?versions.env must define PW_WEBKIT_WPE_SOVERSION}"
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --cap-add SYS_ADMIN \
            --cap-add NET_ADMIN \
            --ulimit core=-1 \
            -v /tmp/cores:/tmp/cores:rw \
            -v "$PWD/playwright/alpine-browsers/webkit/smoke:/smoke" \
            -w /smoke \
            -e NODE_PATH=/usr/local/lib/node_modules \
            -e DEBUG=pw:browser,pw:protocol \
            -e WEBKIT_FORCE_SANDBOX=0 \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e GALLIUM_DRIVER=llvmpipe \
            -e MESA_LOADER_DRIVER_OVERRIDE=llvmpipe \
            -e EXPECTED_WEBKIT_VERSION="${{ needs.build-webkit-finalize.outputs.webkit_version }}" \
            -e EXPECTED_WPE_SOVERSION="$PW_WEBKIT_WPE_SOVERSION" \
            wk-candidate-runner:${{ github.sha }} \
            sh -c '
              ulimit -c unlimited 2>/dev/null || true
              cd /smoke
              timeout -k 5 90 node launch.cjs
            '

      - name: Run Tier-2 headed smoke (PW SDK → MiniBrowser-gtk via Xvfb)
        # Only when the GTK port was built — WPE-only artifacts have no
        # MiniBrowser-gtk (build_webkit_gtk gated off by default).
        if: needs.build-webkit-finalize.outputs.gtk_built == 'true'
        # Re-enabled 2026-07-22: the GTK4 infinite-recursion SIGSEGV at newPage
        # was root-caused to the artifact's hand-assembled bundled gtk4 stack
        # (a version-skewed transitive lib in the flat ldd-walk), NOT a
        # GTK4-on-musl or WebKit bug — a standalone GTK4 window realizes fine,
        # and forcing the runner's consistent apk gtk4.0 over the bundle makes
        # headed newPage+goto green (validated locally). bundle-dist.sh now
        # drops the gtk4 closure from the GTK port so this runner's apk gtk4.0
        # supplies it. See project_webkit_gtk_headed_recursion.md.
        timeout-minutes: 5
        run: |
          # Headed launches dispatch through pw_run.sh → MiniBrowser-gtk
          # (the GTK4 widget toolkit needs an X display). Xvfb provides a
          # display server with no GPU; we drive launch-headed.cjs which
          # mirrors launch.cjs but passes headless: false.
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --cap-add SYS_ADMIN \
            --cap-add NET_ADMIN \
            --ulimit core=-1 \
            -v /tmp/cores:/tmp/cores:rw \
            -v "$PWD/playwright/alpine-browsers/webkit/smoke:/smoke" \
            -w /smoke \
            -e NODE_PATH=/usr/local/lib/node_modules \
            -e DEBUG=pw:browser,pw:protocol \
            -e WEBKIT_FORCE_SANDBOX=0 \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e GALLIUM_DRIVER=llvmpipe \
            -e MESA_LOADER_DRIVER_OVERRIDE=llvmpipe \
            wk-candidate-runner:${{ github.sha }} \
            sh -c '
              ulimit -c unlimited 2>/dev/null || true
              cd /smoke
              timeout -k 5 90 xvfb-run -a -s "-screen 0 1280x720x24" node launch-headed.cjs
            '

      - name: Post-mortem on any cores
        if: failure()
        run: |
          shopt -s nullglob
          CORES=(/tmp/cores/core.*)
          if [ ${#CORES[@]} -eq 0 ]; then
            echo "::notice::No core files captured."
            exit 0
          fi
          echo "::warning::${#CORES[@]} core(s) captured — see logs for bt"
          for c in "${CORES[@]}"; do
            base=$(basename "$c")
            EXE=$(echo "$base" | awk -F. '{print $2}')
            echo "::group::core: $base"
            docker run --rm -v /tmp/cores:/cores:ro wk-candidate-runner:${{ github.sha }} \
              sh -c "
                BIN=\$(find /opt/playwright -name '$EXE' -type f -executable 2>/dev/null | head -1)
                echo binary: \$BIN
                gdb --batch --quiet -ex 'set pagination off' -ex 'set print pretty on' \
                  -ex 'bt full' -ex 'thread apply all bt' -ex 'info registers' \
                  \"\$BIN\" /cores/$base
              "
            echo "::endgroup::"
          done

      - name: Upload cores + bt as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-smoke-cores-${{ github.run_number }}
          path: /tmp/cores/core.*
          if-no-files-found: ignore
          retention-days: 7

  promote-webkit:
    # Promote both artifacts on both registries (GHCR for CI consumption;
    # Docker Hub for external catalog):
    #   wk-sha-<sha> (WPE-only) → wk-${REV} / wk-${VER} / wk-latest
    #   wk-gtk-sha-<sha> (WPE+GTK) → wk-gtk-${REV} / wk-gtk-${VER} / wk-gtk-latest
    needs: [build-webkit-finalize, smoke-webkit, conformance-webkit]
    # `!cancelled()` prefix: a skipped gtk-4 (GTK gated off) cascade-skips
    # dependents without an always/!cancelled conditional (actions/runner#491).
    # `build-webkit-finalize.result == 'success'`: on a push where build_webkit
    # is off (the default — webkit is dispatch/PR-label-gated only), the whole
    # chain is skipped and `!cancelled()` alone would still fire this job and
    # fail on the missing wk-sha-<sha> (red main on every push).
    #
    # `smoke-webkit` / `conformance-webkit` spelled out: `!cancelled()` waives
    # the default "a failed need skips this job" for EVERY need, not just the
    # gtk one it was added for. Without it, run 31724164357 promoted a WebKit
    # that cannot open a page to wk-latest.
    if: |
      !cancelled()
      && needs.build-webkit-finalize.result == 'success'
      && needs.smoke-webkit.result == 'success'
      && needs.conformance-webkit.result == 'success'
      && ((github.event_name == 'workflow_dispatch' && inputs.build_webkit == 'true')
          || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote WebKit WPE → GHCR + Docker Hub
        env:
          SRC: ghcr.io/jclaveau/playwright-alpine-browsers:wk-sha-${{ github.sha }}
          REV: ${{ needs.build-webkit-finalize.outputs.webkit_revision }}
          VER: ${{ needs.build-webkit-finalize.outputs.webkit_version }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/jclaveau/playwright-alpine-browsers:wk-${REV}" \
            -t "ghcr.io/jclaveau/playwright-alpine-browsers:wk-${VER}" \
            -t ghcr.io/jclaveau/playwright-alpine-browsers:wk-latest \
            -t "jclaveau/playwright-alpine-browsers:wk-${REV}" \
            -t "jclaveau/playwright-alpine-browsers:wk-${VER}" \
            -t jclaveau/playwright-alpine-browsers:wk-latest \
            -t "jclaveau/playwright-alpine-browsers:wk-sha-${{ github.sha }}" \
            "$SRC"
      - name: Promote WebKit GTK → GHCR + Docker Hub
        env:
          SRC: ghcr.io/jclaveau/playwright-alpine-browsers:wk-gtk-sha-${{ github.sha }}
          REV: ${{ needs.build-webkit-finalize.outputs.webkit_revision }}
          VER: ${{ needs.build-webkit-finalize.outputs.webkit_version }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/jclaveau/playwright-alpine-browsers:wk-gtk-${REV}" \
            -t "ghcr.io/jclaveau/playwright-alpine-browsers:wk-gtk-${VER}" \
            -t ghcr.io/jclaveau/playwright-alpine-browsers:wk-gtk-latest \
            -t "jclaveau/playwright-alpine-browsers:wk-gtk-${REV}" \
            -t "jclaveau/playwright-alpine-browsers:wk-gtk-${VER}" \
            -t jclaveau/playwright-alpine-browsers:wk-gtk-latest \
            "$SRC"
