  build-chromium-headless-shell-from-source:
    # Final job — runs `ninja headless_shell` without timeout, so every compile
    # has to be done by the time it starts; it only has headroom for the link.
    #
    # Rounds are boxed by TIME (5h each), not by work, and per-round yield decays
    # hard as the cheap TUs run out — measured on the is_official_build A/B
    # (31596578641), targets built per round:
    #
    #   r1 13976 | r2 9148 | r3 2926 | r4 1735 | r5 2046   → 8330 still to go
    #
    # so the tail runs at ~2200/round, not the ~14k the first round suggests.
    # Eight rounds covered the old DCHECK build and no more; sizing off r1 is
    # what left 2379 compiles for finalize in v19 (28675077027), which then died
    # at 84.7% after 5h40m. Twelve covers the LTO-enabled build with slack.
    # Surplus rounds are nearly free — ninja exits at once with nothing to do.
    needs: build-chromium-headless-shell-from-source-r12
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_chromium_headless_shell_from_source == 'true')
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-chromium-headless-shell-from-source'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      build_tag: chs-sha-${{ github.sha }}
      pw_version: ${{ steps.pins.outputs.pw_version }}
      chromium_revision: ${{ steps.pins.outputs.chromium_revision }}
      chromium_version: ${{ steps.pins.outputs.chromium_version }}
    steps:
      - uses: actions/checkout@v7

      - id: pins
        run: |
          set -a; . playwright/alpine-browsers/versions.env; set +a
          if [ -n "${PW_VERSION_OVERRIDE:-}" ]; then
            echo "pin override: PW_VERSION=$PW_VERSION → $PW_VERSION_OVERRIDE (workflow_dispatch input)"
            PW_VERSION="$PW_VERSION_OVERRIDE"
          fi
          echo "pw_version=$PW_VERSION" >> "$GITHUB_OUTPUT"
          BROWSERS_JSON=$(curl -fsSL "https://unpkg.com/playwright-core@${PW_VERSION}/browsers.json")
          REV=$(jq -r '.browsers[] | select(.name=="chromium-headless-shell") | .revision' <<<"$BROWSERS_JSON")
          VER=$(jq -r '.browsers[] | select(.name=="chromium-headless-shell") | .browserVersion' <<<"$BROWSERS_JSON")
          echo "chromium_revision=$REV" >> "$GITHUB_OUTPUT"
          echo "chromium_version=$VER" >> "$GITHUB_OUTPUT"
          echo "PW v${PW_VERSION} → chromium-headless-shell revision=${REV} browserVersion=${VER}"

      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jclaveau/playwright-alpine-browsers
          tags: |
            type=raw,value=chs-fs-sha-${{ github.sha }}
            type=raw,value=chs-fs-edge,enable=${{ github.event_name != 'pull_request' }}

      - name: Expose GHA cache env
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || process.env.ACTIONS_RUNTIME_URL || '');

      - name: Build final artifact image (ninja must complete)
        uses: docker/build-push-action@v5
        env:
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_RESULTS_URL: ${{ env.ACTIONS_RESULTS_URL }}
        with:
          context: playwright/alpine-browsers
          file: playwright/alpine-browsers/chromium-headless-shell/Dockerfile.finalize
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: artifact
          cache-from: type=registry,ref=ghcr.io/jclaveau/playwright-alpine-browsers:buildcache-chs-finalize
          cache-to: type=registry,ref=ghcr.io/jclaveau/playwright-alpine-browsers:buildcache-chs-finalize,mode=max
          build-args: |
            BASE_IMAGE=ghcr.io/jclaveau/playwright-alpine-browsers:chs-build-r12-sha-${{ github.sha }}
          secrets: |
            actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}
            actions_results_url=${{ env.ACTIONS_RESULTS_URL }}

      - name: Tier-1 smoke (chrome-headless-shell --version)
        run: |
          cat > /tmp/Dockerfile.chs-t1 <<EOF
          FROM alpine:edge
          # Runtime deps for from-source chrome-headless-shell. v21 (28750167443)
          # surfaced the initial gap set: opus/dav1d/ffmpeg-libavformat/libjpeg-turbo/libxslt.
          RUN apk update && apk add --no-cache \\
              nss freetype harfbuzz ca-certificates ttf-freefont libdrm mesa-gl \\
              libwebp libwebpdemux libxcomposite libxdamage libxrandr libxscrnsaver libxtst \\
              libx11 libxcb libxext libxi cups-libs alsa-lib dbus-libs pango cairo \\
              opus dav1d ffmpeg-libavformat libjpeg-turbo libxslt \\
              libatk-1.0 libatk-bridge-2.0 at-spi2-core minizip \\
              double-conversion crc32c libxkbcommon mesa-gbm eudev-libs flac \\
              harfbuzz-subset
          COPY --from=ghcr.io/jclaveau/playwright-alpine-browsers:chs-fs-sha-${{ github.sha }} \\
               /chrome-headless-shell-linux64 \\
               /opt/chs
          EOF
          docker build -t chs-t1:${{ github.sha }} -f /tmp/Dockerfile.chs-t1 /tmp
          OUT=$(docker run --rm chs-t1:${{ github.sha }} /opt/chs/chrome-headless-shell --version 2>&1 || true)
          echo "chrome-headless-shell --version output:"
          echo "$OUT"
          echo "$OUT" | grep -q "${{ steps.pins.outputs.chromium_version }}" \
            || { echo "Tier-1: chrome-headless-shell didn't report expected ${{ steps.pins.outputs.chromium_version }}"; exit 1; }

  # HEADED full-chrome build (VARIANT=headed). Full chain: setup -> r1..r14 ->
  # finalize. r1 config (gn gen `chrome` + early ninja on musl) validated green
  # in run 29909366384; the rounds knock out the rest of the bigger `chrome`
