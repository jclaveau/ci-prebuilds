name: smoke-webkit-iter (diagnose)

# Standalone fast-iter smoke for WebKit-WPE. Bypasses the full producer
# chain — consumes an already-published `wk-*` image from GHCR. Lets us
# iterate gdb-wrapped diagnosis cycles in ~5 min vs ~9-12 h cold rebuilds.
#
# Default: probe `wk-edge` (last main-branch publish).
# Use case: WPEWebProcess crashes at +14s during page creation under PW
# SDK `--inspector-pipe`. We wrap WPEWebProcess in a gdb script so the
# subprocess crash dumps `bt full` + `thread apply all bt` to stdout +
# uploads as an artifact.
#
# Once the root cause is identified and a source patch lands, the full
# producer (playwright-alpine-browsers.yml build-webkit-*) reruns with
# the fix and the standard smoke-webkit job exercises the patched image.

on:
  workflow_dispatch:
    inputs:
      wk_image_tag:
        description: 'wk-* tag on ghcr.io/jclaveau/playwright-alpine-browsers to smoke (default: wk-edge)'
        type: string
        default: 'wk-edge'
      pw_version:
        description: 'Playwright version to install (must match wk-tag PW pin; PW@1.60.0 → wk-edge → rev 2287)'
        type: string
        default: '1.60.0'
      webkit_rev:
        description: 'webkit_revision (browsers.json). Leave blank to auto-detect from pw_version (preferred).'
        type: string
        default: ''
      capture_cores:
        description: 'Configure host core_pattern + ulimit core=-1; post-mortem gdb on any cores. Off-by-default until iter #5 stabilises.'
        type: boolean
        default: true
      tier:
        description: 'tier-1 = MiniBrowser --version only; tier-2 = headless WPE; tier-2-headed = GTK via Xvfb'
        type: choice
        options: ['tier-1', 'tier-2', 'tier-2-direct', 'tier-2-headed']
        default: 'tier-2'

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect target image + resolve webkit_rev
        id: pins
        run: |
          docker manifest inspect ghcr.io/jclaveau/playwright-alpine-browsers:${{ inputs.wk_image_tag }} >/dev/null \
            || { echo "::error::Image tag '${{ inputs.wk_image_tag }}' not found on GHCR"; exit 1; }
          echo "::notice::Target image: ghcr.io/jclaveau/playwright-alpine-browsers:${{ inputs.wk_image_tag }}"
          REV='${{ inputs.webkit_rev }}'
          if [ -z "$REV" ]; then
            REV=$(curl -fsSL https://unpkg.com/playwright-core@${{ inputs.pw_version }}/browsers.json \
              | jq -r '.browsers[] | select(.name=="webkit") | .revision')
            echo "::notice::auto-detected webkit_revision=$REV for PW ${{ inputs.pw_version }}"
          fi
          echo "webkit_rev=$REV" >> "$GITHUB_OUTPUT"

      - name: Build candidate Alpine runner
        env:
          PW_VERSION: ${{ inputs.pw_version }}
          WEBKIT_REV: ${{ steps.pins.outputs.webkit_rev }}
          WK_TAG: ${{ inputs.wk_image_tag }}
        run: |
          # Same runtime deps as smoke-webkit + gdb (+ binutils + musl-dbg
          # for backtrace symbols on libc frames).
          cat > /tmp/Dockerfile.runner <<EOF
          FROM alpine:edge
          RUN apk add --no-cache \\
              nodejs npm bash gdb procps coreutils \\
              file binutils ca-certificates ttf-freefont \\
              libwpe libwpebackend-fdo \\
              gtk4.0 at-spi2-core \\
              libgcc libstdc++ musl-dbg \\
              mesa-gles mesa-gbm mesa-dri-gallium mesa-vulkan-swrast \\
              gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-libav \\
              cairo pango gdk-pixbuf libnotify dbus-libs opus libsecret strace \\
              xvfb xvfb-run
          COPY --from=ghcr.io/jclaveau/playwright-alpine-browsers:${WK_TAG} /webkit /opt/playwright/webkit-${WEBKIT_REV}
          RUN touch /opt/playwright/webkit-${WEBKIT_REV}/INSTALLATION_COMPLETE
          ENV PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          ENV PLAYWRIGHT_BROWSERS_PATH=/opt/playwright
          ENV PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1
          RUN npm install -g playwright@${PW_VERSION}
          EOF
          docker build -t wk-iter:${{ github.sha }} -f /tmp/Dockerfile.runner /tmp

      - name: Configure host for core dumps
        if: ${{ inputs.capture_cores }}
        run: |
          # Kernel-wide core_pattern affects every container on this host.
          # %e = exe basename, %p = pid. Write target must exist + be world-writable
          # (cores write as the crashing process's UID; container runs as root
          # by default but post-mortem gdb runs as the runner uid 1001).
          sudo mkdir -p /tmp/cores
          sudo chmod 1777 /tmp/cores
          sudo sh -c 'echo "/tmp/cores/core.%e.%p.%s" > /proc/sys/kernel/core_pattern'
          sudo sysctl -w fs.suid_dumpable=2 >/dev/null
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          echo "suid_dumpable: $(cat /proc/sys/fs/suid_dumpable)"

      - name: Tier-1 — MiniBrowser-wpe --version
        if: ${{ inputs.tier == 'tier-1' }}
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --cap-add SYS_ADMIN \
            --cap-add SYS_PTRACE \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            wk-iter:${{ github.sha }} \
            sh -c '
              set -e
              WK=/opt/playwright/webkit-${{ steps.pins.outputs.webkit_rev }}
              file $WK/minibrowser-wpe/MiniBrowser
              ldd $WK/minibrowser-wpe/MiniBrowser | head -30
              $WK/minibrowser-wpe/MiniBrowser --version || echo "exit rc=$?"
            '

      - name: Tier-2 direct — MiniBrowser-wpe --automation (no PW SDK)
        if: ${{ inputs.tier == 'tier-2-direct' }}
        timeout-minutes: 4
        run: |
          # Bypass PW SDK entirely. Drives MiniBrowser-wpe with --automation
          # which spawns WPEWebProcess via the standard non-inspector-pipe
          # path. If THIS still crashes, the bug is in WebKit's page setup
          # (libwpe / libwpebackend-fdo init), not PW's inspector wire.
          # If THIS works, the bug IS in the inspector-pipe handshake.
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --cap-add SYS_ADMIN \
            --cap-add NET_ADMIN \
            --ulimit core=-1 \
            -v /tmp/cores:/tmp/cores:rw \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            -e WEBKIT_FORCE_SANDBOX=0 \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e GALLIUM_DRIVER=llvmpipe \
            -e MESA_LOADER_DRIVER_OVERRIDE=llvmpipe \
            wk-iter:${{ github.sha }} \
            sh -c '
              set -u
              WK=/opt/playwright/webkit-${{ steps.pins.outputs.webkit_rev }}/minibrowser-wpe
              export WEBKIT_EXEC_PATH=$WK
              export WEBKIT_INJECTED_BUNDLE_PATH=$WK
              export WEBKIT_INSPECTOR_RESOURCES_PATH=$WK
              ulimit -c unlimited 2>/dev/null || true
              echo "===== MiniBrowser --automation about:blank (timeout 30s) ====="
              cd $WK
              timeout -k 5 30 ./MiniBrowser --automation about:blank
              echo "MiniBrowser exit rc=$?"
              echo "===== cores dir ====="
              ls -la /tmp/cores/ || true
            ' 2>&1 | tee /tmp/tier2-direct.log

      - name: Tier-2 — PW SDK launch + newPage
        if: ${{ inputs.tier == 'tier-2' }}
        timeout-minutes: 5
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --cap-add SYS_ADMIN \
            --cap-add NET_ADMIN \
            --ulimit core=-1 \
            -v /tmp/cores:/tmp/cores:rw \
            -v "$PWD/playwright/alpine-browsers/webkit/smoke:/smoke:ro" \
            -w /smoke \
            -e NODE_PATH=/usr/local/lib/node_modules \
            -e DEBUG=pw:browser,pw:protocol \
            -e WEBKIT_FORCE_SANDBOX=0 \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e GALLIUM_DRIVER=llvmpipe \
            -e MESA_LOADER_DRIVER_OVERRIDE=llvmpipe \
            wk-iter:${{ github.sha }} \
            sh -c '
              set -u
              ulimit -c unlimited 2>/dev/null || true
              cd /smoke
              timeout -k 5 90 node launch.cjs
              RC=$?
              echo "launch.cjs rc=$RC"
              echo "===== cores dir ====="
              ls -la /tmp/cores/ || true
              exit $RC
            ' 2>&1 | tee /tmp/tier2-pw-sdk.log || true
          echo "::group::host-side cores dir"
          ls -la /tmp/cores/ || true
          echo "::endgroup::"

      - name: Tier-2 headed — PW SDK launch (headless:false) via Xvfb → MiniBrowser-gtk
        if: ${{ inputs.tier == 'tier-2-headed' }}
        timeout-minutes: 5
        run: |
          # Headed launch dispatches through pw_run.sh to MiniBrowser-gtk
          # (GTK4 widget toolkit needs X display). xvfb-run wraps the node
          # call with an ephemeral display server.
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --cap-add SYS_ADMIN \
            --cap-add NET_ADMIN \
            --ulimit core=-1 \
            -v /tmp/cores:/tmp/cores:rw \
            -v "$PWD/playwright/alpine-browsers/webkit/smoke:/smoke:ro" \
            -w /smoke \
            -e NODE_PATH=/usr/local/lib/node_modules \
            -e DEBUG=pw:browser,pw:protocol \
            -e WEBKIT_FORCE_SANDBOX=0 \
            -e WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e GALLIUM_DRIVER=llvmpipe \
            -e MESA_LOADER_DRIVER_OVERRIDE=llvmpipe \
            wk-iter:${{ github.sha }} \
            sh -c '
              set -u
              ulimit -c unlimited 2>/dev/null || true
              cd /smoke
              timeout -k 5 90 xvfb-run -a -s "-screen 0 1280x720x24" node launch-headed.cjs
              RC=$?
              echo "launch-headed.cjs rc=$RC"
              echo "===== cores dir ====="
              ls -la /tmp/cores/ || true
              exit $RC
            ' 2>&1 | tee /tmp/tier2-headed.log || true
          echo "::group::host-side cores dir"
          ls -la /tmp/cores/ || true
          echo "::endgroup::"

      - name: Post-mortem gdb on cores
        if: ${{ always() && inputs.capture_cores }}
        run: |
          shopt -s nullglob
          CORES=(/tmp/cores/core.*)
          if [ ${#CORES[@]} -eq 0 ]; then
            echo "::notice::No core files captured under /tmp/cores"
            exit 0
          fi
          echo "::notice::Captured ${#CORES[@]} core file(s)"
          mkdir -p /tmp/bt
          for c in "${CORES[@]}"; do
            base=$(basename "$c")
            EXE=$(echo "$base" | awk -F. '{print $2}')
            SIG=$(echo "$base" | awk -F. '{print $NF}')
            echo
            echo "::group::core: $base (exe=$EXE sig=$SIG)"
            ls -lh "$c"
            file "$c" || true
            # Run gdb inside the runner container which has the binary + libs.
            # Mount the host's core dir read-only into the container for gdb.
            BT="/tmp/bt/${base}.bt"
            docker run --rm \
              -v /tmp/cores:/cores:ro \
              wk-iter:${{ github.sha }} \
              sh -c "
                WK=/opt/playwright/webkit-${{ steps.pins.outputs.webkit_rev }}/minibrowser-wpe
                BIN=\"\$WK/$EXE\"
                if [ ! -x \"\$BIN\" ]; then
                  BIN=\$(find /opt/playwright -name '$EXE' -type f -executable 2>/dev/null | head -1)
                fi
                echo \"binary: \$BIN\"
                gdb --batch --quiet \
                  -ex 'set pagination off' \
                  -ex 'set print pretty on' \
                  -ex 'set sysroot /' \
                  -ex 'echo \n===== bt full =====\n' \
                  -ex 'bt full' \
                  -ex 'echo \n===== thread apply all bt =====\n' \
                  -ex 'thread apply all bt' \
                  -ex 'echo \n===== info registers =====\n' \
                  -ex 'info registers' \
                  -ex 'echo \n===== info sharedlibrary =====\n' \
                  -ex 'info sharedlibrary' \
                  \"\$BIN\" /cores/$base
              " 2>&1 | tee "$BT"
            echo "::endgroup::"
          done

      - name: Upload backtrace artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-iter-${{ inputs.tier }}-${{ github.run_number }}
          path: |
            /tmp/tier2-direct.log
            /tmp/tier2-pw-sdk.log
            /tmp/tier2-headed.log
            /tmp/bt/*.bt
            /tmp/cores/core.*
          if-no-files-found: warn
          retention-days: 14
