name: WebKit fmod Zen probe

# Diagnostic only. `libm_fmod` reads 0.92-0.94 against official on an EPYC 7763
# and 1.11-1.16 on an EPYC 9V74, same image both times, and the profile says
# both implementations spend exactly one hardware divide per call on the
# probe's operands — so the divergence has to be in what that divide costs, or
# in the branches around it. This times the shipped shim, two variants and the
# platform's own fmod on the same stream, plus a raw 64-bit DIV ladder at the
# widths each one actually feeds the divider, in ONE process on ONE core.
#
# You cannot choose a runner CPU: dispatch until the model line says the one
# you need. Ratios only mean something within a single run.

on:
  workflow_dispatch:

concurrency:
  group: wk-fmod-zen-probe-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Which silicon
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 'cpu MHz' /proc/cpuinfo || true
          nproc; gcc --version | head -1
      - name: Probe
        run: sh playwright/alpine-browsers/webkit/fastfmod/candidates/run-zen-probe.sh
