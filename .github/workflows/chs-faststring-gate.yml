name: chromium faststring gate

# Proves that libfaststring.so — the memcpy/memmove/memset/memcmp/strlen we
# preload under chrome-headless-shell — answers exactly as musl does, before it
# can ship.
#
# A real gate rather than a smoke test, because the object interposes five
# routines underneath a browser and a wrong byte does not announce itself: it
# surfaces as a corrupt screenshot, a mis-parsed protocol message, or a crash
# somewhere unrelated. The differential run is the load-bearing artifact, so it
# lives here and re-runs on every change.
#
# It runs inside the same alpine base the consumer image is built from, so the
# musl it verifies against is the musl it will ship against — and, unlike a
# runner, that is also where the no-AVX2 path can be forced.

on:
  pull_request:
    paths:
      - 'playwright/alpine-browsers/chromium-headless-shell/faststring/**'
      - 'playwright/Dockerfile.alpine'
      - '.github/workflows/chs-faststring-gate.yml'
  push:
    branches: [main]
    paths:
      - 'playwright/alpine-browsers/chromium-headless-shell/faststring/**'
      - '.github/workflows/chs-faststring-gate.yml'
  workflow_dispatch:

concurrency:
  group: chs-faststring-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: alpine:edge
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        # binutils for objdump: the gate disassembles the shipped object to
        # prove no AVX2 instruction escaped the guarded kernels.
        run: apk add --no-cache gcc musl-dev binutils

      - name: Report the libc and the CPU under test
        # Both belong in the log. The claim is "identical to THIS libc's
        # routines", and which path ran depends on whether the runner has AVX2.
        run: |
          set -eu
          apk info musl | head -2
          ls -l /lib/ld-musl-x86_64.so.1
          grep -o -m1 'avx2' /proc/cpuinfo || echo 'no avx2 on this runner'

      - name: Differential gate
        # run-gate.sh fails the job on: a miscopy, AVX2 leaking into an
        # unguarded dispatcher, the preload not loading (ld.so only warns), or
        # a deliberately corrupted build being accepted.
        run: sh playwright/alpine-browsers/chromium-headless-shell/faststring/run-gate.sh
             playwright/alpine-browsers/chromium-headless-shell/faststring
             "$RUNNER_TEMP/faststring-gate"
