name: WebKit lag diagnostics

# Investigates the WebKit rows that the runtime probe leaves above 1.00 after
# ThinLTO: `libm_fmod` 2.60, `launch` 1.31, `click_force` 1.18, `eval_rtt` 1.10
# and `goto_cold` 1.09 (n=10, three arms, one machine, run 34136323006).
#
# ThinLTO moved `layout` 0.97 -> 0.86 and `goto_warm` 1.10 -> 0.99 while barely
# touching those five, so whatever they are, they are not codegen volume. This
# workflow puts an instrument on each remaining candidate instead of a
# hypothesis:
#
#   jsc-arms   which JIT tier compiles the modulo loop, via `JSC_*` options
#   elf-audit  the shape of the dynamic link, plus the canary posture that
#              already cost chromium 12% instructions
#   fmod-cost  the shipped shim and its candidates against each image's libc
#   strace     what `launch()` actually spends its syscalls on
#
# Everything runs in ONE job: the arms are compared against each other, and
# hosted runners hand out different CPU models per job.

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Our consumer image to diagnose'
        default: 'jclaveau/alpine-dood-playwright:latest'
        type: string
      pw_version:
        description: 'Playwright version driving the probe, and the MCR control tag'
        default: '1.62.1'
        type: string
      reps:
        description: 'Repetitions per kernel (median reported)'
        default: '5'
        type: string

concurrency:
  group: wk-lag-${{ inputs.image }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OURS: ${{ inputs.image }}
      PW: ${{ inputs.pw_version }}
      REPS: ${{ inputs.reps }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc; df -h /

      - name: Pull both arms
        run: |
          set -euo pipefail
          docker pull "$OURS"
          docker pull "mcr.microsoft.com/playwright:v${PW}-noble"

      # ---------------------------------------------------------------- tiers
      # The `libm_fmod` question in one step. If official with FTL forced off
      # lands on our default number, our build is not reaching FTL and the
      # 2.6x is a tier gap; if it does not, the tiers agree and the difference
      # is in the code JSC's own C++ was compiled into.
      - name: JSC tier arms
        run: |
          set -o pipefail
          mkdir -p jsc-out && chmod 777 jsc-out
          rc=0
          for arm in default ftl-off dfg-off; do
            case "$arm" in
              default) jsc_env="" ;;
              ftl-off) jsc_env="-e JSC_useFTLJIT=false" ;;
              dfg-off) jsc_env="-e JSC_useDFGJIT=false -e JSC_useFTLJIT=false" ;;
            esac
            for target in alpine official; do
              if [ "$target" = official ]; then
                image="mcr.microsoft.com/playwright:v${PW}-noble"; home=/root
              else
                image="$OURS"; home=/home/runner
              fi
              echo "::group::$target / $arm"
              # shellcheck disable=SC2086  # jsc_env is a deliberate word-split flag list
              docker run --rm \
                --security-opt seccomp=unconfined \
                --env "HOME=$home" --env "PW_VERSION=$PW" \
                --env "ARM=$arm" --env "TARGET=$target" --env "REPS=$REPS" \
                $jsc_env \
                -v "$PWD/playwright/bench:/probe:ro" \
                -v "$PWD/playwright/scripts:/pwscripts:ro" \
                -v "$PWD/jsc-out:/out" \
                "$image" \
                sh -c '
                  NODE_PATH="$(sh /pwscripts/global-node-path.sh)"
                  export NODE_PATH
                  node -e "require(\"playwright\")" 2>/dev/null \
                    || npm install -g --no-fund --no-audit "playwright@$PW_VERSION" >/dev/null 2>&1
                  timeout 600 node /probe/jsc-kernels.cjs \
                    --browser webkit --target "$TARGET" --arm "$ARM" \
                    --reps "$REPS" --out /out
                ' || rc=1
              echo "::endgroup::"
            done
          done
          exit "$rc"

      # ----------------------------------------------------------- link shape
      # Root, because the shipped image's `sudo apk add` is not passwordless
      # and the audit needs binutils that neither image carries.
      - name: Static ELF audit
        if: '!cancelled()'
        run: |
          set -o pipefail
          mkdir -p elf-out
          docker run --rm --user 0 \
            -v "$PWD/playwright/bench:/probe:ro" "$OURS" \
            sh -c 'apk add --no-cache binutils >/dev/null 2>&1;
                   sh /probe/webkit-elf-audit.sh /ms-playwright alpine' \
            2>&1 | tee elf-out/alpine.txt
          docker run --rm --user 0 \
            -v "$PWD/playwright/bench:/probe:ro" \
            "mcr.microsoft.com/playwright:v${PW}-noble" \
            sh -c 'apt-get update >/dev/null 2>&1;
                   apt-get install -y binutils >/dev/null 2>&1;
                   sh /probe/webkit-elf-audit.sh /ms-playwright official' \
            2>&1 | tee elf-out/official.txt

      # ----------------------------------------------------------- fmod cost
      # The `libm_fmod` row is a libc call after all. A slowed-down `fmod`
      # interposed into Playwright's own image moved its kernel 193 -> 1943 ms
      # and its WebProcess counted 54,000,030 calls, so BOTH engines go to
      # libc and the row is musl-vs-glibc after the shim, exactly as the
      # kernel's name says. (An earlier reading of "zero calls" was mine and
      # was wrong: the interposer had not loaded.)
      #
      # This times the shipped shim and each candidate against the libc of
      # each image, on one runner. Locally the ranking inverted between
      # candidates because a dev box's divider is several times slower than
      # Zen 4's, which is why it is measured here rather than there.
      - name: fmod candidates against each libc
        if: '!cancelled()'
        run: |
          set -o pipefail
          mkdir -p fmod-out
          docker run --rm --user 0 \
            -v "$PWD/playwright/alpine-browsers/webkit/fastfmod:/ff:ro" "$OURS" \
            sh -c 'apk add --no-cache gcc musl-dev >/dev/null 2>&1;
                   echo "== vs musl"; sh /ff/candidates/run-bench.sh' \
            2>&1 | tee fmod-out/alpine.txt
          docker run --rm --user 0 \
            -v "$PWD/playwright/alpine-browsers/webkit/fastfmod:/ff:ro" \
            "mcr.microsoft.com/playwright:v${PW}-noble" \
            sh -c 'apt-get update >/dev/null 2>&1;
                   apt-get install -y gcc >/dev/null 2>&1;
                   echo "== vs glibc"; sh /ff/candidates/run-bench.sh' \
            2>&1 | tee fmod-out/official.txt

      # ------------------------------------------------------------ unwinder
      # The launch profile spends 2.28% of ALL samples in libgcc_s on our arm
      # and under 0.17% on Playwright's, in the static CFI machinery past
      # `_Unwind_Backtrace`. That names the file, not the reason: exceptions
      # actually being thrown, or stack walks with no exception at all. The
      # counter separates them; run-unwind-probe.sh handles the preload, which
      # has to be prepended to pw_run.sh rather than exported.
      - name: C++ throws and stack walks at launch
        if: '!cancelled()'
        run: |
          set -o pipefail
          mkdir -p unwind-out
          for target in alpine official; do
            if [ "$target" = official ]; then
              image="mcr.microsoft.com/playwright:v${PW}-noble"; home=/root
            else
              image="$OURS"; home=/home/runner
            fi
            docker run --rm --user 0 \
              --security-opt seccomp=unconfined \
              --env "HOME=$home" --env "PW_VERSION=$PW" --env SECS=20 \
              -v "$PWD/playwright/bench:/probe:ro" \
              -v "$PWD/playwright/scripts:/pwscripts:ro" \
              "$image" sh /probe/run-unwind-probe.sh \
              2>&1 | tee "unwind-out/$target.txt"
          done
          for target in alpine official; do
            echo "== $target"
            { grep -h "unwind-counter" "unwind-out/$target.txt" || true; } \
              | awk -F'[= ]' '{t+=$5; w+=$7; r+=$9; u+=$11; f+=$13; p+=$15; n++} \
                  END {printf "%d processes, throws=%d walks=%d", n, t, w; \
                       printf " raises=%d resumes=%d forced=%d", r, u, f; \
                       printf " phdr_scans=%d\n", p}'
            sed -n '/dl_iterate_phdr callers/,$p' "unwind-out/$target.txt" | head -20
          done

      # -------------------------------------------------------------- launch
      # `launch()` is 1.31 while our binary carries FEWER relocations than
      # official's, so the syscall trace decides between loader work and
      # everything else the launch does (fontconfig, /proc reads, socket
      # setup) before another static theory gets written down.
      - name: strace launch
        if: '!cancelled()'
        run: |
          set -o pipefail
          mkdir -p strace-out
          for target in alpine official; do
            if [ "$target" = official ]; then
              image="mcr.microsoft.com/playwright:v${PW}-noble"; home=/root
              install='apt-get update >/dev/null 2>&1; apt-get install -y strace >/dev/null 2>&1'
            else
              image="$OURS"; home=/home/runner
              install='apk add --no-cache strace >/dev/null 2>&1'
            fi
            echo "::group::strace $target"
            docker run --rm --user 0 \
              --security-opt seccomp=unconfined --cap-add SYS_PTRACE \
              --env "HOME=$home" --env "PW_VERSION=$PW" \
              -v "$PWD/playwright/scripts:/pwscripts:ro" \
              "$image" \
              sh -c "$install
                NODE_PATH=\"\$(sh /pwscripts/global-node-path.sh)\"
                export NODE_PATH
                node -e 'require(\"playwright\")' 2>/dev/null \
                  || npm install -g --no-fund --no-audit \"playwright@\$PW_VERSION\" >/dev/null 2>&1
                strace -f -c -U name,calls,total-time,errors \
                  node -e '(async () => {
                    const { webkit } = require(\"playwright\");
                    for (let i = 0; i < 5; i++) {
                      const b = await webkit.launch();
                      await b.close();
                    }
                  })()' 2>&1 | tail -60" \
              2>&1 | tee "strace-out/$target.txt"
            echo "::endgroup::"
          done

      - name: Summarise
        if: '!cancelled()'
        run: |
          set -euo pipefail
          {
            echo "## WebKit lag diagnostics"
            echo
            echo "image: \`$OURS\` vs \`mcr.microsoft.com/playwright:v${PW}-noble\`"
            echo
            echo "### JSC tier arms (ms, median of $REPS)"
            echo
            python3 playwright/bench/jsc-report.py jsc-out
            echo
            echo "### Static ELF audit"
            echo '```'
            cat elf-out/alpine.txt elf-out/official.txt
            echo '```'
            echo
            echo "### fmod candidates (best of 5, bit-gated)"
            echo '```'
            cat fmod-out/alpine.txt fmod-out/official.txt
            echo '```'
            echo
            echo "### launch syscalls (5 launches)"
            echo '```'
            cat strace-out/alpine.txt strace-out/official.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wk-lag-diagnostics
          path: |
            jsc-out/
            elf-out/
            fmod-out/
            strace-out/
          if-no-files-found: warn
          retention-days: 30
