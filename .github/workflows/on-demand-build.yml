name: On-demand build (issue-triggered)

# Issue-form-driven entry point for off-primary version pins.
# - Listens on `issues: [opened]`. The form template auto-applies the
#   `build-request` label so the workflow's filter fires on submit. We
#   intentionally do NOT listen on `labeled` — that would re-trigger
#   every time we add our own `quota-exceeded` / `build-failed` labels.
#   To retry a failed/quota-exceeded request, open a new issue.
# - Parses the form body, enforces the 3-builds/24h quota, optionally
#   skips when the predicted tag is already on Docker Hub, then calls
#   `test-and-publish.yml` via `workflow_call` with the version inputs.
# - Comments status back to the issue and closes on success.

on:
  issues:
    types: [opened]

permissions:
  contents: read    # test-and-publish needs checkout
  issues: write     # comment + label
  packages: write   # GHCR push (build-layer)

concurrency:
  # One in-flight build per issue. Re-labelling cancels the prior attempt.
  group: on-demand-build-${{ github.event.issue.number }}
  cancel-in-progress: true

env:
  # `gh` defaults to inferring the repo from a local git remote, which fails
  # in jobs without `actions/checkout`. Setting GH_REPO short-circuits that
  # inference and applies to every `gh` invocation in this workflow.
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    if: contains(github.event.issue.labels.*.name, 'build-request')
    runs-on: ubuntu-latest
    outputs:
      # All three axes accept CSV / empty. The downstream test-and-publish workflow
      # parses them into matrix arrays; an empty value fans out to every default
      # entry on that axis (full chain rebuild at the requested version pins).
      os:           ${{ steps.parse.outputs.os }}
      os_version:   ${{ steps.parse.outputs.os_version }}
      image:        ${{ steps.parse.outputs.image }}
      flavor:       ${{ steps.parse.outputs.flavor }}
      node_version: ${{ steps.parse.outputs.node_version }}
      pnpm_version: ${{ steps.parse.outputs.pnpm_version }}
      pw_version:   ${{ steps.parse.outputs.pw_version }}
      quota_ok:     ${{ steps.quota.outputs.ok }}
    steps:
      - id: ensure-labels
        # `gh issue edit --add-label` errors if the label doesn't exist in the
        # repo. `--force` makes `gh label create` idempotent (creates if absent,
        # no-op overwrite if present). `build-request` is created out-of-band
        # by the maintainer (it gates this workflow's prepare-job `if:`).
        # The other four are state markers swapped on transitions:
        #   building (in-flight) → published (done) or build-failed (error).
        #   quota-exceeded is a terminal state set when the requester is over.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create building --force \
            --description "On-demand build is in flight" \
            --color FBCA04
          gh label create published --force \
            --description "On-demand build complete; pinned tag(s) pushed to Docker Hub" \
            --color 0E8A16
          gh label create quota-exceeded --force \
            --description "On-demand build request blocked: requester hit the 3/24h quota" \
            --color B60205
          gh label create build-failed --force \
            --description "On-demand build request failed: see linked workflow run" \
            --color B60205

      - id: parse
        # Issue-form bodies render as `### <label>\n\n<value>\n\n### <next>...`.
        # Optional fields with no value render as `_No response_` which we treat
        # as empty. The awk extractor finds the matching `### <label>` line and
        # returns the first non-empty content line under it.
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BODY" > /tmp/body.md
          extract() {
            awk -v field="$1" '
              BEGIN { found = 0 }
              /^### / {
                if (found) exit
                if (substr($0, 5) == field) found = 1
                next
              }
              found && NF { print; exit }
            ' /tmp/body.md
          }
          opt() {
            v=$(extract "$1")
            [ "$v" = "_No response_" ] && v=""
            printf '%s' "$v"
          }
          # Every axis is optional in the form (empty = build all). For multi-select
          # fields, the form body renders selected values as a comma-separated list
          # on a single line — exactly the CSV format test-and-publish expects, so
          # parse just passes the value through verbatim. Friendly flavor names
          # (hardened/sudoer) map to matrix values inside the matrices step.
          OS=$(opt          "OS family")
          OS_VERSION=$(opt  "OS version")
          IMAGE=$(opt       "Image variant(s)")
          FLAVOR=$(opt      "Flavor")
          NODE=$(opt        "Node version (optional)")
          PNPM=$(opt        "pnpm version (optional)")
          PW=$(opt          "Playwright version (optional)")
          {
            echo "os=$OS"
            echo "os_version=$OS_VERSION"
            echo "image=$IMAGE"
            echo "flavor=$FLAVOR"
            echo "node_version=$NODE"
            echo "pnpm_version=$PNPM"
            echo "pw_version=$PW"
          } >> "$GITHUB_OUTPUT"
          echo "Parsed: os='$OS' os_version='$OS_VERSION' image='$IMAGE' flavor='$FLAVOR' node='$NODE' pnpm='$PNPM' pw='$PW'"

      - id: quota
        # 3 builds / 24h / requester. Counts any build-request-labelled issue
        # opened by this author in the window (including this one — so the
        # 4th request hits the cap).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          since=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          count=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --author "$AUTHOR" \
            --label build-request \
            --state all \
            --search "created:>=$since" \
            --limit 100 \
            --json number | jq 'length')
          echo "build-request issues by $AUTHOR since $since: $count"
          if [ "$count" -gt 3 ]; then
            gh issue comment "${{ github.event.issue.number }}" --body \
              ":octagonal_sign: Quota exceeded: $count build-request issues from @$AUTHOR in the last 24h (cap = 3). Try again later."
            gh issue edit "${{ github.event.issue.number }}" --add-label quota-exceeded
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # An existing-tag precheck used to live here, predicting the pinned tag from
      # the inputs and skipping the build if it was already on Docker Hub. With
      # multi-select axes the prediction would have to fan out across every
      # combination, so the precheck was dropped — Docker Hub push of an unchanged
      # digest is a no-op anyway, and the cost is one rebuild for the rare case
      # of a fully-redundant request.

      - id: notify-start
        if: steps.quota.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            ":hammer_and_wrench: Build started. Wall-clock ~5-30 min depending on variant + matrix size. Progress: $RUN_URL"
          gh issue edit "${{ github.event.issue.number }}" --add-label building

  build:
    needs: prepare
    if: needs.prepare.outputs.quota_ok == 'true'
    uses: ./.github/workflows/test-and-publish.yml
    secrets: inherit
    with:
      os_version:     ${{ needs.prepare.outputs.os_version }}
      node_version:   ${{ needs.prepare.outputs.node_version }}
      pnpm_version:   ${{ needs.prepare.outputs.pnpm_version }}
      pw_version:     ${{ needs.prepare.outputs.pw_version }}
      only_os:        ${{ needs.prepare.outputs.os }}
      only_image:     ${{ needs.prepare.outputs.image }}
      only_flavor:    ${{ needs.prepare.outputs.flavor }}
      publish_latest: false

  comment-close:
    needs: [prepare, build]
    # Run after the build attempt. `always()` so failures still get a comment.
    if: always() && needs.prepare.outputs.quota_ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Comment success + close
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Newline-separated list of `jclaveau/<os>-<image><flavor>:<pin>`
          # strings, emitted by test-and-publish.yml's aggregate-tags job.
          # Empty when the aggregator collected no artifacts (defensive).
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -n "$TAGS" ]; then
            {
              echo ':white_check_mark: Build complete. Published:'
              echo
              echo "$TAGS" | sed 's/^/- `/; s/$/`/'
            } > /tmp/comment.md
          else
            echo ':white_check_mark: Build complete. New pinned tag(s) live under https://hub.docker.com/u/jclaveau — no per-tag list was emitted by the run.' > /tmp/comment.md
          fi
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md
          gh issue edit "${{ github.event.issue.number }}" --remove-label building --add-label published
          gh issue close "${{ github.event.issue.number }}"
      - name: Comment failure + label
        if: needs.build.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            ":x: Build failed (status: \`${{ needs.build.result }}\`). Logs: $RUN_URL"
          gh issue edit "${{ github.event.issue.number }}" --remove-label building --add-label build-failed
