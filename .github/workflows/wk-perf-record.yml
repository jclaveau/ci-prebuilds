name: WebKit differential profile

# Profiles one runtime-probe kernel in OUR image and in Playwright's, on one
# runner, and prints both symbol tables side by side.
#
# Why: `click_force` 1.24, `eval_rtt` 1.13 and `goto_cold` 1.11 have no
# candidate cause left. ThinLTO barely moves them; the stack protector looked
# certain — 233 941 canary loads against official's zero, and +12% instructions
# when chromium paid the same tax — and removing it changed nothing measurable
# (run 34160320006, verified on the probed image). Static inspection is spent,
# so this asks the profiler which symbols the time is actually in, the way the
# chromium screenshot row was settled once its own static list ran out.
#
# perf runs on the HOST, not in the container: `linux-tools` inside an image
# has to match the running kernel, and on a hosted runner it does not. The
# container's binaries are copied out into a symfs so the host's perf can
# resolve container paths that no longer exist once the run ends.
#
# Two things the first attempt (34166720981) got wrong, both fixed here:
#   - it attached with `--pid`, and the official arm's WebProcess was gone
#     between `pgrep` and `perf record` ("Couldn't create thread/CPU maps: No
#     such process"). WebKit recycles that process, so recording is now
#     system-wide and the reports select the comm instead.
#   - both images ship a STRIPPED libWPEWebKit (Dockerfile.finalize strips ours,
#     PW ships its zip stripped), so every frame came back as a raw address.
#     Ours has an unstripped twin: the strip happens in the finalize overlay, so
#     the producer's `wk-wpe-4-sha-<sha>` intermediate still carries .symtab.
#     Point `symbols_image` at it and the alpine arm resolves.

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Our consumer image to profile'
        default: 'jclaveau/alpine-dood-playwright:latest'
        type: string
      symbols_image:
        description: 'Unstripped producer image for the alpine arm (ghcr.io/jclaveau/playwright-alpine-browsers:wk-wpe-4-sha-<sha>)'
        default: ''
        type: string
      kernel:
        description: 'Which kernel to profile: click_force | eval_rtt | goto_cold | launch | screenshot | locator_click | libm_fmod | loader'
        default: 'click_force'
        type: string
      seconds:
        description: 'Profile window per arm'
        default: '45'
        type: string
      pw_version:
        description: 'Playwright version driving the probe, and the MCR control tag'
        default: '1.62.1'
        type: string

concurrency:
  group: wk-perf-record-${{ inputs.image }}-${{ inputs.kernel }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OURS: ${{ inputs.image }}
      SYMBOLS: ${{ inputs.symbols_image }}
      KERNEL: ${{ inputs.kernel }}
      SECONDS_PER_ARM: ${{ inputs.seconds }}
      PW: ${{ inputs.pw_version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free up runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc; df -h /

      - name: Install perf and unlock event access
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic
          # linux-tools-generic is built for the generic kernel and a hosted
          # runner runs the azure one, so the wrapper on PATH often refuses to
          # run. Resolve a real binary once and export it for the later steps
          # rather than discovering the mismatch mid-profile.
          if perf --version >/dev/null 2>&1; then
            PERF=perf
          else
            PERF="$(find /usr/lib/linux-tools -name perf -type f | head -1)"
          fi
          [ -n "$PERF" ] || { echo "no usable perf binary" >&2; exit 1; }
          "$PERF" --version
          echo "PERF=$PERF" >> "$GITHUB_ENV"
          # Which silicon this landed on decides how to read the result: the
          # same image and control read 0.93-0.96 on an EPYC 7763 and 1.12 on
          # a 9V74, because glibc's fmod gains on Zen 4 and ours does not.
          # Inferring the model from round counts after the fact is guesswork.
          grep -m1 'model name' /proc/cpuinfo || true
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w kernel.kptr_restrict=0

      - name: Pull both arms
        run: |
          set -euo pipefail
          docker pull "$OURS"
          docker pull "mcr.microsoft.com/playwright:v${PW}-noble"
          [ -z "$SYMBOLS" ] || docker pull "$SYMBOLS"

      - name: Profile both arms
        run: |
          set -o pipefail
          mkdir -p perf-out
          # Room for three things after the container starts: the sample
          # window, a 10 s syscall-count window on the same live container,
          # and the symfs copy, which needs it still running.
          window=$(( SECONDS_PER_ARM - 25 ))
          [ "$window" -ge 10 ] || window=10
          for target in alpine official; do
            if [ "$target" = official ]; then
              image="mcr.microsoft.com/playwright:v${PW}-noble"; home=/root
            else
              image="$OURS"; home=/home/runner
            fi
            cname="hotloop-$target"
            docker rm -f "$cname" >/dev/null 2>&1 || true
            echo "::group::$target — start hotloop"
            docker run -d --name "$cname" \
              --security-opt seccomp=unconfined \
              --env "HOME=$home" --env "PW_VERSION=$PW" \
              --env "KERNEL=$KERNEL" --env "SECS=$SECONDS_PER_ARM" \
              -v "$PWD/playwright/bench:/probe:ro" \
              -v "$PWD/playwright/scripts:/pwscripts:ro" \
              "$image" \
              sh -c '
                # `loader` is not a hotloop kernel: it re-runs MiniBrowser
                # --version, which loads the whole 123-object closure, prints a
                # version string and exits. That prices the loader and library
                # init on their own, with no driver, no page and no browsing —
                # 69 ms against official 41 ms, which is most of what `launch`
                # is short by.
                if [ "$KERNEL" = loader ]; then
                  cd /ms-playwright/webkit-*/minibrowser-wpe || exit 1
                  end=$(( $(date +%s) + SECS ))
                  while [ "$(date +%s)" -lt "$end" ]; do
                    ./MiniBrowser --version >/dev/null 2>&1
                  done
                  exit 0
                fi
                NODE_PATH="$(sh /pwscripts/global-node-path.sh)"
                export NODE_PATH
                node -e "require(\"playwright\")" 2>/dev/null \
                  || npm install -g --no-fund --no-audit "playwright@$PW_VERSION" >/dev/null 2>&1
                node /probe/wk-hotloop.cjs --browser webkit --kernel "$KERNEL" \
                  --seconds "$SECS"
              '
            # Wait for the WebProcess, which is where the work happens — the
            # driver is node and profiling it would answer a different question.
            # The loader kernel has none to wait for: every MiniBrowser it
            # starts lives ~70 ms, and a process that starts INSIDE the perf
            # window emits its own mmap events, so there is nothing to attach
            # to and nothing to synthesise.
            wpid=""
            if [ "$KERNEL" != loader ]; then
              for _ in $(seq 1 60); do
                sleep 2
                wpid=$(pgrep -f 'WPEWebProcess|WebKitWebProcess' | head -1 || true)
                [ -n "$wpid" ] && break
              done
            fi
            if [ -z "$wpid" ] && [ "$KERNEL" != loader ]; then
              echo "::warning::no WebProcess appeared for $target"
              docker logs "$cname" 2>&1 | tail -20
              docker rm -f "$cname" >/dev/null 2>&1 || true
              continue
            fi
            echo "$target WebProcess pid=$wpid"
            # What the process actually has mapped, kept beside the profile:
            # official's samples came back as `[unknown]`, which is either JIT
            # with no map file or a library perf never saw mapped, and only
            # this says which.
            if [ -n "$wpid" ]; then
              sudo grep -E 'WPEWebKit|MiniBrowser|\.so' "/proc/$wpid/maps" \
                | head -40 > "perf-out/$target.maps.txt" || true
            fi
            echo "::endgroup::"

            # System-wide, not --pid: WebKit recycles the WebProcess and the
            # pid found above can be gone before perf attaches. Only one
            # container runs at a time, and the reports select the comm.
            #
            # sudo, and that is not incidental. perf names an already-running
            # process's mappings by reading /proc/<pid>/maps, and the official
            # image runs its container as root while ours runs as the runner's
            # own uid — so an unprivileged perf could synthesise ours and not
            # theirs, and the official arm came back with every sample under
            # `[unknown]` and every thread named `:3911`. The launch kernel
            # resolved BOTH arms in the same run, because processes that START
            # inside the window emit live mmap events and need no synthesis.
            sudo "$PERF" record -a -F 499 -o "perf-out/$target.data" \
              -- sleep "$window" || echo "::warning::perf record failed for $target"
            sudo chown "$(id -u):$(id -g)" "perf-out/$target.data" || true

            # A sample profile says where CPU went, not how often the kernel
            # was entered — and the two rows still above parity spend MORE
            # system time and LESS user time than Playwright's. So count the
            # syscalls an allocator and a run loop generate, over a second
            # window on the same live container.
            sudo "$PERF" stat -a -e context-switches,page-faults \
              -e syscalls:sys_enter_mmap,syscalls:sys_enter_munmap \
              -e syscalls:sys_enter_madvise,syscalls:sys_enter_futex \
              -- sleep 10 2> "perf-out/$target.stat.txt" || true

            # symfs BEFORE the container dies: perf resolves the paths recorded
            # in the mmap events, and those live inside the container.
            echo "::group::$target — symfs"
            rev=$(docker exec "$cname" sh -c 'ls -d /ms-playwright/webkit-* 2>/dev/null | head -1' | tr -d '\r')
            sym="perf-out/symfs-$target"
            mkdir -p "$sym/lib" "$sym/usr/lib"
            docker cp "$cname:/lib/." "$sym/lib/" >/dev/null 2>&1 || true
            docker cp "$cname:/usr/lib/." "$sym/usr/lib/" >/dev/null 2>&1 || true
            if [ -n "$rev" ]; then
              mkdir -p "$sym$rev"
              docker cp "$cname:$rev/minibrowser-wpe" "$sym$rev/minibrowser-wpe" \
                >/dev/null 2>&1 || true
            fi
            # The shipped lib is stripped in both images; swap ours for the
            # unstripped producer copy so the frames carry names.
            if [ "$target" = alpine ] && [ -n "$SYMBOLS" ] && [ -n "$rev" ]; then
              docker rm -f wk-symbols >/dev/null 2>&1 || true
              docker create --name wk-symbols "$SYMBOLS" /bin/true >/dev/null
              rm -rf "$sym$rev/minibrowser-wpe"
              docker cp wk-symbols:/work/minibrowser-wpe-dist \
                "$sym$rev/minibrowser-wpe" >/dev/null
              docker rm -f wk-symbols >/dev/null 2>&1 || true
            fi
            lib=$(find "$sym$rev" -name 'libWPEWebKit*.so.*' -type f 2>/dev/null | head -1)
            if [ -n "$lib" ]; then
              # `grep -c` exits 1 on zero matches and the step runs under
              # bash -e, so official — which legitimately has no .symtab —
              # killed the whole run right here on the first attempt.
              symtabs=$(readelf -S -W "$lib" | grep -cE '\.symtab' || true)
              echo "$target symfs lib: $lib (symtab sections: ${symtabs:-0})"
            fi
            echo "::endgroup::"

            for sort in comm dso dso,symbol; do
              name=$(echo "$sort" | tr ',' '-')
              "$PERF" report -i "perf-out/$target.data" --stdio --no-children \
                --comms 'WPEWebProcess,WebKitWebProces,WPENetworkProce,MiniBrowser,node' \
                --sort "$sort" --percent-limit 0.1 -g none \
                --symfs "$sym" \
                2>/dev/null | head -70 > "perf-out/$target.$name.txt" || true
            done
            # Unfiltered comm table too: if the comm filter matched nothing,
            # this is what says which processes the samples actually landed in.
            "$PERF" report -i "perf-out/$target.data" --stdio --no-children \
              --sort comm --percent-limit 0.2 -g none 2>/dev/null | head -30 \
              > "perf-out/$target.all-comms.txt" || true

            # The iteration count is what makes that window comparable: the
            # arms do not run at the same rate, and a raw count would just
            # restate that.
            docker wait "$cname" >/dev/null 2>&1 || true
            docker logs "$cname" 2>&1 | grep -o 'rounds=[0-9]*' | tail -1 \
              > "perf-out/$target.rounds.txt" || true
            docker rm -f "$cname" >/dev/null 2>&1 || true
            # The symfs is hundreds of MB per arm; `sudo`, because `docker
            # cp` lands root-owned trees that the artifact upload cannot even
            # scandir (it failed on lib/ssl/private). The samples themselves
            # are 13 MB and DO travel — re-reporting them locally beats
            # re-running the job to change a sort order.
            sudo rm -rf "$sym"
          done

      - name: Summarise
        if: '!cancelled()'
        run: |
          set -euo pipefail
          {
            echo "## WebKit differential profile — \`$KERNEL\`"
            echo
            echo "\`$OURS\` vs \`mcr.microsoft.com/playwright:v${PW}-noble\`"
            echo "### syscalls and switches, 10 s window"
            echo '```'
            for target in alpine official; do
              echo "== $target ($(cat "perf-out/$target.rounds.txt" 2>/dev/null || echo 'rounds=?'))"
              grep -E 'sys_enter|context-switches|page-faults' \
                "perf-out/$target.stat.txt" 2>/dev/null || echo "(no stat)"
            done
            echo '```'
            for target in alpine official; do
              for name in all-comms dso dso-symbol; do
                echo
                echo "### $target — $name"
                echo '```'
                cat "perf-out/$target.$name.txt" 2>/dev/null || echo "(no report)"
                echo '```'
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # A failure mid-loop leaves a root-owned symfs behind, and the upload
      # then dies on it instead of shipping the reports that DID get written.
      - name: Drop the symfs before uploading
        if: always()
        run: sudo rm -rf perf-out/symfs-* || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wk-perf-record-${{ inputs.kernel }}
          path: |
            perf-out/*.txt
            perf-out/*.data
          if-no-files-found: warn
          retention-days: 30
