name: pnpm install CPU probe

# Why does an offline `pnpm install` cost more system CPU on the alpine image
# than on the ubuntu one (Planner: 37 vs 28 s sys)?
#
# Laptop finding (2026-10-29, i5-8350U, the Planner tree): the gap is the pnpm
# native binary that `packageManager: pnpm@12.6.0` selects. On alpine that is
# the static musl build, which has no mimalloc before 12.16.0, so it runs on
# musl mallocng: futex 7,425 vs 453,884 calls and mmap 933 vs 45,742 in the
# pnpm process alone. A static binary ignores the image's LD_PRELOAD mimalloc.
#
# Arms, one runner, interleaved, order rotating per round:
#   ubuntu-glibc-<old>  ubuntu image, glibc binary of the old pnpm (reference)
#   alpine-musl-<old>   alpine image, musl binary of the old pnpm (the gap)
#   ubuntu-musl-<old>   ubuntu image running the musl binary (binary vs image)
#   ubuntu-glibc-<new>  ubuntu image, glibc binary of the new pnpm
#   alpine-musl-<new>   alpine image, musl binary of the new pnpm (the fix)
# Fixture: a pinned public monorepo (vitest), packageManager stripped.

#
# mode null_pair sizes pnpm-perf-gate's margins instead: the promoted alpine
# image as both candidate and promoted (plus ubuntu), so every ratio it prints
# is noise.
#
# mode versions bisects a pnpm release range: one arm per listed version and
# libc, all on the ubuntu image so only the binary varies, with repeated
# `strace -f -c` passes and a stat-family path trace for the path_arms.
# source_refs adds arms built from git (`label=owner/repo@ref`), as a glibc
# release build of pnpm-cli on the runner, so an unreleased fix sits beside
# the released versions. Build a base ref too: the official binaries come
# out of `cross`, so only patched vs base varies the source alone.
#
# mode store_layer asks whether a CI image can ship the pnpm store: the store
# on a bind mount beside the project (hardlinks, today's layout), the same
# store in a lower image layer (a link across the bind mount cannot be made),
# node_modules installed into the image at /app beside the store, and
# node_modules alone (store mounted at build time only), each with and
# without pnpm_config_verify_store_integrity=false.
#
# mode deps_image measures the deps-image design (one image per lockfile
# hash): the store seeded and node_modules installed in one RUN, with the
# project in the image (onerun) or checked out on the bind mount with its
# node_modules symlinked into the image (linked). The pull_cost job then times,
# on a fresh runner with nothing cached, a cold pull of that image, of the
# deps_layer one (store and node_modules in two layers) and of their base, and
# an actions/cache restore of the same store and metadata cache.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'binaries: the five arms above; null_pair: the gate arms, one image twice'
        default: 'binaries'
        type: choice
        options: [binaries, null_pair, versions, store_layer, deps_image]
      versions:
        description: 'versions mode: space-separated pnpm versions'
        default: '12.6.0 12.16.1'
        type: string
      libcs:
        description: 'versions mode: glibc, musl, or both'
        default: 'glibc'
        type: choice
        options: [glibc, musl, both]
      source_refs:
        description: 'versions mode: space-separated label=owner/repo@ref, each built from source'
        default: ''
        type: string
      strace_rounds:
        description: 'strace -f -c passes per arm'
        default: '1'
        type: string
      path_arms:
        description: 'arms (e.g. glibc-12.6.0) whose stat-family calls are traced per path'
        default: ''
        type: string
      pnpm_old:
        description: 'pnpm version without the embedded mimalloc'
        default: '12.6.0'
        type: string
      pnpm_new:
        description: 'pnpm version with the embedded mimalloc'
        default: '12.16.1'
        type: string
      rounds:
        description: 'Interleaved rounds per runner'
        default: '5'
        type: string
      replicates:
        description: 'Runners (one job each)'
        default: '3'
        type: string
      fixture_repo:
        description: 'Git repo used as the workspace'
        default: 'https://github.com/vitest-dev/vitest'
        type: string
      fixture_sha:
        description: 'Commit of fixture_repo used as the workspace'
        default: 'da7ce1712fd4d0e4e807ec01ce755581e6892d5b'
        type: string
      fixture_ignore_scripts:
        description: 'Skip every lifecycle script (workspace prepare and dependency builds)'
        type: boolean
        default: false

concurrency:
  group: pnpm-install-probe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      replicate_list: ${{ steps.list.outputs.replicate_list }}
      source_list: ${{ steps.list.outputs.source_list }}
    steps:
      - id: list
        env:
          REPLICATES: ${{ inputs.replicates }}
          SOURCE_REFS: ${{ inputs.source_refs }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, re
          print('replicate_list=' + json.dumps(list(range(1, int(os.environ['REPLICATES']) + 1))))
          source_list = []
          for source_spec in os.environ['SOURCE_REFS'].split():
              spec_match = re.fullmatch(r'([a-z0-9]+)=([\w.-]+/[\w.-]+)@(\S+)', source_spec)
              if not spec_match:
                  raise SystemExit(f"source ref '{source_spec}' is not label=owner/repo@ref")
              label, repository, ref = spec_match.groups()
              source_list.append({'label': label, 'repository': repository, 'ref': ref})
          print('source_list=' + json.dumps(source_list))
          PY

  build:
    needs: matrix
    if: inputs.mode == 'versions' && inputs.source_refs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        source: ${{ fromJSON(needs.matrix.outputs.source_list) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.source.repository }}
          ref: ${{ matrix.source.ref }}
          persist-credentials: false

      # The release job's linux flags, minus cross: rust-toolchain.toml picks
      # the toolchain and Cargo.toml's release profile is the shipped one.
      - name: Build pnpm-cli
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C force-unwind-tables=no
        run: |
          set -euo pipefail
          echo "source ${{ matrix.source.repository }}@${{ matrix.source.ref }} = $(git rev-parse HEAD)"
          cargo build --locked -p pnpm-cli --bin pnpm --release
          mkdir -p out
          cp target/release/pnpm out/pnpm
          git rev-parse HEAD > out/commit.txt
          ./out/pnpm --version

      - uses: actions/upload-artifact@v7
        with:
          name: pnpm-source-${{ matrix.source.label }}
          path: out
          retention-days: 7

  probe:
    needs: [matrix, build]
    # build is skipped without source_refs; a failed build stops the probe.
    if: ${{ !cancelled() && needs.matrix.result == 'success' && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # deps_image pushes its layer images for pull_cost.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        replicate: ${{ fromJSON(needs.matrix.outputs.replicate_list) }}
    env:
      WORK: ${{ github.workspace }}/work
      OUT: ${{ github.workspace }}/out
      ROUNDS: ${{ inputs.rounds }}
      STRACE_ROUNDS: ${{ inputs.strace_rounds }}
      STRACE_PATH_ARMS: ${{ inputs.path_arms }}
      PNPM_OLD: ${{ inputs.pnpm_old }}
      PNPM_NEW: ${{ inputs.pnpm_new }}
      FIXTURE_REPO: ${{ inputs.fixture_repo }}
      FIXTURE_SHA: ${{ inputs.fixture_sha }}
      FIXTURE_IGNORE_SCRIPTS: ${{ inputs.fixture_ignore_scripts }}
    steps:
      - uses: actions/checkout@v7

      - name: Runner CPU and perf
        run: |
          set -euo pipefail
          model=$(awk -F': ' '/^model name/ { print $2; exit }' /proc/cpuinfo)
          echo "runner CPU: $model"
          echo "CPU_MODEL=$model" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic >/dev/null
          perf_path=$(command -v perf)
          perf --version
          sudo sysctl -w kernel.perf_event_paranoid=-1
          if python3 playwright/bench/pmu-check.py; then echo "PERF_CMD=sudo $perf_path" >> "$GITHUB_ENV"
          else echo "::warning::no PMU on $model: cgroup counters only, no perf stat"; fi

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Arms
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = null_pair ]; then
            promoted_image=ghcr.io/jclaveau/alpine-dood-pnpm:latest
            echo "ARMS=candidate=$promoted_image|image promoted=$promoted_image|image ubuntu=ghcr.io/jclaveau/ubuntu-dood-pnpm:latest|image" >> "$GITHUB_ENV"
          fi
          if [ "${{ inputs.mode }}" = store_layer ]; then
            alpine_image=ghcr.io/jclaveau/alpine-dood-pnpm:latest
            skip_verify=pnpm_config_verify_store_integrity=false
            arm_list="bind=$alpine_image|image bind_noverify=$alpine_image|image|$skip_verify"
            arm_list="$arm_list store_layer=store-layer:bind|image store_layer_noverify=store-layer:bind|image|$skip_verify"
            arm_list="$arm_list deps_layer=deps-layer:bind|image deps_layer_noverify=deps-layer:bind|image|$skip_verify"
            arm_list="$arm_list modules_layer=modules-layer:bind|image modules_layer_noverify=modules-layer:bind|image|$skip_verify"
            echo "ARMS=$arm_list" >> "$GITHUB_ENV"
          fi
          if [ "${{ inputs.mode }}" = deps_image ]; then
            alpine_image=ghcr.io/jclaveau/alpine-dood-pnpm:latest
            skip_verify=pnpm_config_verify_store_integrity=false
            arm_list="bind=$alpine_image|image bind_noverify=$alpine_image|image|$skip_verify"
            arm_list="$arm_list deps_layer_noverify=deps-layer:bind|image|$skip_verify"
            arm_list="$arm_list onerun_layer_noverify=onerun-layer:bind|image|$skip_verify"
            # The linked arm's require check names vitest's own packages.
            if [ "$FIXTURE_REPO" = https://github.com/vitest-dev/vitest ]; then
              arm_list="$arm_list linked_layer_noverify=linked-layer:bind|image|$skip_verify"
            fi
            echo "ARMS=$arm_list" >> "$GITHUB_ENV"
            echo "STORE_EXPORT_ARM=bind" >> "$GITHUB_ENV"
          fi
          if [ "${{ inputs.mode }}" = versions ]; then
            ubuntu_image=ghcr.io/jclaveau/ubuntu-dood-pnpm-gyp:latest
            case "$LIBCS" in
              both) libc_list="glibc musl" ;;
              glibc|musl) libc_list=$LIBCS ;;
              *) echo "unknown libcs '$LIBCS'" >&2; exit 1 ;;
            esac
            arm_list=""
            for pnpm_version in $VERSIONS; do
              for libc_name in $libc_list; do
                arm_list="$arm_list $libc_name-$pnpm_version=$ubuntu_image|$pnpm_version-$libc_name"
              done
            done
            for source_spec in $SOURCE_REFS; do
              source_label=${source_spec%%=*}
              arm_list="$arm_list glibc-$source_label=$ubuntu_image|$source_label-src"
            done
            echo "ARMS=${arm_list# }" >> "$GITHUB_ENV"
          fi
        env:
          VERSIONS: ${{ inputs.versions }}
          LIBCS: ${{ inputs.libcs }}
          SOURCE_REFS: ${{ inputs.source_refs }}

      # fetch_binary skips a binary already in $WORK/bins, so a source build
      # placed there stands in for a registry download.
      - uses: actions/download-artifact@v8
        if: inputs.mode == 'versions' && inputs.source_refs != ''
        with:
          pattern: pnpm-source-*
          path: ${{ github.workspace }}/sources

      - name: Place source builds
        if: inputs.mode == 'versions' && inputs.source_refs != ''
        env:
          SOURCE_REFS: ${{ inputs.source_refs }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          for source_spec in $SOURCE_REFS; do
            source_label=${source_spec%%=*}
            source_dir="$GITHUB_WORKSPACE/sources/pnpm-source-$source_label"
            # download-artifact extracts a lone matched artifact straight
            # into its path, without the per-artifact directory.
            if [ ! -d "$source_dir" ] && [ "$(wc -w <<< "$SOURCE_REFS")" -eq 1 ]; then
              source_dir="$GITHUB_WORKSPACE/sources"
            fi
            if [ ! -f "$source_dir/pnpm" ]; then
              echo "::error::no pnpm binary for source '$source_label' under $GITHUB_WORKSPACE/sources"
              ls -R "$GITHUB_WORKSPACE/sources"
              exit 1
            fi
            mkdir -p "$WORK/bins/$source_label-src"
            install -m 755 "$source_dir/pnpm" "$WORK/bins/$source_label-src/pnpm"
            echo "source $source_spec commit=$(cat "$source_dir/commit.txt")" | tee -a "$OUT/host.txt"
          done

      - name: Free disk for one store per arm
        if: inputs.mode == 'versions' || inputs.mode == 'store_layer' || inputs.mode == 'deps_image'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Probe
        run: bash node/bench/pnpm-install-probe.sh

      - name: Push the deps images for the pull timing
        if: inputs.mode == 'deps_image'
        env:
          PROBE_TAG_PREFIX: ghcr.io/jclaveau/pnpm-probe-deps:${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replicate }}
        run: |
          set -euo pipefail
          for layer_arm in onerun_layer_noverify deps_layer_noverify; do
            docker tag "pnpm-probe-$layer_arm:local" "$PROBE_TAG_PREFIX-$layer_arm"
            # The first push of a new package races the other replicates' and
            # can get `denied` while ghcr creates it.
            for push_attempt in 1 2 3; do
              docker push -q "$PROBE_TAG_PREFIX-$layer_arm" && break
              [ "$push_attempt" -lt 3 ] || { echo "::error::push of $(printf %q "$layer_arm") failed 3 times"; exit 1; }
              sleep 20
            done
          done

      - uses: actions/cache/save@v6
        if: inputs.mode == 'deps_image'
        with:
          path: ${{ github.workspace }}/work/export
          key: pnpm-probe-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replicate }}

      # The checkout both paths install, with the lockfile every arm installed.
      - name: Fixture export
        if: inputs.mode == 'deps_image'
        run: |
          set -euo pipefail
          mkdir -p "$WORK/fixture-export"
          cp -a "$WORK/fixture/." "$WORK/fixture-export/"
          cp "$OUT/pnpm-lock.yaml" "$WORK/fixture-export/pnpm-lock.yaml"

      - uses: actions/cache/save@v6
        if: inputs.mode == 'deps_image'
        with:
          path: ${{ github.workspace }}/work/fixture-export
          key: pnpm-probe-fixture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replicate }}

      - name: Null-pair spread
        if: inputs.mode == 'null_pair'
        # A null pair past the provisional ceiling is a finding about the
        # margin, not a failed probe: the job stays green, the step shows red.
        continue-on-error: true
        run: |
          set -o pipefail
          python3 playwright/bench/assert-perf-gate.py "$OUT/gate" --browser pnpm --runs "$ROUNDS" \
            --control ubuntu | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report
        if: always()
        run: |
          set -euo pipefail
          [ -f "$OUT/runs.txt" ] || { echo "no runs.txt: the probe did not reach the rounds" >&2; exit 1; }
          python3 node/bench/pnpm-install-probe-report.py "$OUT" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pnpm-install-probe-${{ matrix.replicate }}
          path: ${{ github.workspace }}/out
          retention-days: 90

  # A fresh runner has no image and no cache, like a consumer's first job.
  pull_cost:
    needs: [matrix, probe]
    # probe's skipped build ancestor fails the implicit success().
    if: ${{ !cancelled() && inputs.mode == 'deps_image' && needs.probe.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replicate: ${{ fromJSON(needs.matrix.outputs.replicate_list) }}
    env:
      PROBE_TAG_PREFIX: ghcr.io/jclaveau/pnpm-probe-deps:${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replicate }}
      BASE_REF: ghcr.io/jclaveau/alpine-dood-pnpm:latest
      PULL_ROUNDS: '3'
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache restore, start
        run: echo "RESTORE_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@v6
        id: restore
        with:
          path: ${{ github.workspace }}/work/export
          key: pnpm-probe-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replicate }}
          fail-on-cache-miss: true

      - name: Cache restore, end
        run: |
          set -euo pipefail
          restore_ms=$((($(date +%s%N) - RESTORE_START_NS) / 1000000))
          restored_bytes=$(du -sb "$GITHUB_WORKSPACE/work/export" | cut -f1)
          echo "cache_restore wall_ms=$restore_ms restored_bytes=$restored_bytes" | tee -a pull-cost.txt

      # Each pull starts from an empty image store; the arms alternate.
      - name: Cold pulls
        run: |
          set -euo pipefail
          grep -m1 'model name' /proc/cpuinfo | tee -a pull-cost.txt
          echo "docker storage driver: $(docker info -f '{{.Driver}}')" | tee -a pull-cost.txt
          for pull_round in $(seq 1 "$PULL_ROUNDS"); do
            for pull_ref in "$PROBE_TAG_PREFIX-onerun_layer_noverify" "$PROBE_TAG_PREFIX-deps_layer_noverify" "$BASE_REF"; do
              docker image prune -af >/dev/null
              left_images=$(docker image ls -q | wc -l)
              [ "$left_images" -eq 0 ] || { echo "::error::$left_images images left before a cold pull"; exit 1; }
              start_ns=$(date +%s%N)
              docker pull -q "$pull_ref" >/dev/null
              pull_ms=$((($(date +%s%N) - start_ns) / 1000000))
              image_bytes=$(docker image inspect -f '{{.Size}}' "$pull_ref")
              echo "pull round=$pull_round ref=$pull_ref wall_ms=$pull_ms image_bytes=$image_bytes" | tee -a pull-cost.txt
            done
          done
          cat pull-cost.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/work/fixture-export
          key: pnpm-probe-fixture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.replicate }}
          fail-on-cache-miss: true

      # A job's wall from an empty image store to installed node_modules. The
      # cache path pays the restore timed above once, then the base pull and
      # an install linking the checkout from the restored store; the image
      # paths pull, then install the project the image holds at /app.
      - name: Until installed
        run: |
          set -euo pipefail
          export_dir=$GITHUB_WORKSPACE/work/export
          skip_verify=pnpm_config_verify_store_integrity=false
          for until_round in $(seq 1 "$PULL_ROUNDS"); do
            for path_name in cache onerun_layer_noverify deps_layer_noverify; do
              docker image prune -af >/dev/null
              left_images=$(docker image ls -q | wc -l)
              [ "$left_images" -eq 0 ] || { echo "::error::$left_images images left before a cold pull"; exit 1; }
              if [ "$path_name" = cache ]; then
                sudo rm -rf "$export_dir/fx"
                cp -a "$GITHUB_WORKSPACE/work/fixture-export" "$export_dir/fx"
                sudo chown -R 1001:1001 "$export_dir"
                path_ref=$BASE_REF
                run_args=(-v "$export_dir:/w" -v "$export_dir/metadata:/home/runner/.cache/pnpm")
                install_dir=/w/fx
                store_dir=/w/store
              else
                path_ref=$PROBE_TAG_PREFIX-$path_name
                run_args=(--network none)
                install_dir=/app
                store_dir=/opt/store
              fi
              start_ns=$(date +%s%N)
              docker pull -q "$path_ref" >/dev/null
              pulled_ns=$(date +%s%N)
              docker run -d --name until-installed --entrypoint sleep --cpus=4 --memory=6g \
                -e HOME=/home/runner "${run_args[@]}" "$path_ref" infinity >/dev/null
              docker exec -u 1001 -e "$skip_verify" -w "$install_dir" until-installed \
                pnpm install --frozen-lockfile --offline --store-dir="$store_dir" >"until-$path_name-$until_round.log" 2>&1 \
                || { echo "::error::install failed: $(printf %q "$path_name") round $until_round"; tail -30 "until-$path_name-$until_round.log"; exit 1; }
              end_ns=$(date +%s%N)
              docker rm -f until-installed >/dev/null
              echo "until_installed round=$until_round path=$path_name pull_ms=$(((pulled_ns - start_ns) / 1000000)) start_install_ms=$(((end_ns - pulled_ns) / 1000000)) total_ms=$(((end_ns - start_ns) / 1000000))" \
                | tee -a pull-cost.txt
            done
          done
          grep until_installed pull-cost.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pnpm-pull-cost-${{ matrix.replicate }}
          path: pull-cost.txt
          retention-days: 90
