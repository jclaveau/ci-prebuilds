name: pnpm install CPU probe

# Why does an offline `pnpm install` cost more system CPU on the alpine image
# than on the ubuntu one (Planner: 37 vs 28 s sys)?
#
# Laptop finding (2026-10-29, i5-8350U, the Planner tree): the gap is the pnpm
# native binary that `packageManager: pnpm@12.6.0` selects. On alpine that is
# the static musl build, which has no mimalloc before 12.16.0, so it runs on
# musl mallocng: futex 7,425 vs 453,884 calls and mmap 933 vs 45,742 in the
# pnpm process alone. A static binary ignores the image's LD_PRELOAD mimalloc.
#
# Arms, one runner, interleaved, order rotating per round:
#   ubuntu-glibc-<old>  ubuntu image, glibc binary of the old pnpm (reference)
#   alpine-musl-<old>   alpine image, musl binary of the old pnpm (the gap)
#   ubuntu-musl-<old>   ubuntu image running the musl binary (binary vs image)
#   ubuntu-glibc-<new>  ubuntu image, glibc binary of the new pnpm
#   alpine-musl-<new>   alpine image, musl binary of the new pnpm (the fix)
# Fixture: a pinned public monorepo (vitest), packageManager stripped.

#
# mode null_pair sizes pnpm-perf-gate's margins instead: the promoted alpine
# image as both candidate and promoted (plus ubuntu), so every ratio it prints
# is noise.
#
# mode versions bisects a pnpm release range: one arm per listed version and
# libc, all on the ubuntu image so only the binary varies, with repeated
# `strace -f -c` passes and a stat-family path trace for the path_arms.
# source_refs adds arms built from git (`label=owner/repo@ref`), as a glibc
# release build of pnpm-cli on the runner, so an unreleased fix sits beside
# the released versions. Build a base ref too: the official binaries come
# out of `cross`, so only patched vs base varies the source alone.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'binaries: the five arms above; null_pair: the gate arms, one image twice'
        default: 'binaries'
        type: choice
        options: [binaries, null_pair, versions]
      versions:
        description: 'versions mode: space-separated pnpm versions'
        default: '12.6.0 12.16.1'
        type: string
      libcs:
        description: 'versions mode: glibc, musl, or both'
        default: 'glibc'
        type: choice
        options: [glibc, musl, both]
      source_refs:
        description: 'versions mode: space-separated label=owner/repo@ref, each built from source'
        default: ''
        type: string
      strace_rounds:
        description: 'strace -f -c passes per arm'
        default: '1'
        type: string
      path_arms:
        description: 'arms (e.g. glibc-12.6.0) whose stat-family calls are traced per path'
        default: ''
        type: string
      pnpm_old:
        description: 'pnpm version without the embedded mimalloc'
        default: '12.6.0'
        type: string
      pnpm_new:
        description: 'pnpm version with the embedded mimalloc'
        default: '12.16.1'
        type: string
      rounds:
        description: 'Interleaved rounds per runner'
        default: '5'
        type: string
      replicates:
        description: 'Runners (one job each)'
        default: '3'
        type: string
      fixture_sha:
        description: 'vitest-dev/vitest commit used as the workspace'
        default: 'da7ce1712fd4d0e4e807ec01ce755581e6892d5b'
        type: string

concurrency:
  group: pnpm-install-probe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      replicate_list: ${{ steps.list.outputs.replicate_list }}
      source_list: ${{ steps.list.outputs.source_list }}
    steps:
      - id: list
        env:
          REPLICATES: ${{ inputs.replicates }}
          SOURCE_REFS: ${{ inputs.source_refs }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, re
          print('replicate_list=' + json.dumps(list(range(1, int(os.environ['REPLICATES']) + 1))))
          source_list = []
          for source_spec in os.environ['SOURCE_REFS'].split():
              spec_match = re.fullmatch(r'([a-z0-9]+)=([\w.-]+/[\w.-]+)@(\S+)', source_spec)
              if not spec_match:
                  raise SystemExit(f"source ref '{source_spec}' is not label=owner/repo@ref")
              label, repository, ref = spec_match.groups()
              source_list.append({'label': label, 'repository': repository, 'ref': ref})
          print('source_list=' + json.dumps(source_list))
          PY

  build:
    needs: matrix
    if: inputs.mode == 'versions' && inputs.source_refs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        source: ${{ fromJSON(needs.matrix.outputs.source_list) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.source.repository }}
          ref: ${{ matrix.source.ref }}
          persist-credentials: false

      # The release job's linux flags, minus cross: rust-toolchain.toml picks
      # the toolchain and Cargo.toml's release profile is the shipped one.
      - name: Build pnpm-cli
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C force-unwind-tables=no
        run: |
          set -euo pipefail
          echo "source ${{ matrix.source.repository }}@${{ matrix.source.ref }} = $(git rev-parse HEAD)"
          cargo build --locked -p pnpm-cli --bin pnpm --release
          mkdir -p out
          cp target/release/pnpm out/pnpm
          git rev-parse HEAD > out/commit.txt
          ./out/pnpm --version

      - uses: actions/upload-artifact@v7
        with:
          name: pnpm-source-${{ matrix.source.label }}
          path: out
          retention-days: 7

  probe:
    needs: [matrix, build]
    # build is skipped without source_refs; a failed build stops the probe.
    if: ${{ !cancelled() && needs.matrix.result == 'success' && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        replicate: ${{ fromJSON(needs.matrix.outputs.replicate_list) }}
    env:
      WORK: ${{ github.workspace }}/work
      OUT: ${{ github.workspace }}/out
      ROUNDS: ${{ inputs.rounds }}
      STRACE_ROUNDS: ${{ inputs.strace_rounds }}
      STRACE_PATH_ARMS: ${{ inputs.path_arms }}
      PNPM_OLD: ${{ inputs.pnpm_old }}
      PNPM_NEW: ${{ inputs.pnpm_new }}
      FIXTURE_SHA: ${{ inputs.fixture_sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Runner CPU and perf
        run: |
          set -euo pipefail
          model=$(awk -F': ' '/^model name/ { print $2; exit }' /proc/cpuinfo)
          echo "runner CPU: $model"
          echo "CPU_MODEL=$model" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic >/dev/null
          perf_path=$(command -v perf)
          perf --version
          sudo sysctl -w kernel.perf_event_paranoid=-1
          if python3 playwright/bench/pmu-check.py; then echo "PERF_CMD=sudo $perf_path" >> "$GITHUB_ENV"
          else echo "::warning::no PMU on $model: cgroup counters only, no perf stat"; fi

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Arms
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = null_pair ]; then
            promoted_image=ghcr.io/jclaveau/alpine-dood-pnpm:latest
            echo "ARMS=candidate=$promoted_image|image promoted=$promoted_image|image ubuntu=ghcr.io/jclaveau/ubuntu-dood-pnpm:latest|image" >> "$GITHUB_ENV"
          fi
          if [ "${{ inputs.mode }}" = versions ]; then
            ubuntu_image=ghcr.io/jclaveau/ubuntu-dood-pnpm-gyp:latest
            case "$LIBCS" in
              both) libc_list="glibc musl" ;;
              glibc|musl) libc_list=$LIBCS ;;
              *) echo "unknown libcs '$LIBCS'" >&2; exit 1 ;;
            esac
            arm_list=""
            for pnpm_version in $VERSIONS; do
              for libc_name in $libc_list; do
                arm_list="$arm_list $libc_name-$pnpm_version=$ubuntu_image|$pnpm_version-$libc_name"
              done
            done
            for source_spec in $SOURCE_REFS; do
              source_label=${source_spec%%=*}
              arm_list="$arm_list glibc-$source_label=$ubuntu_image|$source_label-src"
            done
            echo "ARMS=${arm_list# }" >> "$GITHUB_ENV"
          fi
        env:
          VERSIONS: ${{ inputs.versions }}
          LIBCS: ${{ inputs.libcs }}
          SOURCE_REFS: ${{ inputs.source_refs }}

      # fetch_binary skips a binary already in $WORK/bins, so a source build
      # placed there stands in for a registry download.
      - uses: actions/download-artifact@v8
        if: inputs.mode == 'versions' && inputs.source_refs != ''
        with:
          pattern: pnpm-source-*
          path: ${{ github.workspace }}/sources

      - name: Place source builds
        if: inputs.mode == 'versions' && inputs.source_refs != ''
        env:
          SOURCE_REFS: ${{ inputs.source_refs }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          for source_spec in $SOURCE_REFS; do
            source_label=${source_spec%%=*}
            source_dir="$GITHUB_WORKSPACE/sources/pnpm-source-$source_label"
            mkdir -p "$WORK/bins/$source_label-src"
            install -m 755 "$source_dir/pnpm" "$WORK/bins/$source_label-src/pnpm"
            echo "source $source_spec commit=$(cat "$source_dir/commit.txt")" | tee -a "$OUT/host.txt"
          done

      - name: Free disk for one store per arm
        if: inputs.mode == 'versions'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Probe
        run: bash node/bench/pnpm-install-probe.sh

      - name: Null-pair spread
        if: inputs.mode == 'null_pair'
        # A null pair past the provisional ceiling is a finding about the
        # margin, not a failed probe: the job stays green, the step shows red.
        continue-on-error: true
        run: |
          set -o pipefail
          python3 playwright/bench/assert-perf-gate.py "$OUT/gate" --browser pnpm --runs "$ROUNDS" \
            --control ubuntu | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report
        if: always()
        run: |
          set -euo pipefail
          [ -f "$OUT/runs.txt" ] || { echo "no runs.txt: the probe did not reach the rounds" >&2; exit 1; }
          python3 node/bench/pnpm-install-probe-report.py "$OUT" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pnpm-install-probe-${{ matrix.replicate }}
          path: ${{ github.workspace }}/out
          retention-days: 90
