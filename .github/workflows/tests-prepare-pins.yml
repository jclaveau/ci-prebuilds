name: tests-prepare-pins

# The 15 rows of the prepare action's opt-in inputs (node-version-file, compare-pnpm-pin,
# pnpm-store) and the 13 rows of the store script they share, then the action itself
# through `uses:` twice. The rows run prepare.js and pnpm-store.sh with node and pnpm
# shims and a scratch workspace: no runner, seconds. The `uses:` jobs are what prove
# action.yml - the inputs reaching INPUT_*, the pnpm-matches-pin output and the store
# variables reaching a later step - which no row can reach. One per libc: the container
# job is the musl arm, the VM job the glibc arm and the no-image case prepare defaults
# DOCKER_MODE for.

on:
  pull_request:
    paths:
      - '.github/actions/prepare/**'
      - 'tests/scripts/test-prepare-pins.sh'
      - 'tests/scripts/test-pnpm-store.sh'
      - '.github/workflows/tests-prepare-pins.yml'
  push:
    branches: [main]
    paths:
      - '.github/actions/prepare/**'
      - 'tests/scripts/test-prepare-pins.sh'
      - 'tests/scripts/test-pnpm-store.sh'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: prepare pins unit test
        run: bash tests/scripts/test-prepare-pins.sh
      # Two suites in one job since the fold: a red pins row must not hide the store rows.
      - name: pnpm store directory unit test
        if: always()
        run: bash tests/scripts/test-pnpm-store.sh

  action:
    runs-on: ubuntu-latest
    # The node layer: DOCKER_MODE=dood baked, a node and no pnpm. The node check passes
    # against a .nvmrc written from it, and the pnpm comparison has to come out false.
    container: jclaveau/alpine-dood-node:latest
    steps:
      - uses: actions/checkout@v7
      - name: pin the image's own node, and a pnpm the image does not ship
        run: |
          node --version > .nvmrc
          echo '{ "packageManager": "pnpm@11.2.0" }' > package.json
      - id: prepare
        uses: ./.github/actions/prepare
        with:
          pnpm-store: true
          node-version-file: .nvmrc
          compare-pnpm-pin: true
      - name: the output and the store variables reached this step
        env:
          MATCHES_PIN: ${{ steps.prepare.outputs.pnpm-matches-pin }}
        run: |
          set -eu
          [ "$MATCHES_PIN" = "false" ] \
            || { echo "::error::pnpm-matches-pin=$MATCHES_PIN, not false on an image without pnpm"; exit 1; }
          [ "$STORE_PATH" = ".pnpm-store" ] \
            || { echo "::error::STORE_PATH=$STORE_PATH, not the workspace-relative .pnpm-store"; exit 1; }
          [ "$PNPM_STORE_CACHE_PREFIX" = "Linux-musl-pnpm-store-" ] \
            || { echo "::error::PNPM_STORE_CACHE_PREFIX=$PNPM_STORE_CACHE_PREFIX, not Linux-musl-pnpm-store-"; exit 1; }
          echo "PASS: prepare resolved through uses: with all three inputs"

  action-vm:
    runs-on: ubuntu-latest
    # No container: the glibc arm of the prefix, which the alpine job above cannot show.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
        with:
          pnpm-store: true
      - name: the three store variables reached this step
        run: |
          set -euo pipefail
          expected_store="$GITHUB_WORKSPACE/.pnpm-store"
          [ "$pnpm_config_store_dir" = "$expected_store" ] \
            || { echo "::error::pnpm_config_store_dir=$pnpm_config_store_dir, not $expected_store"; exit 1; }
          [ "$STORE_PATH" = ".pnpm-store" ] \
            || { echo "::error::STORE_PATH=$STORE_PATH, not the workspace-relative .pnpm-store"; exit 1; }
          [ "$PNPM_STORE_CACHE_PREFIX" = "Linux-glibc-pnpm-store-" ] \
            || { echo "::error::PNPM_STORE_CACHE_PREFIX=$PNPM_STORE_CACHE_PREFIX, not Linux-glibc-pnpm-store-"; exit 1; }
          echo "PASS: prepare exported all three on a VM job"
