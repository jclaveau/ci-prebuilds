name: Test and Publish

on:
  push:
    # Limit push to main: PRs target main and fire `pull_request` already, so
    # leaving this unfiltered ran the whole workflow twice per PR commit (once
    # for push, once for pull_request) — pure CI waste, no extra signal.
    branches: [ main ]
    paths-ignore:
      # The musl-Firefox + chromium-headless-shell producer is independent of
      # this chain — it has its own workflow (playwright-alpine-browsers.yml).
      # Skip TP when only the producer sub-project changes to avoid wasting
      # runner minutes.
      - 'playwright/alpine-browsers/**'
      - '.github/workflows/playwright-alpine-browsers.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'playwright/alpine-browsers/**'
      - '.github/workflows/playwright-alpine-browsers.yml'
  # Reusable entry point: lets `on-demand-build.yml` (issue-triggered) call
  # this workflow with version overrides + matrix filters. Every input defaults
  # to empty / `true` so the push/PR path is byte-identical to today (verified
  # via manifest-digest match for non-gyp variants on the same source commit).
  workflow_call:
    inputs:
      os_version:      { type: string,  default: '' }   # e.g. '22.04', '3.20'
      node_version:    { type: string,  default: '' }   # e.g. '20.18.0'
      pnpm_version:    { type: string,  default: '' }   # e.g. '9.15.3'
      pw_version:      { type: string,  default: '' }   # e.g. '1.50.1'
      chs_rev:         { type: string,  default: '' }   # e.g. '1217' (chromium-headless-shell revision; alpine-only); derived from pw_version's browsers.json by on-demand-build.yml. Empty = use Dockerfile.alpine's ARG CHS_REV default (current pin).
      # All three `only_*` axes use the same convention: comma-separated friendly names,
      # empty = no filter (every default-matrix entry runs, byte-identical to today).
      # Whitespace around commas is tolerated.
      only_os:         { type: string,  default: '' }   # 'ubuntu' | 'alpine' (CSV) | '' (both)
      only_image:      { type: string,  default: '' }   # CSV of variants, e.g. 'dood-playwright,dind-playwright' | '' (all 13)
      only_flavor:     { type: string,  default: '' }   # 'hardened' | 'sudoer' (CSV) | '' (both)
      publish_latest:  { type: boolean, default: true }
    outputs:
      # Newline-separated `jclaveau/<os>-<image><flavor>:<pin>` strings —
      # every consumer tag actually pushed by `promote`, aggregated from
      # per-cell artifacts by the `aggregate-tags` job. Used by
      # `on-demand-build.yml` to enumerate the published tags in the
      # success comment instead of just linking to Docker Hub.
      tags:
        description: Newline-separated repo:tag list pushed to Docker Hub by this run.
        value: ${{ jobs.aggregate-tags.outputs.tags }}
  # schedule:
  #   # Run weekly to get security updates
  #   - cron: '0 0 * * 0'
  # Manual full rebuild — refresh consumer `:latest` when a producer moving tag
  # (e.g. chs-<rev>) updates with no code change here (push-path gating skips it).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel topic-branch runs freely (fast feedback on iterated pushes) but
  # NEVER cancel a main run mid-`promote` — half-published Docker Hub tags
  # are worse than the cost of letting two main runs finish serially.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  # Renovate-managed (see renovate.json customManager for `ACT_VERSION:`).
  ACT_VERSION: 0.2.89

jobs:
  github-context:
    # TEMPORARY: skip TP entirely on the alpine-browsers PR while we iterate on
    # the musl producer / Juggler diagnosis. The PR touches production files
    # (playwright/Dockerfile.alpine, pnpm/, etc.) that legitimately invoke TP,
    # but each iteration burns ~15 min of runner. Drop this skip when the PR
    # is ready to merge. Cascades to all downstream jobs via `needs:`.
    # head_ref is set for PRs; ref_name for direct pushes. The `||` picks
    # whichever is non-empty.
    if: (github.head_ref || github.ref_name) != 'playwright-alpine-browsers'
    runs-on: ubuntu-latest
    outputs:
      docker_group_id: ${{ steps.extract_docker_group_id.outputs.docker_group_id }}
      # Throwaway run-scoped tag. Builds push only this; the chain + tests reference it. The
      # consumer tags (latest / pr-<n>) are added later by `promote`, only once every test passes.
      build_tag: sha-${{ github.sha }}
      # Workflow_call matrix narrowing. Computed once here, every downstream job's matrix
      # references these via fromJSON. Job-level `if:` can't see `matrix.*` (matrix expands
      # after `if:`), so narrowing the matrix at definition time is the only way to skip
      # entire cells (incl. `container:`-using test jobs, where an unmatched cell would
      # otherwise try to pull a never-built image).
      # On push/PR `inputs.*` is null → defaults stand → full matrices, identical to today.
      os_matrix:     ${{ steps.matrices.outputs.os_matrix }}
      image_matrix:  ${{ steps.matrices.outputs.image_matrix }}
      flavor_matrix: ${{ steps.matrices.outputs.flavor_matrix }}
      # perf-probe axis: os_matrix + the `official` MCR control it is compared to.
      perf_targets:  ${{ steps.matrices.outputs.perf_targets }}
      # Playwright version the `official` control must pull, so its bundled browser
      # revisions match the ones our images bake.
      pw_version:    ${{ steps.pw.outputs.pw_version }}
      # JSON object {gha_tools, dind_hardened, dood_dind, node, pnpm,
      # pnpm_gyp, playwright} → bool. Each test job gates on the relevant
      # key via fromJSON(); skipped tests don't block the `promote` gate.
      test_filters: ${{ steps.matrices.outputs.test_filters }}
    steps:
      # for debug only
      - run: sudo cat /etc/passwd
      - run: sudo cat /etc/group
      - run: pwd
      - run: whoami
      - run: id -u
      - run: id -g
      - run: groups runner
      - run: ls -l /home/runner
      - run: env

      - uses: actions/checkout@v7

      # Static lint for every workflow under .github/workflows AND every composite
      # action under .github/actions. Catches misspelled keys, bad expressions
      # (e.g. `if: env.X = 'y'`), missing `shell:` on composite run steps, etc.
      # Fast-fails the chain before any matrix computation or build job kicks off.
      - uses: raven-actions/actionlint@v2
        with:
          # Ignore `if-cond` on the 2 intentionally-disabled jobs (playwright-alpine-browsers.yml:684,
          # 852). actionlint's -ignore matches the error message (not the rule tag), and the wrapper's
          # flag parser preserves literal "-quote chars so we can't pass a spaced pattern — `.` matches
          # the space in "constant expression".
          flags: -ignore constant.expression

      # used later
      - id: extract_docker_group_id
        run: 'echo "docker_group_id=$(getent group docker | cut -d: -f3)" >> "$GITHUB_OUTPUT"'

      # Build the JSON arrays the downstream matrices consume.
      - id: matrices
        env:
          ONLY_OS:     ${{ inputs.only_os }}
          ONLY_IMAGE:  ${{ inputs.only_image }}
          ONLY_FLAVOR: ${{ inputs.only_flavor }}
        run: |
          set -euo pipefail

          # Comma-separated → JSON array. Trims whitespace per entry, drops empties
          # (so 'a, b' and 'a,b' both work). Optional second arg maps friendly names
          # to matrix values via a `friendly=value` lookup table (used by flavor).
          # Unknown entries error out so a typo in an issue body fails loudly here
          # rather than silently expanding to a never-matching matrix cell.
          csv_to_json() {
            local csv="$1" map="${2:-}" json='[' sep=''
            IFS=',' read -ra parts <<< "$csv"
            local raw trimmed mapped found pair k v
            for raw in "${parts[@]}"; do
              trimmed=$(echo "$raw" | xargs)
              [ -z "$trimmed" ] && continue
              if [ -n "$map" ]; then
                found=0; mapped=''
                for pair in $map; do
                  k="${pair%%=*}" v="${pair#*=}"
                  if [ "$k" = "$trimmed" ]; then mapped="$v"; found=1; break; fi
                done
                if [ "$found" = 0 ]; then
                  echo "::error::Unknown value '$trimmed' (allowed: $(echo "$map" | sed 's/=[^ ]*//g; s/ /,/g'))"
                  exit 1
                fi
                trimmed="$mapped"
              fi
              json+="${sep}\"${trimmed}\""
              sep=','
            done
            json+=']'
            echo "$json"
          }

          # Returns success when any CSV entry (trimmed, case-insensitive) is 'All'.
          # The issue template's os + flavor multi-selects expose 'All' as a clickable
          # alternative to the empty-means-all convention — both paths fall through
          # to the full default array.
          has_all() {
            local raw trimmed
            IFS=',' read -ra parts <<< "$1"
            for raw in "${parts[@]}"; do
              trimmed=$(echo "$raw" | xargs)
              if [ "${trimmed,,}" = "all" ]; then return 0; fi
            done
            return 1
          }

          # OS axis (every job with matrix.os). Empty OR 'All' → full default.
          if [ -z "$ONLY_OS" ] || has_all "$ONLY_OS"; then
            os_matrix='["ubuntu", "alpine"]'
          else
            os_matrix="$(csv_to_json "$ONLY_OS")"
          fi
          {
            echo "os_matrix=$os_matrix"
            # perf-probe targets = every OS this run actually builds, plus the
            # upstream MCR control it is measured against. Derived from os_matrix
            # so a narrowed on-demand run never probes an image it never pushed.
            echo "perf_targets=$(jq -c '. + ["official"]' <<< "$os_matrix")"
          } >> "$GITHUB_OUTPUT"

          # Image axis (build-hardened-variants + promote). On the issue path the
          # form requires ≥1 explicit pick; on push/PR inputs.* is null so we fall
          # through to the full default. No 'All' sentinel on this axis (would be
          # unreachable from the form).
          if [ -n "$ONLY_IMAGE" ]; then
            image_matrix=$(csv_to_json "$ONLY_IMAGE")
          else
            image_matrix='["gha-tools", "dood", "dind", "dood-node", "dind-node", "dood-pnpm", "dind-pnpm", "dood-pnpm-gyp", "dind-pnpm-gyp", "dood-playwright", "dind-playwright", "dood-playwright-gyp", "dind-playwright-gyp"]'
          fi
          echo "image_matrix=$image_matrix" >> "$GITHUB_OUTPUT"

          # test_filters: per-test booleans gating which test jobs run based on
          # image_matrix membership. Without these, on-demand requests that
          # narrow image_matrix (e.g. only_image=gha-tools) would still spawn
          # every test job, and tests that pull `<os>-<variant>-hardened` for
          # a non-built variant would fail with "manifest unknown".
          # Each filter answers "is any of this test's covered images in the
          # requested image_matrix?". Tests cover one or more images:
          #   gha_tools_*       → gha-tools
          #   dind_hardened     → dind
          #   dood_dind_*       → dood, dind
          #   node_*            → dood-node, dind-node
          #   pnpm_*            → dood-pnpm, dind-pnpm
          #   pnpm_gyp_*        → dood-pnpm-gyp, dind-pnpm-gyp
          #   playwright_*      → dood-playwright[-gyp], dind-playwright[-gyp]
          mapfile -t _imgs < <(jq -r '.[]' <<< "$image_matrix")
          declare -A _in_image
          for i in "${_imgs[@]}"; do _in_image[$i]=1; done
          intersects() {
            local img
            for img in "$@"; do
              if [ -n "${_in_image[$img]:-}" ]; then return 0; fi
            done
            return 1
          }
          filters='{}'
          add_filter() {
            local k="$1"; shift
            local v=false
            if intersects "$@"; then v=true; fi
            filters=$(jq --arg k "$k" --argjson v "$v" '.[$k] = $v' <<< "$filters")
          }
          add_filter gha_tools     gha-tools
          add_filter dind_hardened dind
          add_filter dood_dind     dood dind
          add_filter node          dood-node dind-node
          add_filter pnpm          dood-pnpm dind-pnpm
          add_filter pnpm_gyp      dood-pnpm-gyp dind-pnpm-gyp
          add_filter playwright    dood-playwright dind-playwright dood-playwright-gyp dind-playwright-gyp
          # jq pretty-prints by default; emit single-line for GITHUB_OUTPUT
          # (multi-line values need the heredoc-marker form, overkill here).
          echo "test_filters=$(jq -c <<< "$filters")" >> "$GITHUB_OUTPUT"

          # Flavor axis (promote). Friendly names in / matrix values out:
          # 'hardened' → '' (consumer default) | 'sudoer' → '-sudoer' (build-chain).
          # Empty OR 'All' → both flavors.
          if [ -z "$ONLY_FLAVOR" ] || has_all "$ONLY_FLAVOR"; then
            echo 'flavor_matrix=["", "-sudoer"]' >> "$GITHUB_OUTPUT"
          else
            echo "flavor_matrix=$(csv_to_json "$ONLY_FLAVOR" "hardened= sudoer=-sudoer")" >> "$GITHUB_OUTPUT"
          fi

      # The perf-probe's `official` control is `mcr.microsoft.com/playwright:v<pw>-noble`,
      # and a control whose bundled browser revisions differ from ours is not a control.
      # The on-demand path passes the version explicitly; every other path takes the
      # repo's own fixture version, which is also what the images are built against.
      - name: Resolve Playwright version
        id: pw
        env:
          INPUT_PW: ${{ inputs.pw_version }}
        run: |
          PW="$INPUT_PW"
          if [ -z "$PW" ]; then
            PW="$(jq -r '.devDependencies.playwright // .dependencies.playwright // empty' playwright/package.json)"
          fi
          PW="${PW#[\^~]}"
          [ -n "$PW" ] || { echo "no pw_version input and no playwright dep in playwright/package.json" >&2; exit 1; }
          echo "pw_version=$PW" >> "$GITHUB_OUTPUT"

      # Structural lint: any smoke YAML that issues a `docker` command must bind the
      # host socket. Without it, act-on-GHA's inherited bridge gives a false-positive
      # pass while a real GHA `container:` consumer would fail. Catches the regression
      # at YAML-edit time rather than at smoke-run time.
      - name: Lint — smokes that use docker must bind /var/run/docker.sock
        run: |
          fail=0
          for f in tests/act/smoke-dood*.yml; do
            uses_docker=$(grep -cE '^\s*-?\s*(name:.*|run:.*)?docker (info|run|build|compose|ps|inspect)' "$f" || true)
            has_sock=$(grep -c '/var/run/docker.sock' "$f" || true)
            if [ "$uses_docker" -gt 0 ] && [ "$has_sock" -eq 0 ]; then
              echo "FAIL: $f issues a docker command but does not bind /var/run/docker.sock"
              echo "      Without the bind, act-on-GHA's inherited bridge gives a false-positive pass."
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1


  # ----------------------------------------------------------------------------
  # Change detection: a layer is (re)built iff its own context dir OR any ancestor changed, or the shared
  # build infra changed. Emits a JSON map {<image>: true|false}; each build-* job passes the whole map to
  # build-layer, which retags the previous `edge` image instead of rebuilding when its entry is false.
  # ----------------------------------------------------------------------------
  changes:
    # head_ref is set for PRs; ref_name for direct pushes. The `||` picks
    # whichever is non-empty.
    if: (github.head_ref || github.ref_name) != 'playwright-alpine-browsers'
    runs-on: ubuntu-latest
    outputs:
      map: ${{ steps.compute.outputs.map }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need history to diff before..after
      - id: compute
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          ALL=0
          : > /tmp/changed.txt
          case "$EVENT" in
            workflow_dispatch) ALL=1 ;;
            pull_request)
              git fetch --no-tags origin "$BASE_REF"
              git diff --name-only "origin/${BASE_REF}...HEAD" > /tmp/changed.txt ;;
            push)
              if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                ALL=1
              else
                git diff --name-only "$BEFORE" "$SHA" > /tmp/changed.txt 2>/dev/null || ALL=1
              fi ;;
            *) ALL=1 ;;
          esac
          python3 - "$ALL" <<'PY'
          import json, os, sys
          all_changed = sys.argv[1] == "1"
          files = [] if all_changed else [l.strip() for l in open("/tmp/changed.txt") if l.strip()]
          # shared build infra -> rebuild everything (safe)
          if any(f == ".github/workflows/test-and-publish.yml"
                 or f.startswith(".github/actions/build-layer/") for f in files):
              all_changed = True

          def dir_changed(d):
              return any(f == d or f.startswith(d + "/") for f in files)

          # suffix -> (context dir, base suffix). "__GHA__" = the os-specific gha-tools dir (chain root).
          GRAPH = {
              "gha-tools": ("__GHA__", None),
              "docker": ("docker", "gha-tools"),
              "dood": ("dood", "docker"),
              "dind": ("dind", "docker"),
              "dood-node": ("node", "dood"),
              "dind-node": ("node", "dind"),
              "dood-pnpm": ("pnpm", "dood-node"),
              "dind-pnpm": ("pnpm", "dind-node"),
              "dood-pnpm-gyp": ("pnpm-gyp", "dood-node"),
              "dind-pnpm-gyp": ("pnpm-gyp", "dind-node"),
              "dood-playwright": ("playwright", "dood-pnpm"),
              "dind-playwright": ("playwright", "dind-pnpm"),
              "dood-playwright-gyp": ("playwright", "dood-pnpm-gyp"),
              "dind-playwright-gyp": ("playwright", "dind-pnpm-gyp"),
          }
          # `-hardened` overlays: rebuild when harden/ changes OR when their non-hardened
          # parent rebuilds. Every promoted image (gha-tools + dood-family + dind-family)
          # gets hardened. The dind family's start-dockerd uses a narrow per-binary
          # sudoers entry (installed by dind/Dockerfile, survives harden/) so the init
          # dance still works without granting broad NOPASSWD. The unpublished `docker`
          # intermediate is the only image not hardened.
          HARDENABLE = [s for s in GRAPH if s != "docker"]
          for suffix in HARDENABLE:
              GRAPH[f"{suffix}-hardened"] = ("harden", suffix)
          cache = {}
          def changed(osname, suffix):
              k = (osname, suffix)
              if k in cache:
                  return cache[k]
              d, base = GRAPH[suffix]
              dd = f"{osname}-gha-tools" if d == "__GHA__" else d
              r = dir_changed(dd) or (changed(osname, base) if base else False)
              cache[k] = r
              return r

          m = {}
          for osname in ("ubuntu", "alpine"):
              for suffix in GRAPH:
                  m[f"{osname}-{suffix}"] = True if all_changed else changed(osname, suffix)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("map=" + json.dumps(m) + "\n")
          print(json.dumps(m, indent=2))
          PY


  # ----------------------------------------------------------------------------
  # Builds: a shared, unpublished `docker` base (ubuntu-gha-tools + docker/compose), then TWO
  # symmetric, independent chains built in parallel — each layer's dood and dind build side by side:
  #   dood: docker -> dood -> dood-node -> dood-pnpm -> dood-playwright
  #   dind: docker -> dind -> dind-node -> dind-pnpm -> dind-playwright
  # The only difference is the base: `dind` applies the ./dind overlay (start-dockerd) once, then both
  # chains install node/pnpm/playwright the same way (./node, ./pnpm, ./playwright). The layers are
  # re-installed per chain on purpose — the symmetric, easy-to-follow graph matters more than dedup
  # (CI is free on open source).
  # Matrix `os` is currently [ubuntu]; adding alpine = extend the list (+ os-specific dirs).
  # Every build-* job sets `fail-fast: false` so an alpine failure does not cancel an in-flight
  # ubuntu push (or vice versa), which would leave the downstream chain with a missing parent.
  # ----------------------------------------------------------------------------

  build-gha-tools:
    runs-on: ubuntu-latest
    needs: [github-context, changes]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.github-context.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-layer
        with:
          image: ${{ matrix.os }}-gha-tools
          context: ./${{ matrix.os }}-gha-tools
          build_tag: ${{ needs.github-context.outputs.build_tag }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changed_map: ${{ needs.changes.outputs.map }}
          build_args: |
            ${{ inputs.os_version && format('OS_VERSION={0}', inputs.os_version) || '' }}

  # Unpublished shared base: ubuntu-gha-tools + docker/compose. Only ever pushed under the
  # throwaway build tag (never promoted); dood and dind are built from it in parallel.
  build-docker:
    runs-on: ubuntu-latest
    needs: [github-context, changes, build-gha-tools]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.github-context.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-layer
        with:
          image: ${{ matrix.os }}-docker
          context: ./docker
          dockerfile: ${{ matrix.os == 'alpine' && 'Dockerfile.alpine' || 'Dockerfile' }}
          base_image: ${{ matrix.os }}-gha-tools
          docker_group_id: ${{ needs.github-context.outputs.docker_group_id }}
          build_tag: ${{ needs.github-context.outputs.build_tag }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changed_map: ${{ needs.changes.outputs.map }}

  build-dood:
    runs-on: ubuntu-latest
    needs: [github-context, changes, build-docker]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.github-context.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-layer
        with:
          image: ${{ matrix.os }}-dood
          context: ./dood
          base_image: ${{ matrix.os }}-docker
          build_tag: ${{ needs.github-context.outputs.build_tag }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changed_map: ${{ needs.changes.outputs.map }}

  build-dind:
    runs-on: ubuntu-latest
    needs: [github-context, changes, build-docker]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.github-context.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-layer
        with:
          image: ${{ matrix.os }}-dind
          context: ./dind
          dockerfile: ${{ matrix.os == 'alpine' && 'Dockerfile.alpine' || 'Dockerfile' }}
          base_image: ${{ matrix.os }}-docker
          build_tag: ${{ needs.github-context.outputs.build_tag }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changed_map: ${{ needs.changes.outputs.map }}


  build-node-dood:
    runs-on: ubuntu-latest
    needs: [github-context, changes, build-dood]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.github-context.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-layer
        with:
          image: ${{ matrix.os }}-dood-node
          context: ./node
          dockerfile: ${{ matrix.os == 'alpine' && 'Dockerfile.alpine' || 'Dockerfile' }}
          base_image: ${{ matrix.os }}-dood
          build_tag: ${{ needs.github-context.outputs.build_tag }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changed_map: ${{ needs.changes.outputs.map }}
          build_args: |
            ${{ inputs.node_version && format('NODE_VERSION={0}', inputs.node_version) || '' }}

  build-node-dind:
    runs-on: ubuntu-latest
    needs: [github-context, changes, build-dind]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.github-context.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-layer
        with:
          image: ${{ matrix.os }}-dind-node
          context: ./node
          dockerfile: ${{ matrix.os == 'alpine' && 'Dockerfile.alpine' || 'Dockerfile' }}
          base_image: ${{ matrix.os }}-dind
          build_tag: ${{ needs.github-context.outputs.build_tag }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changed_map: ${{ needs.changes.outputs.map }}
          build_args: |
            ${{ inputs.node_version && format('NODE_VERSION={0}', inputs.node_version) || '' }}


  build-pnpm-dood:
    runs-on: ubuntu-latest
    needs: [github-context, changes, build-node-dood]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.github-context.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-layer
        with:
          image: ${{ matrix.os }}-dood-pnpm
          context: ./pnpm
          base_image: ${{ matrix.os }}-dood-node
          build_tag: ${{ needs.github-context.outputs.build_tag }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changed_map: ${{ needs.changes.outputs.map }}
          build_args: |
            ${{ inputs.pnpm_version && format('PNPM_VERSION={0}', inputs.pnpm_version) || '' }}

  build-pnpm-dind:
    runs-on: ubuntu-latest
    needs: [github-context, changes, build-node-dind]
    permissions:
      contents: read
      packages: write
    strategy:
