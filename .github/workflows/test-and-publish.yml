  # ----------------------------------------------------------------------------
  # act: exercise the DIND_REGISTRY_AUTOSTART path — the dind image auto-spawns
  # `ci-prebuilds-dind-registry` on the host docker daemon (reached via the
  # bind-mounted host socket) and points its inner dockerd at it via
  # registry-mirrors. Piggybacks the `dood_dind` filter — no new filter key.
  # ----------------------------------------------------------------------------

  test-dind-registry-autostart:
    runs-on: ubuntu-latest
    if: fromJSON(needs.github-context.outputs.test_filters).dood_dind
    needs: [github-context, build-dind]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.github-context.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install act
        run: curl -sSL "https://raw.githubusercontent.com/nektos/act/v${ACT_VERSION}/install.sh" | sudo bash -s -- -b /usr/local/bin
      - name: Pre-pull the container image
        run: docker pull "ghcr.io/jclaveau/${{ matrix.os }}-dind:${{ needs.github-context.outputs.build_tag }}"
      - name: Run the autostart smoke workflow through act
        env:
          IMG: ghcr.io/jclaveau/${{ matrix.os }}-dind:${{ needs.github-context.outputs.build_tag }}
        run: |
          act push -W tests/act/smoke-dind-registry-autostart.yml \
            -P ubuntu-latest=-self-hosted \
            --var RUNNER_IMAGE="$IMG"


  # ----------------------------------------------------------------------------
  # Versions: read the actual installed minors once from the top dood image (it
  # transitively contains OS + node + pnpm + playwright). `promote` turns these
  # into the version-pinned consumer tags. node is read from the image because its
  # ARG isn't authoritative (NodeSource installs the latest within the major).
  # ----------------------------------------------------------------------------

  versions:
    runs-on: ubuntu-latest
    needs: [github-context, build-playwright-dood]
    outputs:
      os: ${{ steps.v.outputs.os }}
      node: ${{ steps.v.outputs.node }}
      pnpm: ${{ steps.v.outputs.pnpm }}
      pw: ${{ steps.v.outputs.pw }}
      alpine_os: ${{ steps.va.outputs.alpine_os }}
      alpine_node: ${{ steps.va.outputs.alpine_node }}
      alpine_pnpm: ${{ steps.va.outputs.alpine_pnpm }}
      alpine_pw: ${{ steps.va.outputs.alpine_pw }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        # Skip the ubuntu read when only alpine was requested — the ubuntu image
        # wasn't built, so `docker run` would fail. The matching ubuntu cells of
        # `promote` skip via the only_os filter, so their `${{ ... outputs.os }}`
        # references never resolve.
        if: inputs.only_os != 'alpine'
        env:
          IMG: ghcr.io/jclaveau/ubuntu-dood-playwright:${{ needs.github-context.outputs.build_tag }}
        run: |
          # `docker run` pull progress goes to stderr, so $GITHUB_OUTPUT (stdout) stays clean.
          # Prefixes are baked in so `promote` composes the pinned tag by concatenation.
          # node/pnpm/playwright resolve via the image's ENV PATH (+= $PNPM_HOME); node is in /usr/bin.
          docker run --rm "$IMG" bash -c '
            . /etc/os-release
            echo "os=ubuntu${VERSION_ID}"
            echo "node=node$(node -v | sed "s/^v//" | cut -d. -f1,2)"
            echo "pnpm=pnpm$(pnpm -v | cut -d. -f1,2)"
            echo "pw=pw$(playwright --version | grep -oE "[0-9]+\.[0-9]+" | head -1)"
          ' >> "$GITHUB_OUTPUT"
      # Alpine minors, read from alpine-dood-playwright (transitively OS + node + pnpm + playwright).
      - id: va
        if: inputs.only_os != 'ubuntu'
        env:
          IMG: ghcr.io/jclaveau/alpine-dood-playwright:${{ needs.github-context.outputs.build_tag }}
        run: |
          docker run --rm "$IMG" bash -c '
            . /etc/os-release
            echo "alpine_os=alpine$(echo "$VERSION_ID" | cut -d. -f1,2)"
            echo "alpine_node=node$(node -v | sed "s/^v//" | cut -d. -f1,2)"
            echo "alpine_pnpm=pnpm$(pnpm -v | cut -d. -f1,2)"
            echo "alpine_pw=pw$(playwright --version | grep -oE "[0-9]+\.[0-9]+" | head -1)"
          ' >> "$GITHUB_OUTPUT"


  # ----------------------------------------------------------------------------
  # Promote: the all-or-nothing publish gate. `needs` every test job, so a single
  # failure skips this job entirely and nothing consumer-facing is published. On
  # success it adds the consumer tags (latest / pr-<n>) to the exact digests that
  # were tested — server-side retag via imagetools, no pull/rebuild.
  # ----------------------------------------------------------------------------

  promote:
    # Publish consumer tags to Docker Hub ONLY on main pushes OR via workflow_call
    # (the on-demand path), ONLY after all tests pass. The test-gate is satisfied by
    # `needs:` enumerating every `test-*` job below; this `if:` blocks topic-branch /
    # PR / Renovate pushes from publishing tags.
    # On workflow_call, the only_os / only_image / only_flavor filters further
    # narrow which matrix cells actually publish (push/PR path → all empty → no
    # narrowing, full matrix as today).
    # Push/PR/Renovate: this job runs only on main pushes. On-demand path
    # (issues / issue_comment triggers on `on-demand-build.yml`, which
    # workflow_call's us): always runs but its matrix is already narrowed by
    # github-context's outputs to the requested cell(s).
    # `!failure() && !cancelled()` lets `promote` tolerate test-* needs that
    # were skipped by `test_filters` on narrowed on-demand runs — without it,
    # default `success()` semantics would skip promote (and aggregate-tags →
    # the on-demand published-tags comment) whenever ANY test was filtered out.
    # `github.event_name` inside a reusable workflow reflects the CALLER's
    # event (push/issues/issue_comment/…), never the literal `'workflow_call'`
    # — so enumerate the on-demand entry-point events explicitly here.
    if: >-
      !failure() && !cancelled()
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || github.event_name == 'issues'
        || github.event_name == 'issue_comment'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One transient Docker Hub 502 should not cancel the other cells mid-
      # `imagetools create` — that leaves consumer tags partially advanced.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.github-context.outputs.os_matrix) }}
        image: ${{ fromJSON(needs.github-context.outputs.image_matrix) }}
        # '' = default (hardened — runner has no broad NOPASSWD sudo)
        #   → publishes to `<image>:latest`.
        # '-sudoer' = build-chain image (runner NOPASSWD: ALL intact)
        #   → publishes to `<image>-sudoer:latest`.
        flavor: ${{ fromJSON(needs.github-context.outputs.flavor_matrix) }}
    needs: [github-context, versions, build-hardened-variants, test-gha-tools-usage, test-gha-tools-effects, test-gha-tools-hardened-effects, test-dind-hardened-effects, test-dood-dind-usage, test-dood-dind-effects, test-dood-dind-act, test-dind-registry-autostart, test-node-usage, test-pnpm-usage, test-pnpm-gyp-usage, test-playwright-usage]
    steps:
      - uses: docker/setup-buildx-action@v3
      # GHCR login to READ the tested source image.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub login to PUSH the consumer tags. promote copies GHCR -> Docker Hub, so Docker Hub is
      # only ever pushed to here (a push, not subject to the pull rate limit).
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Resolve the GHCR source image: default flavor sources from the
      # `<image>-hardened` overlay output; sudoer flavor sources from the
      # unmodified build-chain `<image>`.
      - id: src
        run: |
          if [ "${{ matrix.flavor }}" = "" ]; then
            SRC="${{ matrix.image }}-hardened"
          else
            SRC="${{ matrix.image }}"
          fi
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
      # Compose the version-pinned tag for this image from the minors read by `versions`.
      - id: pin
        env:
          OS: ${{ matrix.os == 'alpine' && needs.versions.outputs.alpine_os || needs.versions.outputs.os }}
          NODE: ${{ matrix.os == 'alpine' && needs.versions.outputs.alpine_node || needs.versions.outputs.node }}
          PNPM: ${{ matrix.os == 'alpine' && needs.versions.outputs.alpine_pnpm || needs.versions.outputs.pnpm }}
          PW: ${{ matrix.os == 'alpine' && needs.versions.outputs.alpine_pw || needs.versions.outputs.pw }}
        run: |
          case "${{ matrix.image }}" in
            gha-tools|dood|dind)                     TAG="${OS}";;
            dood-node|dind-node)                     TAG="${OS}-${NODE}";;
            dood-pnpm|dind-pnpm)                     TAG="${OS}-${NODE}-${PNPM}";;
            dood-pnpm-gyp|dind-pnpm-gyp)             TAG="${OS}-${NODE}-${PNPM}-gyp";;
            dood-playwright|dind-playwright)         TAG="${OS}-${NODE}-${PNPM}-${PW}";;
            dood-playwright-gyp|dind-playwright-gyp) TAG="${OS}-${NODE}-${PNPM}-${PW}-gyp";;
          esac
          # The hardened flavor (= consumer default) keeps the original tag.
          # The sudoer flavor gains a `-sudoer` tag suffix so an on-demand request
          # for it produces a self-describing pin (image namespace `-sudoer` alone
          # is easy to miss in pipelines that pin by `:tag`).
          if [ "${{ matrix.flavor }}" = "-sudoer" ]; then
            TAG="${TAG}-sudoer"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # `<image>` for the hardened (default) flavor; `<image>-sudoer` for the sudoer flavor.
          # The flavor suffix is in the IMAGE NAMESPACE, not in the tag — `:latest` keeps
          # semantically the same per flavor.
          images: jclaveau/${{ matrix.os }}-${{ matrix.image }}${{ matrix.flavor }}
          tags: |
            type=ref,event=pr
            # `:latest` is the consumer-default for the primary stack. The on-demand
            # path explicitly passes publish_latest=false (it builds an off-primary
            # version pin and must not advance `:latest`). On push/main, inputs.* is
            # null, so we gate via event_name first and fall through to inputs only
            # for the workflow_call path.
            type=raw,value=latest,enable=${{ github.event_name == 'push' || (github.event_name == 'workflow_call' && inputs.publish_latest) }}
            type=raw,value=${{ steps.pin.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Promote tested digest to consumer tags
        # Docker Hub intermittently returns 400 Bad Request on one child
        # manifest PUT during multi-arch fan-out; the same payload succeeds
        # on retry. `imagetools create` is idempotent, so retry the whole
        # call (up to 3 attempts, sleeping 10s then 30s between them).
        run: |
          set -e
          for i in 1 2 3; do
            # shellcheck disable=SC2046  # jq emits `-t name -t name`; quoting would collapse to a single arg
            if docker buildx imagetools create \
              $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
              ghcr.io/jclaveau/${{ matrix.os }}-${{ steps.src.outputs.src }}:${{ needs.github-context.outputs.build_tag }}; then
              exit 0
            fi
            [ $i -lt 3 ] || break
            sleep_for=$((10 * 3 ** (i - 1)))
            echo "Attempt $i/3 failed; sleeping ${sleep_for}s before retry"
            sleep "$sleep_for"
          done
          echo "Promote failed after 3 attempts."
          exit 1
      # Emit the pinned tag this cell pushed as a per-cell artifact so the
      # downstream `aggregate-tags` job can collect across the matrix and
      # surface the full list as a workflow_call output (consumed by
      # `on-demand-build.yml`'s success comment).
      - name: Write tag fragment
        # File name carries the matrix coordinates so `aggregate-tags`'
        # `download-artifact merge-multiple: true` doesn't collapse 16
        # `tag.txt` files into one (each artifact has a unique NAME but
        # the per-artifact filename was identical, so the merge raced
        # and only one cell's tag survived).
        run: |
          mkdir -p /tmp/tag
          echo "jclaveau/${{ matrix.os }}-${{ matrix.image }}${{ matrix.flavor }}:${{ steps.pin.outputs.tag }}" \
            > /tmp/tag/tag-${{ matrix.os }}-${{ matrix.image }}${{ matrix.flavor || '-hardened' }}.txt
      - uses: actions/upload-artifact@v4
        with:
          # Artifact names must be unique across the matrix. Empty flavor (hardened)
          # is rewritten to `-hardened` so the name has the same shape as `-sudoer`.
          name: tag-${{ matrix.os }}-${{ matrix.image }}${{ matrix.flavor || '-hardened' }}
          path: /tmp/tag/tag-${{ matrix.os }}-${{ matrix.image }}${{ matrix.flavor || '-hardened' }}.txt
          retention-days: 1
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # aggregate-tags: collect every `tag-*` artifact (one per promoted cell)
  # and emit the union as a workflow_call output. on-demand-build.yml reads
  # `needs.build.outputs.tags` and renders the list in the success comment.
  # Runs even when some promote cells failed (fail-fast: false on promote),
  # so partial successes still surface what did publish.
  # ----------------------------------------------------------------------------
  aggregate-tags:
    needs: promote
    if: always() && needs.promote.result != 'skipped'
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.collect.outputs.tags }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tag-*
          merge-multiple: true
          path: /tmp/tags
      - id: collect
        run: |
          set -euo pipefail
          # No artifacts (e.g. every promote cell failed before the upload step) →
          # emit empty so consumers fall through to a generic Docker Hub link.
          if ! ls /tmp/tags/*.txt >/dev/null 2>&1; then
            echo "tags=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Multi-line outputs use the heredoc-marker form. Tag strings can't
          # contain `EOF` so a static delimiter is safe.
          {
            echo "tags<<EOF"
            cat /tmp/tags/*.txt | sort -u
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
