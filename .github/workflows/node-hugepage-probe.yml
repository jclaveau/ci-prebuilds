                  continue
              kind = "write" if int(match.group(3), 16) & 2 else "read"
              area = area_of(int(match.group(2), 16))
              event_counts[(match.group(1), area, kind)] += 1
              if match.group(1) == "page_fault_kernel" and area in ("stack", "arena"):
