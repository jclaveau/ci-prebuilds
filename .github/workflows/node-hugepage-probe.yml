            echo "--- large_pages=$large_pages"
            docker run --rm --privileged --user 0 -v "$RUNNER_TEMP/zero-pages-over-time.js:/probe.js:ro" \
              --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" /probe.js
            echo "prctl calls:"
            docker run --rm --user 0 --cap-add SYS_PTRACE --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" \
              --entrypoint sh "$NODE_IMAGE" -c 'apk add -q strace >/dev/null && strace -f -e trace=prctl -o /tmp/prctl node -e 0 && sed -E "s/^[0-9]+ +//" /tmp/prctl | sort | uniq -c'
          done

      - name: Which kernel PTE-installing paths run more often with the option off
        run: |
          set -euo pipefail
          candidate_list="do_anonymous_page do_pte_missing do_huge_pmd_anonymous_page move_ptes move_page_tables move_pgt_entry change_pte_range copy_pte_range madvise_populate faultin_page __get_user_pages do_set_pmd set_huge_zero_folio insert_pfn vm_insert_page remap_pfn_range_internal mfill_atomic_pte_zeropage collapse_huge_page do_numa_page"
          probe_events=()
          for function_name in $candidate_list; do
            sudo grep -qw "$function_name" /proc/kallsyms && sudo perf probe -q -a "$function_name" 2>/dev/null \
              || echo "no probe for $function_name"
          done
          for event_name in $(sudo perf probe -l 2>/dev/null | awk '{ print $1 }'); do
            probe_events+=(-e "$event_name")
          done
          echo "probes: ${probe_events[*]}"
          for large_pages in 0 1 0 1; do
            echo "--- large_pages=$large_pages"
            sudo perf record -q -a -g "${probe_events[@]}" -o "pte-$large_pages.data" -- \
              docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" \
                -e 'setTimeout(() => {}, 300)' || echo "perf record exited $?"
            sudo perf script -i "pte-$large_pages.data" -F comm,event,ip,sym 2>/dev/null | python3 -c '
          import collections, sys
          event_counts = collections.Counter()
          chain_counts = collections.Counter()
          for sample in sys.stdin.read().split("\n\n"):
              lines = [line.strip() for line in sample.strip().split("\n") if line.strip()]
              if not lines:
                  continue
              head = lines[0].split()
              comm, event = " ".join(head[:-1]), head[-1].rstrip(":")
              if comm.startswith(("dockerd", "containerd", "runc", "perf", "docker")):
                  continue
              event_counts[(comm, event)] += 1
              if event not in ("probe:do_anonymous_page", "probe:do_pte_missing"):
                  frames = [line.split()[1] for line in lines[1:] if len(line.split()) > 1]
                  chain_counts[(comm, event, " <- ".join(frames[1:7]))] += 1
          for (comm, event), count in sorted(event_counts.items(), key=lambda item: -item[1])[:30]:
              print(f"  {count:6d} {event} {comm}")
          for (comm, event, chain), count in chain_counts.most_common(12):
              print(f"  {count:6d} {event} {comm} {chain}")
          ' || echo "perf script exited $?"
          done

      - name: What provjobd is, and which ranges of node's memory it reads
        run: |
          set -euo pipefail
          ps -eo pid,ppid,user,comm,args | awk 'NR == 1 || /provjob/' | grep -v awk || true
          for scanner_pid in $(pgrep -f provjob || true); do
            echo "--- pid $scanner_pid"
            sudo ls -l "/proc/$scanner_pid/exe" || true
            sudo tr '\0' ' ' < "/proc/$scanner_pid/cmdline"; echo
            sudo cat "/proc/$scanner_pid/cgroup" || true
            sudo ls -l "/proc/$scanner_pid/fd" 2>/dev/null | tail -n +2 | awk '{ print $NF }' | sort | uniq -c | sort -rn | head -10 || true
          done
          systemctl list-units --all --no-pager 2>/dev/null | grep -iE 'prov|job|scan|defender|mde|falcon|guard' || true
          scanner_pid=$(pgrep -o '^provjobd' || true)
          if [ -z "$scanner_pid" ]; then
            echo "no provjobd process found by name; comm seen in perf was provjobd<pid>"
            exit 0
          fi
          for large_pages in 0 1; do
            echo "--- large_pages=$large_pages"
            sudo strace -f -tt -p "$scanner_pid" -e trace=openat,pread64,read,process_vm_readv -o "scan-$large_pages.txt" &
            strace_pid=$!
            sleep 1
            docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" \
              -e 'console.log("node pid in host ns: see openat"); setTimeout(() => process.stdout.write(require("fs").readFileSync("/proc/self/maps", "utf8")), 1500)' \
              >| "scan-maps-$large_pages.txt"
            sleep 1
            sudo kill "$strace_pid" || true
            wait "$strace_pid" || true
            echo "files opened:"
            grep -oE 'openat\([^"]*"[^"]+"' "scan-$large_pages.txt" | sed -E 's/.*"(.*)"/\1/; s#/proc/[0-9]+/#/proc/<pid>/#' | sort | uniq -c | sort -rn | head -15 || true
            echo "syscalls traced: $(wc -l < "scan-$large_pages.txt")"
            grep -vE 'pread64|openat' "scan-$large_pages.txt" | head -5 || true
            echo "pread64 on /proc/<pid>/mem by length:"
            { grep -E 'pread64\(' "scan-$large_pages.txt" || true; } | sed -E 's/.*, ([0-9]+), (0x[0-9a-f]+|[0-9]+)\) += (-?[0-9]+).*/\1 \3/' | sort | uniq -c | sort -rn | head -8
            python3 - "scan-maps-$large_pages.txt" "scan-$large_pages.txt" <<'PY'
          import collections, re, sys
          mapping_list = []
          for line in open(sys.argv[1]):
              parts = line.split()
              if "-" not in parts[0]:
                  continue
              start_text, end_text = parts[0].split("-")
              mapping_list.append((int(start_text, 16), int(end_text, 16), parts[5] if len(parts) > 5 else "[anon]"))
          bytes_by_mapping = collections.Counter()
          for line in open(sys.argv[2]):
              match = re.search(r"pread64\(\d+, .*, (\d+), (\d+|0x[0-9a-f]+)\)", line)
              if not match:
                  continue
              length, offset = int(match.group(1)), int(match.group(2), 0)
              for start, end, name in mapping_list:
                  if start <= offset < end:
                      size = end - start
                      label = {16781312: "thread stack", 1073741824: "mimalloc arena"}.get(size, name)
                      bytes_by_mapping[(label, size, offset - start)] += length
                      break
              else:
                  bytes_by_mapping[("not in node's maps", 0, 0)] += length
          per_label = collections.Counter()
          for (label, size, _), length in bytes_by_mapping.items():
              per_label[(label, size)] += length
          for (label, size), length in per_label.most_common(15):
              print(f"  {length // 1024:8d} KiB read from {label} (mapping {size // 1024} KiB)")
          PY
          done
      - name: The maps provjobd sees and the order and time of its reads, off vs on
        run: |
          set -euo pipefail
          scanner_pid=$(pgrep -o '^provjobd' || true)
          if [ -z "$scanner_pid" ]; then
            echo "no provjobd process found by name"
            exit 0
          fi
          for large_pages in 0 1; do
            echo "--- large_pages=$large_pages"
            sudo strace -f -ttt -s 4194304 -p "$scanner_pid" -e trace=openat,read,pread64 -o "order-$large_pages.txt" &
            strace_pid=$!
            sleep 1
            node_launch_time=$(date +%s.%N)
            docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" \
              -e 'setTimeout(() => {}, 1500)'
            sleep 1
            sudo kill "$strace_pid" || true
            wait "$strace_pid" || true
            sudo chmod a+r "order-$large_pages.txt"
            python3 - "order-$large_pages.txt" "$node_launch_time" <<'PY'
          import codecs, re, sys
          launch_time = float(sys.argv[2])
          maps_line_pattern = re.compile(r"^([0-9a-f]+)-([0-9a-f]+) (\S{4}) \S+ \S+ \d+\s*(.*)$")
          maps_fd_by_thread = {}
          maps_snapshot = []
          maps_read_time = None
          read_list = []
          for line in open(sys.argv[1]):
              thread_id, time_text = line.split()[:2]
              elapsed = float(time_text) - launch_time
              opened = re.search(r'openat\(\w+, "/proc/(\d+)/maps".*= (\d+)', line)
              if opened:
                  maps_fd_by_thread[thread_id] = opened.group(2)
                  print(f"  +{elapsed:7.3f} s openat /proc/{opened.group(1)}/maps")
                  continue
              opened = re.search(r'openat\(\w+, "/proc/(\d+)/mem".*= (\d+)', line)
              if opened:
                  print(f"  +{elapsed:7.3f} s openat /proc/{opened.group(1)}/mem")
                  continue
              content = re.search(r'read\((\d+), "(.*)"(?:\.\.\.)?, \d+\) = \d+', line)
              if content and maps_fd_by_thread.get(thread_id) == content.group(1):
                  text = codecs.decode(content.group(2), "unicode_escape")
                  for maps_line in text.splitlines():
                      if maps_line_pattern.match(maps_line):
                          maps_snapshot.append(maps_line)
                  maps_read_time = maps_read_time or elapsed
                  continue
              pread = re.search(r"pread64\(\d+, .*, (\d+), (\d+|0x[0-9a-f]+)\) = (-?\d+)", line)
              if pread:
                  read_list.append((elapsed, int(pread.group(2), 0), int(pread.group(1)), int(pread.group(3))))
          print(f"maps read at +{maps_read_time} s: {len(maps_snapshot)} mappings")
          mapping_list = []
          for maps_line in maps_snapshot:
              start_text, end_text, perms, name = maps_line_pattern.match(maps_line).groups()
              start, end = int(start_text, 16), int(end_text, 16)
              mapping_list.append((start, end, perms, name or "[anon]"))
              if end - start >= 1 << 20:
                  print(f"  {perms} {(end - start) // 1024:8d} KiB {name or '[anon]'}")
          print("preads in order (time since launch, mapping, offset in mapping, asked, got):")
          for elapsed, offset, asked, got in read_list:
              label = "not in its maps"
              for start, end, perms, name in mapping_list:
                  if start <= offset < end:
                      label = f"{perms} {(end - start) // 1024} KiB {name} +{(offset - start) // 1024} KiB"
                      break
              print(f"  +{elapsed:7.3f} s {label} asked {asked // 1024} KiB got {got // 1024} KiB")
          PY
          done
      - name: Node's boot timeline against the moment provjobd reads its maps, off vs on
        run: |
          set -euo pipefail
          for large_pages in 0 1; do
            echo "--- large_pages=$large_pages"
            sudo perf record -a -m 4096 -o "timeline-$large_pages.data" \
              -e syscalls:sys_enter_mmap -e syscalls:sys_exit_mmap -e syscalls:sys_enter_clone3 -e syscalls:sys_enter_clone \
              -e syscalls:sys_enter_pread64 -e syscalls:sys_enter_exit_group -- \
              docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" \
                -e 'setTimeout(() => {}, 1000)' || echo "perf record exited $?"
            sudo perf script -i "timeline-$large_pages.data" -F comm,tid,time,event,trace 2>/dev/null >| "timeline-$large_pages.txt" \
              || echo "perf script exited $?"
            echo "events per comm:"
            awk '{ print $1 }' "timeline-$large_pages.txt" | sort | uniq -c | sort -rn | head -12
            echo "first node-side and provjobd lines:"
            grep -m 40 -E '^ *(node|provjobd)' "timeline-$large_pages.txt" | cut -c1-220 || true
            python3 - "timeline-$large_pages.txt" <<'PY'
          import re, sys
          node_start = None
          pending_mmap = {}
          pread_count = 0
          for line in open(sys.argv[1]):
              match = re.match(r"\s*(\S.*?)\s+(\d+)\s+(\d+\.\d+):\s+syscalls:(\w+):\s*(.*)", line)
              if not match:
                  continue
              comm, thread_id, time_text, event_name, trace_text = match.groups()
              event_time = float(time_text)
              if comm == "node" and node_start is None:
                  node_start = event_time
                  print(f"  +   0.0 ms node first event ({event_name})")
              if node_start is None:
                  continue
              elapsed = (event_time - node_start) * 1000
              if comm == "node" or comm.startswith("V8") or comm.startswith("node"):
                  if event_name == "sys_enter_mmap":
                      length = int(re.search(r"len: 0x([0-9a-f]+)", trace_text).group(1), 16)
                      flags = int(re.search(r"flags: 0x([0-9a-f]+)", trace_text).group(1), 16)
                      if length >= 1 << 20:
                          pending_mmap[thread_id] = (length, flags)
                  elif event_name == "sys_exit_mmap" and thread_id in pending_mmap:
                      length, flags = pending_mmap.pop(thread_id)
                      result = trace_text.split("0x")[-1]
                      hugetlb_note = " MAP_HUGETLB" if flags & 0x40000 else ""
                      print(f"  +{elapsed:6.1f} ms {comm}: mmap {length // 1024} KiB flags 0x{flags:x}{hugetlb_note} -> {trace_text.strip()}")
                  elif event_name in ("sys_enter_clone3", "sys_enter_clone"):
                      print(f"  +{elapsed:6.1f} ms {comm}: clone3 (new thread)")
                  elif event_name == "sys_enter_exit_group":
                      print(f"  +{elapsed:6.1f} ms {comm}: exit_group")
              elif comm.startswith("provjobd") and event_name == "sys_enter_pread64":
                  pread_count += 1
                  if pread_count == 1:
                      print(f"  +{elapsed:6.1f} ms provjobd: first pread64 (maps already read)")
          print(f"  provjobd pread64 calls after node start: {pread_count}")
          PY
          done
      - name: What node's main thread does between start and its first thread, off vs on
        run: |
          set -euo pipefail
          for large_pages in 0 1 0 1; do
            echo "--- large_pages=$large_pages"
            grep -E '^thp_(fault_alloc|fault_fallback|split_pmd|zero_page_alloc) ' /proc/vmstat >| "vmstat-before.txt"
            sudo perf record -q -a -F 20000 -m 4096 -o "window-$large_pages.data" \
              -e cpu-clock -e sched:sched_switch -e exceptions:page_fault_user \
              -e syscalls:sys_enter_madvise -e syscalls:sys_enter_mprotect -e syscalls:sys_enter_munmap \
              -e syscalls:sys_exit_mmap -e syscalls:sys_enter_clone -- \
              docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" \
                -e 'setTimeout(() => {}, 300)' || echo "perf record exited $?"
            grep -E '^thp_(fault_alloc|fault_fallback|split_pmd|zero_page_alloc) ' /proc/vmstat \
              | paste - <(cat vmstat-before.txt) | awk '{ print "  vmstat " $1 " +" $2 - $4 }'
            sudo perf script -i "window-$large_pages.data" -F comm,tid,time,event,sym,dso,trace 2>/dev/null >| "window-$large_pages.txt" \
              || echo "perf script exited $?"
            python3 - "window-$large_pages.txt" <<'PY'
          import collections, re, sys
          node_thread = None
          node_start = None
          first_clone = None
          line_list = []
          for line in open(sys.argv[1]):
              match = re.match(r"\s*(\S.*?)\s+(\d+)\s+(\d+\.\d+):\s+(?:\d+\s+)?(\S+):\s*(.*)", line)
              if not match:
                  continue
              comm, thread_id, time_text, event_name, rest_text = match.groups()
              event_time = float(time_text)
              if node_thread is None and comm == "node":
                  node_thread, node_start = thread_id, event_time
              if thread_id == node_thread or (event_name == "sched:sched_switch" and node_thread and f"={node_thread} " in rest_text):
                  line_list.append((event_time, comm, thread_id, event_name, rest_text))
                  if event_name == "syscalls:sys_enter_clone" and first_clone is None:
                      first_clone = event_time
          if node_start is None or first_clone is None:
              print("  node start or first clone not seen")
              sys.exit(0)
          window_ms = (first_clone - node_start) * 1000
          print(f"  window start -> first clone: {window_ms:.1f} ms")
          on_cpu_by_symbol = collections.Counter()
          event_count = collections.Counter()
          madvise_list = []
          off_cpu_ms = 0.0
          switched_out_at = None
          for event_time, comm, thread_id, event_name, rest_text in line_list:
              if not node_start <= event_time <= first_clone:
                  continue
              event_count[event_name] += 1
              if event_name == "cpu-clock":
                  symbol = " ".join(rest_text.split()[1:]) or rest_text
                  on_cpu_by_symbol[symbol] += 1
              elif event_name == "sched:sched_switch":
                  if f"prev_pid={node_thread} " in rest_text:
                      switched_out_at = event_time
                  elif f"next_pid={node_thread} " in rest_text and switched_out_at is not None:
                      off_cpu_ms += (event_time - switched_out_at) * 1000
                      switched_out_at = None
              elif event_name == "syscalls:sys_enter_madvise":
                  madvise_list.append(f"+{(event_time - node_start) * 1000:.1f} ms {rest_text.strip()}")
          print(f"  off-CPU in window: {off_cpu_ms:.1f} ms")
          print("  events in window: " + ", ".join(f"{name.split(':')[-1]} {count}" for name, count in sorted(event_count.items())))
          print("  on-CPU samples (50 us each) by symbol, top 15:")
          for symbol, count in on_cpu_by_symbol.most_common(15):
              print(f"    {count:5d} {symbol[:110]}")
          print("  madvise calls in window:")
          for madvise_line in madvise_list[:12]:
              print(f"    {madvise_line[:150]}")
          PY
          done
      - name: Does a failed mmap make provjobd read a process sooner
        run: |
          set -euo pipefail
          cat >| mmap-trigger.py <<'PY'
          import ctypes, sys, time
          libc = ctypes.CDLL(None, use_errno=True)
          libc.mmap.restype = ctypes.c_void_p
          libc.mmap.argtypes = [ctypes.c_void_p, ctypes.c_size_t, ctypes.c_int, ctypes.c_int, ctypes.c_int, ctypes.c_long]
          arm_name = sys.argv[1]
          time.sleep(0.2)
          if arm_name == "hugetlb":
              libc.mmap(None, 2 << 20, 3, 0x22 | 0x40000, -1, 0)
          elif arm_name == "enomem":
              libc.mmap(None, 1 << 50, 3, 0x22, -1, 0)
          elif arm_name == "plain":
              libc.mmap(None, 2 << 20, 3, 0x22, -1, 0)
          time.sleep(0.6)
          PY
          for where_name in host container; do
            for arm_name in none plain hugetlb enomem none hugetlb; do
              if [ "$where_name" = host ]; then
                command_list=(python3 mmap-trigger.py "$arm_name")
              else
                command_list=(docker run --rm -v "$PWD/mmap-trigger.py:/t.py:ro" python:3.13-alpine python3 /t.py "$arm_name")
              fi
              sudo perf record -q -a -m 1024 -o trigger.data \
                -e syscalls:sys_exit_mmap -e syscalls:sys_enter_pread64 -e syscalls:sys_enter_openat -- \
                "${command_list[@]}" || echo "perf record exited $?"
              sudo perf script -i trigger.data -F comm,tid,time,event,trace 2>/dev/null >| trigger.txt || echo "perf script exited $?"
              python3 - trigger.txt "$where_name" "$arm_name" <<'PY'
          import re, sys
          python_start = None
          failed_list = []
          read_list = []
          for line in open(sys.argv[1]):
              match = re.match(r"\s*(\S.*?)\s+(\d+)\s+(\d+\.\d+):\s+syscalls:(\w+):\s*(.*)", line)
              if not match:
                  continue
              comm, thread_id, time_text, event_name, rest_text = match.groups()
              event_time = float(time_text)
              if comm.startswith("python") and python_start is None:
                  python_start = event_time
              if python_start is None:
                  continue
              elapsed = (event_time - python_start) * 1000
              if comm.startswith("python") and event_name == "sys_exit_mmap" and "0xfffffffffffffff" in rest_text:
                  failed_list.append(f"{elapsed:.1f}")
              if comm.startswith("provjobd") and event_name == "sys_enter_pread64":
                  read_list.append(f"{elapsed:.1f}")
          first_read = read_list[0] if read_list else "none"
          print(f"  {sys.argv[2]:9s} {sys.argv[3]:8s} failed mmaps at ms {failed_list} provjobd preads {len(read_list)}, first at ms {first_read}")
          PY
            done
          done
      - name: Which failed syscall of node triggers provjobd with the option off
        run: |
          set -euo pipefail
          for large_pages in 0 0 1; do
            echo "--- large_pages=$large_pages"
            sudo perf record -q -a -m 1024 -o failed.data \
              -e raw_syscalls:sys_exit --filter 'ret < 0' -e syscalls:sys_enter_pread64 -e syscalls:sys_enter_clone -- \
              docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" \
                -e 'setTimeout(() => {}, 300)' || echo "perf record exited $?"
            sudo perf script -i failed.data -F comm,tid,time,event,trace 2>/dev/null >| failed.txt || echo "perf script exited $?"
            python3 - failed.txt <<'PY'
          import re, sys
          syscall_names = {0: "read", 1: "write", 2: "open", 4: "stat", 9: "mmap", 10: "mprotect", 11: "munmap", 12: "brk",
                           13: "rt_sigaction", 16: "ioctl", 21: "access", 25: "mremap", 28: "madvise", 39: "getpid", 56: "clone",
                           59: "execve", 72: "fcntl", 89: "readlink", 157: "prctl", 202: "futex", 228: "clock_gettime",
                           257: "openat", 262: "newfstatat", 267: "readlinkat", 302: "prlimit64", 318: "getrandom",
                           332: "statx", 334: "rseq", 435: "clone3", 439: "faccessat2"}
          node_start = None
          first_read = None
          first_clone = None
          failed_list = []
          for line in open(sys.argv[1]):
              match = re.match(r"\s*(\S.*?)\s+(\d+)\s+(\d+\.\d+):\s+(\S+):\s*(.*)", line)
              if not match:
                  continue
              comm, thread_id, time_text, event_name, rest_text = match.groups()
              event_time = float(time_text)
              is_node = comm == "node" or comm.startswith("node-") or comm.startswith("V8")
              if is_node and node_start is None:
                  node_start = event_time
              if node_start is None:
                  continue
              elapsed = (event_time - node_start) * 1000
              if comm.startswith("provjobd") and "pread64" in event_name and first_read is None:
                  first_read = elapsed
              if is_node and "sys_enter_clone" in event_name and first_clone is None:
                  first_clone = elapsed
              if is_node and event_name == "raw_syscalls:sys_exit":
                  syscall_match = re.search(r"NR (\d+) = (-?\d+)", rest_text)
                  if syscall_match:
                      syscall_id, result = int(syscall_match.group(1)), int(syscall_match.group(2))
                      failed_list.append((elapsed, comm, syscall_names.get(syscall_id, str(syscall_id)), result))
          print(f"  first clone at {first_clone} ms, provjobd first pread at {first_read} ms")
          print("  node's failed syscalls up to 2 ms after provjobd's first pread:")
          for elapsed, comm, syscall_name, result in failed_list:
              if first_read is None or elapsed <= first_read + 2:
                  print(f"    +{elapsed:7.2f} ms {comm:16s} {syscall_name} = {result}")
          PY
          done
