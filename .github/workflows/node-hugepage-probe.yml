            python3 - "kfault-maps-$large_pages.txt" "kfault-$large_pages.txt" <<'PY'
          import collections, re, sys
          mapping_list = []
          for line in open(sys.argv[1]):
              parts = line.split()
              start_text, end_text = parts[0].split("-")
              mapping_list.append((int(start_text, 16), int(end_text, 16)))
          def area_of(address):
              for start, end in mapping_list:
                  if start <= address < end:
                      return {16781312: "stack", 1073741824: "arena"}.get(end - start, "other")
