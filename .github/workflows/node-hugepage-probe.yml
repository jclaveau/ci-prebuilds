          const report = label => console.log(`${label} uptime ${(process.uptime() * 1000).toFixed(0)} ms zero ${countZeroPages()} | ${ksmLine()} | ${ksmTotal()}`);
          report("first line");
          setTimeout(() => report("+100 ms"), 100);
