          for knob in /sys/kernel/mm/ksm/*; do echo "ksm $(basename "$knob"): $(cat "$knob" 2>/dev/null | head -1)"; done
          grep -E 'ksm|zero' /proc/vmstat || true
          cat >| "$RUNNER_TEMP/zero-pages-over-time.js" <<'PROBE'
          const fs = require("fs");
          const pagemapFd = fs.openSync("/proc/self/pagemap", "r");
          const kpageflagsFd = fs.openSync("/proc/kpageflags", "r");
          const flagBuffer = Buffer.alloc(8);
          const countZeroPages = () => {
            let zeroCount = 0;
            for (const line of fs.readFileSync("/proc/self/maps", "utf8").trim().split("\n")) {
              const [start, end] = line.split(" ")[0].split("-").map(text => parseInt(text, 16));
              if (end - start > 2 ** 31 || start >= 2 ** 47) continue;
              const entryBuffer = Buffer.alloc(((end - start) / 4096) * 8);
              fs.readSync(pagemapFd, entryBuffer, 0, entryBuffer.length, (start / 4096) * 8);
              for (let offset = 0; offset < entryBuffer.length; offset += 8) {
                const entry = entryBuffer.readBigUInt64LE(offset);
                if (!(entry >> 63n)) continue;
                fs.readSync(kpageflagsFd, flagBuffer, 0, 8, Number(entry & ((1n << 55n) - 1n)) * 8);
                if ((flagBuffer.readBigUInt64LE(0) >> 24n) & 1n) zeroCount++;
              }
            }
            return zeroCount;
          };
          const ksmLine = () => {
            try { return fs.readFileSync("/proc/self/ksm_stat", "utf8").trim().replace(/\n/g, ", "); }
