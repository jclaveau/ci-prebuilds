name: node huge page probe (MIMALLOC_ALLOW_LARGE_OS_PAGES)

# MIMALLOC_ALLOW_LARGE_OS_PAGES=1 halves spawn_true_x100 on GHA's AMD runners
# (#335, 0.57-0.66x) but is a no-op on an i3-4005U with HugePages_Total 0.
# mimalloc 2.2.7 maps its arenas with MAP_HUGETLB under that option (hugetlbfs,
# not THP; THP's MADV_HUGEPAGE sits under allow_thp, on either way), so the
# option can only act where the host reserves hugetlb pages. Each runner
# prints its hugetlb pool, then node's mappings, mimalloc's mmap calls and the
# spawn cost with the option off and on.

on:
  workflow_dispatch:
    inputs:
      replicates:
        description: 'Runners (one job each)'
        default: '4'

permissions:
  contents: read
  packages: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      replicate_list: ${{ steps.list.outputs.replicate_list }}
    steps:
      - id: list
        env:
          REPLICATES: ${{ inputs.replicates }}
        run: echo "replicate_list=$(python3 -c "import json,os; print(json.dumps(list(range(1, int(os.environ['REPLICATES']) + 1))))")" >> "$GITHUB_OUTPUT"

  probe:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        replicate: ${{ fromJSON(needs.matrix.outputs.replicate_list) }}
    env:
      NODE_IMAGE: ghcr.io/jclaveau/alpine-dood-node:latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Host huge page configuration
        run: |
          set -euo pipefail
          grep -m1 'model name' /proc/cpuinfo
          uname -r
          grep -iE 'huge' /proc/meminfo
          echo "nr_hugepages $(cat /proc/sys/vm/nr_hugepages)"
          echo "nr_overcommit_hugepages $(cat /proc/sys/vm/nr_overcommit_hugepages)"
          for knob in enabled defrag shmem_enabled; do
            echo "thp $knob $(cat /sys/kernel/mm/transparent_hugepage/$knob)"
          done
          grep -o 'hugepages[^ ]*\|hugepagesz[^ ]*\|transparent_hugepage[^ ]*' /proc/cmdline || echo "cmdline: no huge page argument"
          docker pull -q "$NODE_IMAGE"

      - name: Parent vs children, CPU and page faults
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            for large_pages in 0 1; do
              docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" -e '
                const { spawnSync } = require("child_process");
                const fs = require("fs");
                const readCgroup = () => ({
                  cpu_usec: Number(fs.readFileSync("/sys/fs/cgroup/cpu.stat", "utf8").match(/usage_usec (\d+)/)[1]),
                  faults: Number(fs.readFileSync("/sys/fs/cgroup/memory.stat", "utf8").match(/^pgfault (\d+)/m)[1]),
                });
                const readParent = () => {
                  const usage = process.resourceUsage();
                  return { cpu_usec: usage.userCPUTime + usage.systemCPUTime, sys_usec: usage.systemCPUTime, faults: usage.minorPageFault };
                };
                for (let warm = 0; warm < 10; warm++) spawnSync("true");
                const cgroupBefore = readCgroup();
                const parentBefore = readParent();
                for (let rep = 0; rep < 100; rep++) spawnSync("true");
                const cgroupAfter = readCgroup();
                const parentAfter = readParent();
                const parentCpu = parentAfter.cpu_usec - parentBefore.cpu_usec;
                const parentFaults = parentAfter.faults - parentBefore.faults;
                console.log(`round '"$round"' large_pages=${process.env.MIMALLOC_ALLOW_LARGE_OS_PAGES} x100:`,
                  `parent cpu ${(parentCpu / 1000).toFixed(1)} ms (sys ${((parentAfter.sys_usec - parentBefore.sys_usec) / 1000).toFixed(1)}), parent faults ${parentFaults} |`,
                  `children cpu ${((cgroupAfter.cpu_usec - cgroupBefore.cpu_usec - parentCpu) / 1000).toFixed(1)} ms, children faults ${cgroupAfter.faults - cgroupBefore.faults - parentFaults}`);
              '
            done
          done

      - name: Kernel profile of 1000 spawns with the option off and on
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          apt-cache search --names-only '^(linux-tools|linux-perf|perf)' | grep -E "azure|generic|common|^perf|linux-perf|$(uname -r)" | head -20
          for package in "linux-tools-$(uname -r)" linux-tools-azure linux-perf perf linux-tools-generic; do
            if sudo apt-get install -y -qq "$package" >/dev/null 2>&1; then echo "installed $package"; fi
          done
          perf_binary=$(sudo find /usr -type f -name perf -perm -u+x 2>/dev/null | head -1)
          if [ -z "$perf_binary" ]; then
            echo "no perf binary for $(uname -r)" >&2
            exit 1
          fi
          echo "perf: $perf_binary"
          sudo sysctl -q kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          for large_pages in 0 1; do
            echo "--- large_pages=$large_pages"
            sudo "$perf_binary" record -q -a -g -F 1999 -o "perf-$large_pages.data" -- \
              docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" \
                -e 'const {spawnSync}=require("child_process");for(let i=0;i<1000;i++)spawnSync("true")'
            sudo "$perf_binary" report -i "perf-$large_pages.data" --stdio --no-children --comms node,true \
              --sort comm,sym --percent-limit 0.7 -g none >| "report-$large_pages.txt"
            grep -vE '^#|^$' "report-$large_pages.txt" | head -40
          done
