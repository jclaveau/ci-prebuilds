name: node huge page probe (MIMALLOC_ALLOW_LARGE_OS_PAGES)

# MIMALLOC_ALLOW_LARGE_OS_PAGES=1 halves spawn_true_x100 on GHA's AMD runners
# (#335, 0.57-0.66x) but is a no-op on an i3-4005U with HugePages_Total 0.
# mimalloc 2.2.7 maps its arenas with MAP_HUGETLB under that option (hugetlbfs,
# not THP; THP's MADV_HUGEPAGE sits under allow_thp, on either way), so the
# option can only act where the host reserves hugetlb pages. Each runner
# prints its hugetlb pool, then node's mappings, mimalloc's mmap calls and the
# spawn cost with the option off and on.

on:
  workflow_dispatch:
    inputs:
      replicates:
        description: 'Runners (one job each)'
        default: '4'

permissions:
  contents: read
  packages: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      replicate_list: ${{ steps.list.outputs.replicate_list }}
    steps:
      - id: list
        env:
          REPLICATES: ${{ inputs.replicates }}
        run: echo "replicate_list=$(python3 -c "import json,os; print(json.dumps(list(range(1, int(os.environ['REPLICATES']) + 1))))")" >> "$GITHUB_OUTPUT"

  probe:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        replicate: ${{ fromJSON(needs.matrix.outputs.replicate_list) }}
    env:
      NODE_IMAGE: ghcr.io/jclaveau/alpine-dood-node:latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Host huge page configuration
        run: |
          set -euo pipefail
          grep -m1 'model name' /proc/cpuinfo
          uname -r
          grep -iE 'huge' /proc/meminfo
          echo "nr_hugepages $(cat /proc/sys/vm/nr_hugepages)"
          echo "nr_overcommit_hugepages $(cat /proc/sys/vm/nr_overcommit_hugepages)"
          for knob in enabled defrag shmem_enabled; do
            echo "thp $knob $(cat /sys/kernel/mm/transparent_hugepage/$knob)"
          done
          grep -o 'hugepages[^ ]*\|hugepagesz[^ ]*\|transparent_hugepage[^ ]*' /proc/cmdline || echo "cmdline: no huge page argument"
          docker pull -q "$NODE_IMAGE"

      - name: Parent vs children, CPU and page faults
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            for large_pages in 0 1; do
              docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" -e '
                const { spawnSync } = require("child_process");
                const fs = require("fs");
                const readCgroup = () => ({
                  cpu_usec: Number(fs.readFileSync("/sys/fs/cgroup/cpu.stat", "utf8").match(/usage_usec (\d+)/)[1]),
                  faults: Number(fs.readFileSync("/sys/fs/cgroup/memory.stat", "utf8").match(/^pgfault (\d+)/m)[1]),
                });
                const readParent = () => {
                  const usage = process.resourceUsage();
                  return { cpu_usec: usage.userCPUTime + usage.systemCPUTime, sys_usec: usage.systemCPUTime, faults: usage.minorPageFault };
                };
                for (let warm = 0; warm < 10; warm++) spawnSync("true");
                const cgroupBefore = readCgroup();
                const parentBefore = readParent();
                for (let rep = 0; rep < 100; rep++) spawnSync("true");
                const cgroupAfter = readCgroup();
                const parentAfter = readParent();
                const parentCpu = parentAfter.cpu_usec - parentBefore.cpu_usec;
                const parentFaults = parentAfter.faults - parentBefore.faults;
                console.log(`round '"$round"' large_pages=${process.env.MIMALLOC_ALLOW_LARGE_OS_PAGES} x100:`,
                  `parent cpu ${(parentCpu / 1000).toFixed(1)} ms (sys ${((parentAfter.sys_usec - parentBefore.sys_usec) / 1000).toFixed(1)}), parent faults ${parentFaults} |`,
                  `children cpu ${((cgroupAfter.cpu_usec - cgroupBefore.cpu_usec - parentCpu) / 1000).toFixed(1)} ms, children faults ${cgroupAfter.faults - cgroupBefore.faults - parentFaults}`);
              '
            done
          done

      - name: Kernel profile of 1000 spawns with the option off and on
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          apt-cache search --names-only '^(linux-tools|linux-perf|perf)' | grep -E "azure|generic|common|^perf|linux-perf|$(uname -r)" | head -20
          for package in "linux-tools-$(uname -r)" linux-tools-azure linux-perf perf linux-tools-generic; do
            if sudo apt-get install -y -qq "$package" >/dev/null 2>&1; then echo "installed $package"; fi
          done
          perf_binary=$(sudo find /usr -type f -name perf -perm -u+x 2>/dev/null | head -1)
          if [ -z "$perf_binary" ]; then
            echo "no perf binary for $(uname -r)" >&2
            exit 1
          fi
          echo "perf: $perf_binary"
          sudo sysctl -q kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          for large_pages in 0 1; do
            echo "--- large_pages=$large_pages"
            sudo "$perf_binary" record -a -g -F 1999 -o "perf-$large_pages.data" -- \
              docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" \
                -e 'const {spawnSync}=require("child_process");for(let i=0;i<1000;i++)spawnSync("true")' \
              || echo "perf record exited $?"
            sudo "$perf_binary" report -i "perf-$large_pages.data" --stdio --no-children \
              --sort comm,sym --percent-limit 0.5 -g none >| "report-$large_pages.txt" \
              || echo "perf report exited $?"
            grep -vE '^#|^$' "report-$large_pages.txt" | head -60 || echo "empty report"
          done

      - name: Node smaps at spawn time, option off and on
        run: |
          set -euo pipefail
          for large_pages in 0 1; do
            echo "--- large_pages=$large_pages"
            docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" -e '
              const { spawnSync } = require("child_process");
              const fs = require("fs");
              for (let warm = 0; warm < 10; warm++) spawnSync("true");
              const mappingList = [];
              let currentMapping = null;
              for (const line of fs.readFileSync("/proc/self/smaps", "utf8").split("\n")) {
                const header = line.match(/^([0-9a-f]+)-([0-9a-f]+) (\S+) \S+ \S+ \S+\s*(.*)$/);
                if (header) {
                  currentMapping = { range: `${header[1]}-${header[2]}`, perms: header[3], name: header[4] || "[anon]",
                    size_kb: (parseInt(header[2], 16) - parseInt(header[1], 16)) / 1024 };
                  mappingList.push(currentMapping);
                  continue;
                }
                const field = line.match(/^(Rss|Anonymous|AnonHugePages|VmFlags):\s+(.*?)( kB)?$/);
                if (field && currentMapping) currentMapping[field[1]] = field[1] === "VmFlags" ? field[2] : Number(field[2]);
              }
              const forkCopied = mappingList.filter(mapping => !/\bdc\b/.test(mapping.VmFlags));
              const sumKb = (list, key) => list.reduce((total, mapping) => total + (mapping[key] || 0), 0);
              console.log(`mappings ${mappingList.length}, copied at fork ${forkCopied.length}:`,
                `rss ${sumKb(forkCopied, "Rss")} kB, anonymous ${sumKb(forkCopied, "Anonymous")} kB,`,
                `anon huge ${sumKb(forkCopied, "AnonHugePages")} kB | not copied rss ${sumKb(mappingList, "Rss") - sumKb(forkCopied, "Rss")} kB`);
              for (const mapping of mappingList.filter(mapping => mapping.Rss >= 256 || mapping.AnonHugePages > 0)) {
                console.log(`  ${mapping.range} ${mapping.perms} size ${mapping.size_kb} rss ${mapping.Rss} anon ${mapping.Anonymous}`,
                  `huge ${mapping.AnonHugePages} ${mapping.name} [${mapping.VmFlags}]`);
              }
            '
          done

      - name: Children's page faults by node mapping, option off and on
        run: |
          set -euo pipefail
          for large_pages in 0 1; do
            echo "--- large_pages=$large_pages, 200 spawns"
            sudo perf record -q -a -e exceptions:page_fault_user -o "faults-$large_pages.data" -- \
              docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" -e '
                const { spawnSync } = require("child_process");
                for (let warm = 0; warm < 10; warm++) spawnSync("true");
                for (let rep = 0; rep < 200; rep++) spawnSync("true");
                process.stdout.write(require("fs").readFileSync("/proc/self/maps", "utf8"));
              ' >| "maps-$large_pages.txt" || echo "perf record exited $?"
            sudo perf script -i "faults-$large_pages.data" -F comm,tid,trace >| "faults-$large_pages.txt" 2>/dev/null \
              || echo "perf script exited $?"
            python3 - "maps-$large_pages.txt" "faults-$large_pages.txt" <<'PY'
          import collections, re, sys
          mapping_list = []
          for line in open(sys.argv[1]):
              parts = line.split()
              start_text, end_text = parts[0].split("-")
              mapping_list.append((int(start_text, 16), int(end_text, 16), parts[1], parts[5] if len(parts) > 5 else "[anon]"))
          fault_rows = []
          for line in open(sys.argv[2]):
              match = re.match(r"\s*(.+?)\s+(\d+)\s+.*address=0x([0-9a-f]+)\s+ip=0x([0-9a-f]+)\s+error_code=0x([0-9a-f]+)", line)
              if match:
                  fault_rows.append((match.group(1), int(match.group(2)), int(match.group(3), 16), int(match.group(5), 16)))
          node_rows = [row for row in fault_rows if row[0].startswith("node")]
          tid_counts = collections.Counter(row[1] for row in node_rows)
          parent_tid = tid_counts.most_common(1)[0][0]
          child_rows = [row for row in node_rows if row[1] != parent_tid]
          child_tids = {row[1] for row in child_rows}
          print(f"faults: parent tid {parent_tid} {tid_counts[parent_tid]}, other node tids {len(child_tids)} with {len(child_rows)},",
                f"true {sum(1 for row in fault_rows if row[0] == 'true')}")
          def name_mapping(address):
              for start, end, perms, name in mapping_list:
                  if start <= address < end:
                      return f"{perms} {name} {(end - start) // 1024}k"
              return "unmapped"
          region_counts = collections.Counter((name_mapping(row[2]), f"err {row[3]:#x}") for row in child_rows)
          for (region, error_code), count in region_counts.most_common(20):
              print(f"  {count:6d} {error_code} {region}")
          PY
          done

      - name: Kernel fault, syscall and TLB counts, option off and on
        run: |
          set -euo pipefail
          event_list=exceptions:page_fault_user,exceptions:page_fault_kernel,tlb:tlb_flush,sched:sched_process_fork
          event_list=$event_list,syscalls:sys_enter_mmap,syscalls:sys_enter_munmap,syscalls:sys_enter_madvise
          event_list=$event_list,syscalls:sys_enter_mprotect,syscalls:sys_enter_read,syscalls:sys_enter_execve
          for round in 1 2; do
            for large_pages in 0 1; do
              echo "--- round $round large_pages=$large_pages, 200 spawns"
              sudo perf stat -a -e "$event_list" -x, -o "stat-$large_pages.csv" -- \
                docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" -e '
                  const { spawnSync } = require("child_process");
                  for (let rep = 0; rep < 200; rep++) spawnSync("true");
                ' || echo "perf stat exited $?"
              grep -vE '^#|^$' "stat-$large_pages.csv" | cut -d, -f1,3
            done
          done
          for large_pages in 0 1; do
            echo "--- callers of copy_present_ptes and zap_present_ptes, large_pages=$large_pages"
            sudo perf record -q -a -g -F 4999 -o "callers-$large_pages.data" -- \
              docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" \
                -e 'const {spawnSync}=require("child_process");for(let i=0;i<500;i++)spawnSync("true")' \
              || echo "perf record exited $?"
            sudo perf report -i "callers-$large_pages.data" --stdio --no-children --comms node-MainThread \
              --sort sym --percent-limit 1.5 -G --max-stack 14 2>/dev/null | grep -vE '^#|^$' | head -90 \
              || echo "perf report exited $?"
          done

      - name: Failed MAP_HUGETLB alone, without node or mimalloc
        run: |
          set -euo pipefail
          cat >| fork-after-hugetlb.py <<'PY'
          import ctypes, os, sys, time
          libc = ctypes.CDLL(None, use_errno=True)
          libc.mmap.restype = ctypes.c_void_p
          libc.mmap.argtypes = [ctypes.c_void_p, ctypes.c_size_t, ctypes.c_int, ctypes.c_int, ctypes.c_int, ctypes.c_long]
          map_failed = ctypes.c_void_p(-1).value
          try_hugetlb = sys.argv[1] == "1"
          if try_hugetlb:
              hugetlb_flags = 0x02 | 0x20 | 0x40000 | (21 << 26)  # PRIVATE ANONYMOUS HUGETLB HUGE_2MB
              for size in (1 << 30, 32 << 20):
                  address = libc.mmap(None, size, 0x1 | 0x2, hugetlb_flags, -1, 0)
                  print(f"hugetlb mmap {size >> 20} MiB -> {'failed errno ' + str(ctypes.get_errno()) if address == map_failed else 'ok'}")
          touched_memory = bytearray(64 << 20)
          for offset in range(0, len(touched_memory), 4096):
              touched_memory[offset] = 1
          times_before = os.times()
          wall_before = time.perf_counter()
          for rep in range(200):
              child_pid = os.fork()
              if child_pid == 0:
                  os.execv("/bin/true", ["true"])
              os.waitpid(child_pid, 0)
          times_after = os.times()
          print(f"try_hugetlb={int(try_hugetlb)} x200: wall {(time.perf_counter() - wall_before) * 1000:.0f} ms,",
                f"parent sys {(times_after.system - times_before.system) * 1000:.0f} ms,",
                f"children cpu {(times_after.children_user + times_after.children_system - times_before.children_user - times_before.children_system) * 1000:.0f} ms")
          PY
          for round in 1 2 3; do
            python3 fork-after-hugetlb.py 0
            python3 fork-after-hugetlb.py 1
          done

      - name: mimalloc's own view, option off and on, crossed with allow_thp
        run: |
          set -euo pipefail
          spawn_script='const {spawnSync}=require("child_process");
            for (let warm = 0; warm < 10; warm++) spawnSync("true");
            const before = process.resourceUsage(); const wallBefore = performance.now();
            for (let rep = 0; rep < 200; rep++) spawnSync("true");
            const after = process.resourceUsage();
            console.log(`x200 wall ${(performance.now() - wallBefore).toFixed(0)} ms, parent sys ${((after.systemCPUTime - before.systemCPUTime) / 1000).toFixed(0)} ms`);'
          for round in 1 2; do
            for large_pages in 0 1; do
              for allow_thp in 0 1; do
                printf 'round %s large_pages=%s allow_thp=%s: ' "$round" "$large_pages" "$allow_thp"
                docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --env "MIMALLOC_ALLOW_THP=$allow_thp" \
                  --entrypoint node "$NODE_IMAGE" -e "$spawn_script"
              done
            done
          done
          for large_pages in 0 1; do
            docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --env MIMALLOC_VERBOSE=1 --env MIMALLOC_SHOW_STATS=1 \
              --entrypoint node "$NODE_IMAGE" -e "$spawn_script" >| "verbose-$large_pages.txt" 2>&1 || echo "node exited $?"
          done
          echo "--- mimalloc verbose, large_pages=0 vs 1 (addresses masked)"
          diff <(sed -E 's/0x[0-9a-f]+/ADDR/g' verbose-0.txt) <(sed -E 's/0x[0-9a-f]+/ADDR/g' verbose-1.txt) | head -120 || true
          echo "--- large_pages=1 option lines"
          grep -iE 'option|large|thp|arena|reserve' verbose-1.txt | head -40 || true

      - name: Spawn cost against where mimalloc's regions landed
        run: |
          set -euo pipefail
          for run in $(seq 1 16); do
            for large_pages in 0 1; do
              docker run --rm --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" -e '
                const { spawnSync } = require("child_process");
                for (let warm = 0; warm < 10; warm++) spawnSync("true");
                const before = process.resourceUsage();
                for (let rep = 0; rep < 200; rep++) spawnSync("true");
                const parentSysMs = (process.resourceUsage().systemCPUTime - before.systemCPUTime) / 1000;
                const bigRegions = require("fs").readFileSync("/proc/self/smaps", "utf8").split(/\n(?=[0-9a-f]+-)/)
                  .map(block => ({ range: block.split(" ")[0], size_mb: 0, flags: (block.match(/VmFlags:(.*)/) || [])[1] || "" }))
                  .map(region => { const [start, end] = region.range.split("-").map(text => parseInt(text, 16));
                    return { ...region, start, size_mb: (end - start) / 1048576 }; })
                  .filter(region => region.size_mb >= 32 && !/\bdc\b/.test(region.flags) && region.start < 0x500000000000);
                console.log(`large_pages=${process.env.MIMALLOC_ALLOW_LARGE_OS_PAGES} parent sys ${parentSysMs.toFixed(0)} ms |`,
                  bigRegions.map(region => `${region.start.toString(16)}+${region.size_mb}M${/\bhg\b/.test(region.flags) ? "hg" : ""}`).join(" "));
              '
            done
          done

      - name: Folio sizes behind node's present pages (pagemap + kpageflags)
        run: |
          set -euo pipefail
          for round in 1 2; do
            for large_pages in 0 1; do
              echo "--- round $round large_pages=$large_pages"
              docker run --rm --privileged --user 0 --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" -e '
                const { spawnSync } = require("child_process");
                const fs = require("fs");
                for (let warm = 0; warm < 10; warm++) spawnSync("true");
                const before = process.resourceUsage();
                for (let rep = 0; rep < 200; rep++) spawnSync("true");
                console.log(`x200 parent sys ${((process.resourceUsage().systemCPUTime - before.systemCPUTime) / 1000).toFixed(0)} ms`);
                const pagemapFd = fs.openSync("/proc/self/pagemap", "r");
                const kpageflagsFd = fs.openSync("/proc/kpageflags", "r");
                const flagBuffer = Buffer.alloc(8);
                const totals = { present: 0, small: 0, compound: 0, thp: 0, anon: 0, zero: 0 };
                const regionRows = [];
                for (const line of fs.readFileSync("/proc/self/maps", "utf8").trim().split("\n")) {
                  const [range, perms] = line.split(" ");
                  const [start, end] = range.split("-").map(text => parseInt(text, 16));
                  if (end - start > 2 ** 31 || start >= 2 ** 47) continue;
                  const pageCount = (end - start) / 4096;
                  const entryBuffer = Buffer.alloc(pageCount * 8);
                  try { fs.readSync(pagemapFd, entryBuffer, 0, entryBuffer.length, (start / 4096) * 8); } catch { continue; }
                  const regionCounts = { present: 0, small: 0, compound: 0 };
                  for (let index = 0; index < pageCount; index++) {
                    const entry = entryBuffer.readBigUInt64LE(index * 8);
                    if (!(entry >> 63n)) continue;
                    const pageFrame = entry & ((1n << 55n) - 1n);
                    if (pageFrame === 0n) continue;
                    fs.readSync(kpageflagsFd, flagBuffer, 0, 8, Number(pageFrame) * 8);
                    const pageFlags = flagBuffer.readBigUInt64LE(0);
                    const isCompound = ((pageFlags >> 15n) & 1n) || ((pageFlags >> 16n) & 1n);
                    totals.present++; regionCounts.present++;
                    if (isCompound) { totals.compound++; regionCounts.compound++; } else { totals.small++; regionCounts.small++; }
                    if ((pageFlags >> 22n) & 1n) totals.thp++;
                    if ((pageFlags >> 12n) & 1n) totals.anon++;
                    if ((pageFlags >> 24n) & 1n) totals.zero++;
                  }
                  if (regionRows.length < 400) regionRows.push({ range, perms, name: line.split(/\s+/)[5] || "[anon]", ...regionCounts });
                }
                console.log("pages", JSON.stringify(totals));
                for (const row of regionRows.filter(row => row.present >= 64).sort((left, right) => right.small - left.small).slice(0, 12)) {
                  console.log(`  ${row.range} ${row.perms} ${row.name} present ${row.present} small ${row.small} compound ${row.compound}`);
                }
              '
            done
          done

      - name: Which mappings hold node's zero-page PTEs, and which thread owns them
        run: |
          set -euo pipefail
          cat >| "$RUNNER_TEMP/zero-page-regions.js" <<'PROBE'
          const { spawnSync } = require("child_process");
          const fs = require("fs");
          for (let warm = 0; warm < 10; warm++) spawnSync("true");
          const before = process.resourceUsage();
          for (let rep = 0; rep < 200; rep++) spawnSync("true");
          console.log(`x200 parent sys ${((process.resourceUsage().systemCPUTime - before.systemCPUTime) / 1000).toFixed(0)} ms`);
          const threadList = fs.readdirSync("/proc/self/task").map(tid => {
            const statFields = fs.readFileSync(`/proc/self/task/${tid}/stat`, "utf8").split(") ")[1].split(" ");
            const syscallFields = fs.readFileSync(`/proc/self/task/${tid}/syscall`, "utf8").trim().split(" ");
            return { tid, name: fs.readFileSync(`/proc/self/task/${tid}/comm`, "utf8").trim(),
              stackPointer: parseInt(syscallFields[syscallFields.length - 2], 16), startStack: Number(statFields[25]) };
          });
          const smapsBlocks = fs.readFileSync("/proc/self/smaps", "utf8").split(/\n(?=[0-9a-f]+-[0-9a-f]+ )/);
          const mappingList = smapsBlocks.map(block => {
            const [range, perms] = block.split(" ");
            const [start, end] = range.split("-").map(text => parseInt(text, 16));
            return { range, perms, start, end, flags: (block.match(/VmFlags:\s*(.*)/) || [])[1] || "",
              rss: Number((block.match(/^Rss:\s+(\d+)/m) || [])[1] || 0), name: block.split("\n")[0].split(/\s+/)[5] || "[anon]" };
          });
          const pagemapFd = fs.openSync("/proc/self/pagemap", "r");
          const kpageflagsFd = fs.openSync("/proc/kpageflags", "r");
          const flagBuffer = Buffer.alloc(8);
          const totals = { present: 0, zero: 0, unreadable: 0 };
          mappingList.forEach((mapping, index) => {
            if (mapping.end - mapping.start > 2 ** 31 || mapping.start >= 2 ** 47) return;
            const pageCount = (mapping.end - mapping.start) / 4096;
            const entryBuffer = Buffer.alloc(pageCount * 8);
            try { fs.readSync(pagemapFd, entryBuffer, 0, entryBuffer.length, (mapping.start / 4096) * 8); } catch (error) { totals.unreadable++; console.log('unreadable', mapping.range, JSON.stringify(error.message)); return; }
            let zeroCount = 0, firstZero = -1, lastZero = -1;
            for (let page = 0; page < pageCount; page++) {
              const entry = entryBuffer.readBigUInt64LE(page * 8);
              if (!(entry >> 63n)) continue;
              totals.present++;
              const pageFrame = entry & ((1n << 55n) - 1n);
              if (pageFrame === 0n) continue;
              fs.readSync(kpageflagsFd, flagBuffer, 0, 8, Number(pageFrame) * 8);
              if ((flagBuffer.readBigUInt64LE(0) >> 24n) & 1n) {
                zeroCount++; totals.zero++;
                if (firstZero < 0) firstZero = page;
                lastZero = page;
              }
            }
            if (zeroCount < 64) return;
            const owners = threadList.filter(thread => [thread.stackPointer, thread.startStack].some(address => address >= mapping.start && address < mapping.end));
            const neighbour = offset => { const other = mappingList[index + offset]; return other ? `${other.range} ${other.perms} ${other.name} [${other.flags}]` : "-"; };
            console.log(`${mapping.range} ${mapping.perms} ${mapping.name} size ${(mapping.end - mapping.start) / 1024}k rss ${mapping.rss}k zero ${zeroCount}`,
              `pages ${firstZero}..${lastZero} [${mapping.flags}] threads ${owners.map(thread => thread.name).join(",") || "none"}`);
            console.log(`    before ${neighbour(-1)}`);
            console.log(`    after  ${neighbour(1)}`);
          });
          console.log("totals", JSON.stringify(totals));
          console.log("threads", threadList.map(thread => `${thread.name}@${thread.stackPointer.toString(16)}`).join(" "));
          PROBE
          for round in 1 2; do
            for large_pages in 0 1; do
              echo "--- round $round large_pages=$large_pages"
              docker run --rm --privileged --user 0 -v "$RUNNER_TEMP/zero-page-regions.js:/probe.js:ro" \
                --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint node "$NODE_IMAGE" /probe.js
            done
          done

      - name: Memory syscalls off vs on, and zero-page PTEs before any spawn
        run: |
          set -euo pipefail
          for large_pages in 0 1; do
            echo "--- large_pages=$large_pages"
            docker run --rm --privileged --user 0 -v "$RUNNER_TEMP/zero-page-regions.js:/probe.js:ro" \
              --env "MIMALLOC_ALLOW_LARGE_OS_PAGES=$large_pages" --entrypoint sh "$NODE_IMAGE" -c '
                apk add -q strace >/dev/null
                strace -f -e trace=mmap,munmap,madvise,mprotect,mremap,process_madvise -o /tmp/trace node -e "
                  const fs = require(\"fs\");
                  const readRollup = () => fs.readFileSync(\"/proc/self/smaps_rollup\", \"utf8\");
                  console.log(\"rss at boot\", (readRollup().match(/^Rss:.*/m) || [])[0]);
                  require(\"child_process\").spawnSync(\"true\");
                "
                echo "syscalls, addresses stripped:"
                sed -E "s/^[0-9]+ +//; s/0x[0-9a-f]+/ADDR/g; s/= [0-9]+$/= N/" /tmp/trace | sort | uniq -c | sort -rn >| /tmp/syscall-counts
                cat /tmp/syscall-counts
                echo "stack-sized mmaps:"
                grep -E "mmap\(.*, 1678(1312|5408)," /tmp/trace | head -8 || echo "none"
                echo "zero-page PTEs, no spawn loop:"
                node -e "$(sed "s/rep < 200/rep < 0/; s/warm < 10/warm < 0/" /probe.js)" | grep -E "^(x200|totals)"
              '
          done
