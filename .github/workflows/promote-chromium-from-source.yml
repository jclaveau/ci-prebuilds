name: Promote chromium-from-source → chs-<rev>

# Promotes an ALREADY-BUILT from-source chromium-headless-shell image (chs-fs-*)
# to the canonical consumer tags chs-<rev> / chs-<version> / chs-latest on both
# GHCR and Docker Hub — a pure imagetools retag, NO rebuild. The from-source
# build is the conformance-grade one (the apk fast-path is SUPERSEDED and its
# chs-<rev> promote is gated off on push); this makes chs-<rev> point at
# from-source so the alpine-*-playwright consumer (which COPYs chs-<rev>) ships
# conformance-grade chromium.
#
# Reuse-if-exists: because it retags an existing chs-fs image, re-running per PW
# rev costs seconds. Dispatch it after a from-source build lands (or to promote
# the current chs-fs-edge).
#
# Conformance used to be "verified out-of-band before dispatching", i.e. by
# whoever remembered to look. It is now an input: `conformance_run_id` names the
# run that passed, and the pre-flight checks that run's conformance jobs really
# succeeded AND that its head sha matches the image's revision label — so the
# conformance that passed is conformance of THIS artifact, not of a neighbour.

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing from-source image tag to promote (e.g. chs-fs-edge or chs-fs-sha-<sha>)
        default: chs-fs-edge
        type: string
      pw_version:
        description: Playwright version whose chromium revision/version tags to write
        default: '1.60.0'
        type: string
      conformance_run_id:
        description: Run id of the conformance run that passed for THIS image (its head sha must match the image's revision label)
        required: true
        type: string

concurrency:
  group: promote-chromium-from-source
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      # chs-latest is what the alpine-*-playwright consumer ships and what the
      # nightly bench measures, and NOTHING above restricts who may write it:
      # this workflow is dispatch-only, so until now a green dispatch from any
      # branch republished the canonical consumer tags on both registries. That
      # is a live hazard whenever an experiment build is being dispatched off a
      # perf branch — the bench would then be measuring the arm as if it were
      # shipped, and nothing in the run would say so.
      #
      # This FAILS rather than skipping, unlike the job-level `if:` the webkit
      # promote uses. A skipped job reports the run green, and a promote
      # workflow that reports green without promoting is the exact shape that
      # has already cost this repo a wrong conclusion once (resume_from running
      # only r1). Off main there is no correct outcome to be quiet about.
      - name: Refuse to promote canonical tags from anywhere but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::promote writes chs-<rev> / chs-<version> / chs-latest \
          on GHCR and Docker Hub; it ran on ${{ github.ref }}. Merge first, \
          then dispatch against main."
          exit 1

      - name: Resolve chromium rev/version from PW browsers.json
        id: pins
        env:
          PW: ${{ inputs.pw_version }}
        run: |
          BJ=$(curl -sL --fail "https://cdn.jsdelivr.net/npm/playwright-core@${PW}/browsers.json") \
            || { echo "::error::could not fetch browsers.json for PW ${PW}"; exit 1; }
          REV=$(jq -r '.browsers[] | select(.name=="chromium-headless-shell") | .revision' <<<"$BJ")
          VER=$(jq -r '.browsers[] | select(.name=="chromium-headless-shell") | .browserVersion' <<<"$BJ")
          if [ -z "$REV" ] || [ "$REV" = "null" ]; then
            echo "::error::failed to resolve chromium-headless-shell revision"; exit 1
          fi
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "PW ${PW} → chromium-headless-shell rev=${REV} version=${VER}"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pre-flight — source from-source image must exist
        env:
          SRC: ghcr.io/jclaveau/playwright-alpine-browsers:${{ inputs.source_tag }}
        run: |
          docker manifest inspect "$SRC" >/dev/null \
            || { echo "::error::source image $SRC not found on GHCR"; exit 1; }
          echo "source OK: $SRC"

      # Every other promote in this repo inherits a verified artifact through
      # `needs:` on the build job whose Tier-1 asserts the version. This workflow
      # has no build to inherit from — it retags whatever `source_tag` names — and
      # it owns the CANONICAL consumer tags (`chs-<rev>` / `chs-latest`, what
      # playwright/Dockerfile.alpine COPYs). So it has to do its own Tier-1: an
      # existence check proves a manifest is there, not that it is this version.
      # Skipping this is how `ff-150.0.2` came to name a Firefox 147.0.1 build.
      - name: Pre-flight — source binary must report the pinned version
        env:
          SRC: ghcr.io/jclaveau/playwright-alpine-browsers:${{ inputs.source_tag }}
          VER: ${{ steps.pins.outputs.ver }}
        run: |
          # The artifact is FROM scratch, so borrow a shell and the runtime deps
          # the same way the producer's Tier-1 does.
          cat > /tmp/Dockerfile.verify <<EOF
          FROM alpine:edge
          RUN apk update && apk add --no-cache \\
              nss freetype harfbuzz ca-certificates ttf-freefont libdrm mesa-gl \\
              libwebp libwebpdemux libxcomposite libxdamage libxrandr libxscrnsaver libxtst \\
              libx11 libxcb libxext libxi cups-libs alsa-lib dbus-libs pango cairo \\
              opus dav1d ffmpeg-libavformat libjpeg-turbo libxslt \\
              libatk-1.0 libatk-bridge-2.0 at-spi2-core minizip \\
              double-conversion crc32c libxkbcommon mesa-gbm eudev-libs flac \\
              harfbuzz-subset
          COPY --from=${SRC} /chrome-headless-shell-linux64 /opt/chs
          EOF
          docker build -t chs-promote-verify:${{ github.run_id }} -f /tmp/Dockerfile.verify /tmp
          OUT=$(docker run --rm chs-promote-verify:${{ github.run_id }} \
                  /opt/chs/chrome-headless-shell --version 2>&1)
          echo "chrome-headless-shell --version output:"
          echo "$OUT"
          echo "$OUT" | grep -q "$VER" \
            || { echo "::error::$SRC reports '$OUT' but would be promoted as chs-${VER}"; exit 1; }

      # A run can conclude `success` with every conformance job skipped, and a
      # passing conformance run for a DIFFERENT build says nothing about this
      # one — so check the jobs, and tie the run to the artifact by sha.
      - name: Pre-flight — conformance must have passed for this exact image
        env:
          SRC: ghcr.io/jclaveau/playwright-alpine-browsers:${{ inputs.source_tag }}
          RUN_ID: ${{ inputs.conformance_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" -q .head_sha)
          echo "conformance run ${RUN_ID} ran on ${HEAD_SHA}"

          # Only THIS artifact's conformance jobs. Matching every job whose name
          # contains "conformance" made a run that built one browser unpromotable:
          # the siblings it never built report `skipped`, and demanding all-success
          # rejected them as if they had failed. Same skipped-is-not-failed
          # confusion as actions/runner#491, in the opposite direction.
          #
          # Anchored, because `conformance-chromium-headless-shell` (the retired apk
          # variant, skipped here) is a PREFIX of the from-source name — an
          # unanchored match drags it back in and re-breaks this.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            -q '.jobs[]
                | select(.name | test("^conformance-chromium-headless-shell-from-source"))
                | "\(.conclusion)\t\(.name)"' > /tmp/conf-jobs.txt
          cat /tmp/conf-jobs.txt
          [ -s /tmp/conf-jobs.txt ] \
            || { echo "::error::run ${RUN_ID} ran no from-source chromium conformance job"; exit 1; }
          if grep -qvE '^success\b' /tmp/conf-jobs.txt; then
            echo "::error::run ${RUN_ID} has from-source chromium conformance jobs that did not succeed"
            exit 1
          fi
          echo "from-source chromium conformance: $(wc -l < /tmp/conf-jobs.txt) jobs, all success"

          IMG_SHA=$(docker buildx imagetools inspect "$SRC" --format '{{ json .Image }}' \
            | jq -r '[.. | objects | ."org.opencontainers.image.revision"? // empty] | first // empty')
          [ -n "$IMG_SHA" ] \
            || { echo "::error::$SRC carries no org.opencontainers.image.revision label"; exit 1; }
          [ "$IMG_SHA" = "$HEAD_SHA" ] \
            || { echo "::error::$SRC was built from ${IMG_SHA}, but run ${RUN_ID} tested ${HEAD_SHA}"; exit 1; }
          echo "conformance OK: run ${RUN_ID} passed on the sha this image was built from"

      - name: Promote from-source → chs-<rev> (GHCR + Docker Hub)
        env:
          SRC: ghcr.io/jclaveau/playwright-alpine-browsers:${{ inputs.source_tag }}
          REV: ${{ steps.pins.outputs.rev }}
          VER: ${{ steps.pins.outputs.ver }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/jclaveau/playwright-alpine-browsers:chs-${REV}" \
            -t "ghcr.io/jclaveau/playwright-alpine-browsers:chs-${VER}" \
            -t ghcr.io/jclaveau/playwright-alpine-browsers:chs-latest \
            -t "jclaveau/playwright-alpine-browsers:chs-${REV}" \
            -t "jclaveau/playwright-alpine-browsers:chs-${VER}" \
            -t jclaveau/playwright-alpine-browsers:chs-latest \
            "$SRC"
          echo "::notice::promoted $SRC → chs-${REV} / chs-${VER} / chs-latest (from-source, conformance-grade)"
