name: 'node-musl zlib integrity'

# Gates a node-musl tag that enables zlib's crc32 SIMD target, which node
# leaves commented out over https://github.com/nodejs/node/issues/45268
# ("memory corruption"). Each slot runs, for the candidate and for the shipped
# node as control:
#   - that issue's own repro (github.com/morpheus-med/node-defect), which
#     crashed affected builds; any non-zero exit or signal fails the slot. It
#     only crashes when glibc's malloc notices the damage, so it runs with
#     node/bench/gzip-verify-hook.cjs preloaded, which verifies every gzip
#     stream (exit 3) and checks malloc'd canary buffers (exit 4);
#   - node/bench/zlib-integrity.cjs, gzip/gunzip round trips plus zlib.crc32
#     against a reference, which would catch silent corruption.
# `control_images` adds arms, e.g. node 20.2.0, which shipped crc32 SIMD and
# reproduced the issue: the positive control showing the repro bites here.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'ghcr.io/jclaveau/node-musl tag under test'
        required: true
        type: string
      slots:
        description: 'Independent runner draws'
        default: '4'
        type: string
      repro_runs:
        description: 'node-defect repro runs per arm per slot'
        default: '10'
        type: string
      integrity_rounds:
        description: 'zlib-integrity.cjs rounds per arm per slot'
        default: '3000'
        type: string
      control_images:
        description: 'Extra images run as arms (space-separated), e.g. node:20.2.0-bullseye-slim'
        default: ''
        type: string
      skip_candidate:
        description: 'Run only the control images, not candidate and shipped'
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  slots:
    runs-on: ubuntu-latest
    outputs:
      slots: ${{ steps.split.outputs.slots }}
    steps:
      - id: split
        env:
          SLOT_COUNT: ${{ inputs.slots }}
        run: echo "slots=$(jq -nc --argjson n "$SLOT_COUNT" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"

  integrity:
    name: integrity-${{ matrix.slot }}
    needs: slots
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(needs.slots.outputs.slots) }}
    env:
      SHIPPED_IMAGE: ghcr.io/jclaveau/alpine-dood-node:latest
      REPRO_RUNS: ${{ inputs.repro_runs }}
      INTEGRITY_ROUNDS: ${{ inputs.integrity_rounds }}
      CONTROL_IMAGES: ${{ inputs.control_images }}
      SKIP_CANDIDATE: ${{ inputs.skip_candidate }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage the candidate as the consumer would ship it
        if: ${{ !inputs.skip_candidate }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          docker pull "$SHIPPED_IMAGE"
          docker build -f node/musl-build/Dockerfile.bench-arm \
            --build-arg "STAGE_A_IMAGE=$SHIPPED_IMAGE" \
            --build-arg "NODE_SOURCE_IMAGE=ghcr.io/jclaveau/node-musl:$TAG" \
            -t bench-arm:candidate node/musl-build
      - name: Runner CPU
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -qw pclmulqdq /proc/cpuinfo && grep -qw sse4_2 /proc/cpuinfo \
            || { echo "::error::runner lacks sse4_2+pclmulqdq, the crc32 SIMD path would not run"; exit 1; }
      - name: Fetch the node-defect repro
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/morpheus-med/node-defect repro
          (cd repro && unzip -q anonymized-data.zip && ls -l anonymized-data)
          chmod -R a+rX repro
      # set +e: the default bash -e would end the step on the first crash; every
      # arm and run is wanted, and rc carries the failure to the end.
      - name: Run every arm
        run: |
          set +e -uo pipefail
          rc=0
          arms=$CONTROL_IMAGES
          [ "$SKIP_CANDIDATE" = true ] || arms="candidate shipped $arms"
          [ -n "${arms// }" ] || { echo "::error::no arm to run: skip_candidate with no control_images"; exit 1; }
          for arm in $arms; do
            case "$arm" in
              candidate) image=bench-arm:candidate ;;
              shipped)   image=$SHIPPED_IMAGE ;;
              *)         image=$arm ;;
            esac
            echo "$arm: $(docker run --rm --entrypoint node "$image" --version)"
            echo "::group::$arm integrity ($INTEGRITY_ROUNDS rounds)"
            docker run --rm --entrypoint node -v "$PWD/repro:/repro:ro" -v "$PWD/node/bench:/bench:ro" \
              "$image" /bench/zlib-integrity.cjs /repro/anonymized-data "$INTEGRITY_ROUNDS" "$RANDOM$RANDOM" \
              || { echo "::error::$arm: zlib-integrity.cjs failed"; rc=1; }
            echo "::endgroup::"
            for run in $(seq 1 "$REPRO_RUNS"); do
              started=$(date +%s)
              log_name=repro-${arm//[^A-Za-z0-9.-]/_}-$run.err
              docker run --rm --entrypoint sh -w /repro -v "$PWD/repro:/repro:ro" \
                -v "$PWD/node/bench:/bench:ro" "$image" \
                -c 'timeout 900 node -r /bench/gzip-verify-hook.cjs index.js > /dev/null' 2> "$log_name"
              run_rc=$?
              echo "$arm repro $run/$REPRO_RUNS: rc=$run_rc in $(( $(date +%s) - started ))s;" \
                "$(grep -m1 '^gzip-verify:' "$log_name" || echo 'no gzip-verify summary')"
              if [ "$run_rc" -ne 0 ]; then
                echo "::error::$arm: node-defect repro run $run exited $run_rc"
                tail -20 "$log_name"
                rc=1
              fi
            done
          done
          exit "$rc"
