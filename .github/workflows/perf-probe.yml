name: Runtime perf probe

# Measures how fast ALREADY-PUBLISHED browsers execute, against Playwright's
# official glibc image, and repeats the measurement enough times to support a
# claim. Nothing is built here: it pulls tags, so a re-measure costs minutes
# rather than the hours `test-and-publish.yml` needs to reach its inline probe.
#
# Why it exists as its own workflow: the inline probe runs at runs=1 as a
# regression alarm, which cannot certify "alpine is faster" — at n=1 the
# instrument's own null arm moves several percent. This one takes `runs` and
# medians across whole container starts, which is where that noise lives.
#
# One job per DRAW on purpose. All of a draw's arms must land on the SAME runner
# or the ratio picks up the CPU draw instead of the build difference; GHA gives
# no control over which machine a job gets, so the arms travel together inside
# one job and the ratio divides the runner out.
#
# `replicates` fans a browser out over several such jobs, which is the only way
# to cover more than one CPU model: `runs` repeats inside one machine and buys
# precision, never coverage. The model cannot be requested, so `want_cpus` turns
# the fan-out into rejection sampling — a job that draws an unwanted machine
# stops before pulling a single image, at roughly 20 seconds instead of ten
# minutes, which is what makes hunting a 10%-of-fleet model affordable.
#
# The filter is read PER SLOT, because GitHub cancels runs rather than jobs: a
# draw of a model that already met its quota cannot be killed once it starts, so
# whether a slot may accept it has to be decided at dispatch. cpu-coverage.py
# sizes that allocation.

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Our image to measure. Docker Hub carries `latest`/`main`/`main-<sha>`; GHCR carries `sha-<full-40-char-sha>` and `edge` but NO `latest`.'
        default: 'jclaveau/alpine-dood-playwright:latest'
        type: string
      image_b:
        # A SECOND image of ours, probed in the same job as the first and as the
        # control. Without it, comparing an arm against the shipped build means
        # differencing two workflow runs on two machines, and the ratio is
        # runner-dependent: the same webkit reads libm_fmod 5.35 on an EPYC 7763,
        # 6.3 on a 9V74 and 7.65 on a Xeon 8370C. That comparison has twice been
        # rescued by hand, by checking a fingerprint metric matched — a habit,
        # not a guarantee. Pass the arm here and the shipped build above (or the
        # reverse) and both land on one machine by construction.
        description: 'Optional second image of ours, measured on the SAME runner as `image` (e.g. an experiment arm against the shipped build)'
        default: ''
        type: string
      browsers:
        description: 'CSV: chromium,firefox,webkit'
        default: 'chromium,firefox,webkit'
        type: string
      replicates:
        description: 'Independent runner draws per browser. Each one is its own job, so this is what buys CPU-model coverage — `runs` only tightens the estimate within one machine.'
        default: '1'
        type: string
      want_cpus:
        description: 'CPU-model substrings to keep: `,` between the models one slot accepts, `;` between slots. A draw matching none ends in ~20s without probing. One slot (no `;`) applies to all `replicates`; several set the slot count themselves. Empty keeps every draw.'
        default: ''
        type: string
      runs:
        description: 'Repetitions per arm. 1 = quick look; 5 = the point where subsampling showed the index converge (sd 1.2%); 10 = diminishing (sd 0.0%).'
        default: '5'
        type: string
      pw_version:
        description: 'Playwright version driving the probe, and the MCR control tag'
        default: '1.62.1'
        type: string
      label:
        description: 'Free-text note recorded in the summary (e.g. "wk mimalloc arm")'
        default: ''
        type: string

concurrency:
  # Keyed on the image so independent experiments never queue behind each
  # other; three browser loops dispatch these constantly.
  group: perf-probe-${{ inputs.image }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      browsers: ${{ steps.split.outputs.browsers }}
      slots: ${{ steps.split.outputs.slots }}
    steps:
      - id: split
        env:
          BROWSERS: ${{ inputs.browsers }}
          REPLICATES: ${{ inputs.replicates }}
          WANT: ${{ inputs.want_cpus }}
        run: |
          set -euo pipefail
          json=$(jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))' \
            <<< "$BROWSERS")
          echo "browsers=$json" >> "$GITHUB_OUTPUT"
          echo "browsers: $json"
          # A slot is one job, hence one draw, hence one independent CPU model.
          # Its `want` is what that draw will accept; slots differ so that a
          # model already near its quota stops being accepted while a rarer one
          # is still hunted on every slot.
          if [ -z "$WANT" ]; then
            slots=$(jq -nc --argjson n "$REPLICATES" \
              '[range(1; $n + 1) | {i: ., want: ""}]')
          elif ! grep -q ';' <<< "$WANT"; then
            slots=$(jq -nc --argjson n "$REPLICATES" --arg w "$WANT" \
              '[range(1; $n + 1) | {i: ., want: $w}]')
          else
            slots=$(jq -Rc 'split(";") | to_entries
              | map({i: (.key + 1), want: (.value | gsub("^\\s+|\\s+$"; ""))})' \
              <<< "$WANT")
          fi
          echo "slots=$slots" >> "$GITHUB_OUTPUT"
          echo "slots: $slots"

  probe:
    name: probe-${{ matrix.browser }}-${{ matrix.slot.i }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.matrix.outputs.browsers) }}
        slot: ${{ fromJSON(needs.matrix.outputs.slots) }}
    steps:
      # First step on purpose: the model is drawn when the job starts and cannot
      # be asked for, so an unwanted draw is only cheap if it is discovered
      # before the checkout and the two multi-gigabyte image pulls.
      - id: cpu
        env:
          WANT: ${{ matrix.slot.want }}
        run: |
          set -euo pipefail
          model=$(awk -F': ' '/^model name/ { print $2; exit }' /proc/cpuinfo)
          echo "runner CPU: $model"
          keep=true
          if [ -n "$WANT" ]; then
            keep=false
            for want in $(tr ',' ' ' <<< "$WANT"); do
              case "$model" in *"$want"*) keep=true ;; esac
            done
            [ "$keep" = true ] \
              || echo "::notice::skipping this draw — $model matches none of $WANT"
          fi
          echo "keep=$keep" >> "$GITHUB_OUTPUT"

      - if: steps.cpu.outputs.keep == 'true'
        uses: actions/checkout@v7

      - if: steps.cpu.outputs.keep == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe both arms, ${{ inputs.runs }}x each
        if: steps.cpu.outputs.keep == 'true'
        env:
          BROWSER: ${{ matrix.browser }}
          OURS: ${{ inputs.image }}
          OURS_B: ${{ inputs.image_b }}
          RUNS: ${{ inputs.runs }}
          PW: ${{ inputs.pw_version }}
        run: |
          set -o pipefail
          mkdir -p perf-out && chmod 777 perf-out   # the container writes as its own uid
          rc=0
          # Every arm runs in THIS job, so they share one machine by
          # construction — that is why the arms are not split across matrix
          # entries, and `Assert one machine per browser` below checks it held.
          targets="alpine official"
          if [ -n "$OURS_B" ]; then
            targets="alpine alpine-b official"
          fi
          # Arms are interleaved rather than run in blocks: a runner that
          # slows down partway through would otherwise land entirely on
          # whichever arm went second and read as a build difference.
          for i in $(seq 1 "$RUNS"); do
            for target in $targets; do
              case "$target" in
                official)
                  image="mcr.microsoft.com/playwright:v${PW}-noble"
                  home=/root ;;                     # the MCR image runs as root
                alpine-b)
                  image="$OURS_B"
                  home=/home/runner ;;
                *)
                  image="$OURS"
                  home=/home/runner ;;
              esac
              echo "::group::run $i/$RUNS — $target/$BROWSER ($image)"
              cname="probe-${target}-${BROWSER}-${i}"
              docker rm -f "$cname" >/dev/null 2>&1 || true
              docker run --rm --name "$cname" \
                --security-opt seccomp=unconfined \
                --env "HOME=$home" \
                --env "PROBE_BROWSER=$BROWSER" \
                --env "PROBE_TARGET=$target" \
                --env "PROBE_RUN=$i" \
                --env "PW_VERSION=$PW" \
                -v "$PWD/playwright/bench:/probe:ro" \
                -v "$PWD/playwright/scripts:/pwscripts:ro" \
                -v "$PWD/perf-out:/out" \
                "$image" \
                sh -c '
                  NODE_PATH="$(sh /pwscripts/global-node-path.sh)"
                  export NODE_PATH
                  node -e "require(\"playwright\")" 2>/dev/null \
                    || npm install -g --no-fund --no-audit "playwright@$PW_VERSION" >/dev/null 2>&1
                  timeout 300 node /probe/runtime-probe.cjs \
                    --browser "$PROBE_BROWSER" --target "$PROBE_TARGET" --out /out
                  # One file per repetition; perf-report.py medians across them.
                  # Without the rename each run would overwrite the last and the
                  # report would show a single draw while the job paid for N.
                  mv "/out/$PROBE_TARGET-$PROBE_BROWSER.json" \
                     "/out/$PROBE_TARGET-$PROBE_BROWSER-run$PROBE_RUN.json"
                ' 2>&1 | tee "perf-out/probe-${target}-${BROWSER}-${i}.log" || rc=1
              docker rm -f "$cname" >/dev/null 2>&1 || true
              echo "::endgroup::"
            done
          done
          exit "$rc"

      # One artifact per job, and the report keeps them in separate directories:
      # two draws of the same browser write identically-named files, and merging
      # them would silently drop every draw but one.
      - uses: actions/upload-artifact@v4
        if: always() && steps.cpu.outputs.keep == 'true'
        with:
          name: perf-probe-${{ matrix.browser }}-${{ matrix.slot.i }}
          path: perf-out/
          if-no-files-found: warn
          retention-days: 30

  report:
    needs: [matrix, probe]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: perf-probe-*
          path: perf-current

      # A missing arm must be LOUD. The first smoke run of this workflow pointed
      # at a tag that did not exist, every alpine probe died on `manifest
      # unknown`, and this job still went green rendering an official-only
      # table — the same blindness that hid webkit for weeks, reproduced by the
      # workflow built to end it. An absent arm cannot look like a measured one.
      - name: Assert both arms reported
        env:
          BROWSERS: ${{ needs.matrix.outputs.browsers }}
          SLOTS: ${{ needs.matrix.outputs.slots }}
          RUNS: ${{ inputs.runs }}
          HAS_B: ${{ inputs.image_b != '' }}
        run: |
          set -euo pipefail
          arms="alpine official"
          if [ "$HAS_B" = true ]; then
            arms="alpine alpine-b official"
          fi

          filtered=$(jq -r 'map(.want) | any(. != "")' <<< "$SLOTS")

          drew=$(find perf-current -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$drew" -eq 0 ]; then
            # With a filter this is the ordinary outcome of a round that missed:
            # nothing measured, nothing wrong. Without one it means every job
            # died before uploading, which is the blindness this step exists for.
            if [ "$filtered" = true ]; then
              echo "::notice::no runner matched any slot — re-dispatch to draw again"
              exit 0
            fi
            echo "::error::no probe artifact at all"
            exit 1
          fi

          expected=$(( $(jq -r 'length' <<< "$BROWSERS") * $(jq -r 'length' <<< "$SLOTS") ))
          if [ "$filtered" = false ] && [ "$drew" -ne "$expected" ]; then
            echo "::error::$drew draws reported, expected $expected"
            exit 1
          fi

          missing=0
          for dir in perf-current/*/; do
            draw=$(basename "$dir")
            # The draw is perf-probe-<browser>-<slot>, and the file name is
            # <arm>-<browser>-run<N>.json. Match the browser explicitly: with
            # only a wildcard there, `alpine-*` also catches `alpine-b-*`, and a
            # two-arm dispatch reads "alpine produced 10 of 5 runs" while every
            # arm in fact reported (run 34577378909).
            browser=$(echo "$draw" | awk -F- '{ print $(NF-1) }')
            for arm in $arms; do
              got=$(find "$dir" -name "$arm-$browser-run*.json" | wc -l)
              if [ "$got" -ne "$RUNS" ]; then
                echo "::error::$draw: $arm produced $got of $RUNS runs"
                missing=1
              else
                echo "ok: $draw $arm $got/$RUNS"
              fi
            done
          done
          exit "$missing"

      # The ratio is runner-dependent, so "same hardware" is CHECKED rather than
      # merely arranged. Every arm of a draw runs in one job and therefore on one
      # machine; separate draws land on different machines by design, so the
      # check is per-draw.
      - name: Assert one machine per draw
        run: python3 playwright/bench/assert-one-machine.py perf-current

      - name: Render
        # Runs even when the assert failed: a partial table is still worth
        # reading, as long as the job is already red and nobody mistakes it
        # for a complete one.
        if: '!cancelled()'
        env:
          OURS: ${{ inputs.image }}
          RUNS: ${{ inputs.runs }}
          LABEL: ${{ inputs.label }}
        run: |
          set -o pipefail
          {
            echo "### Runtime perf — \`$OURS\` vs official, n=$RUNS"
            if [ -n "$LABEL" ]; then echo "_${LABEL}_"; fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python3 playwright/bench/perf-report.py perf-current >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-perf
          path: perf-current/**/*.json
          retention-days: 90
