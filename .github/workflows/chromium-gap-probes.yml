name: chromium residual-gap probes

# Three probes for the ~1.3x geomean / 1.89x layout gap that survives BOTH
# perf knobs: PGO lands at 1.28 and ThinLTO at 1.31 against PW's official
# build, so about two thirds of the gap is neither DCHECKs nor codegen.
#
#   fonts-timing   `layout_boxonly` vs `layout_text` in chromium-gap-probe.cjs.
#                  We build with `replace_gn_files.py --system-libraries`
#                  covering fontconfig, freetype, harfbuzz and highway where
#                  official bundles its own. If the unbundled text stack is
#                  the cost it lands on the text arm only.
#
#   fonts-parity   The same probe again with official's font files and
#                  fontconfig copied verbatim over the alpine arm. Copied
#                  rather than apk-installed by name because Alpine's package
#                  names diverge from Ubuntu's and a near-miss set would look
#                  like a refutation. The probe's own `text_metrics` widths say
#                  whether the copy actually took: if they move to official's
#                  numbers the arm varied its variable, and if they do not,
#                  the arm is void rather than negative.
#
#   symbols        Whether PartitionAlloc is linked in as the allocator.
#                  aports patches PartitionAlloc-as-malloc OUT for musl
#                  (partition_alloc.gni, allocator_shim_default_dispatch_*),
#                  which would leave every allocation on musl's mallocng
#                  against official's PartitionAlloc. `nm -D` settles it: if
#                  malloc is an UNDEFINED symbol the binary imports it from
#                  libc, if it is absent from the undefined set the binary
#                  defines it itself.
#
#   toolchain      Which clang produced each binary, and whether libc++
#                  hardening assertions are compiled in. use_custom_libcxx is
#                  true on both, so the library is the same — but that says
#                  nothing about _LIBCPP_HARDENING_MODE, and a bounds check on
#                  every vector access is the right shape for a flat ~1.6x on
#                  container-heavy C++ that no allocator, font or memcpy
#                  change touches.
#
#   fast-string    The one-variable confirmation: LD_PRELOAD an AVX2
#                  implementation of the five routines into OUR OWN binary and
#                  re-run the layout kernel. Same build, same fonts, same
#                  allocator. Gated on a correctness check that is itself
#                  checked against a deliberately corrupted shim.
#
#   libc           Whether musl's string/memory routines are the residual.
#                  Alpine has no IFUNC, so musl links one implementation where
#                  glibc dispatches an AVX2/ERMS variant off the CPU at load,
#                  and box layout is mostly moving and clearing memory. Sized
#                  natively by libc-string-bench.c and, because an isolated
#                  microbenchmark has been wrong about magnitude before, also
#                  in-browser by the typed_array_* kernels.
#
# Informational, dispatch-only, gates nothing.

on:
  workflow_dispatch:
    inputs:
      image_ours:
        description: 'Our chrome-headless-shell artifact (from-source, scratch)'
        default: 'ghcr.io/jclaveau/playwright-alpine-browsers:chs-fs-sha-a649cb72f128607f2057e37e3e15a8f58044e400'
        type: string
      label_ours:
        description: 'Name for our arm in the report (which knob it carries)'
        default: 'pgo'
        type: string
      chs_rev:
        description: 'Chromium revision the artifact carries (PW browsers.json)'
        default: '1234'
        type: string
      pw_version:
        description: 'Playwright version to drive the probes'
        default: '1.62.1'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  probe:
    # All three arms in ONE job: hosted runners hand out different CPU models
    # per job, and a control on a sibling runner is not a control.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the arms
        env:
          IMAGE_OURS: ${{ inputs.image_ours }}
          CHS_REV: ${{ inputs.chs_rev }}
          PW: ${{ inputs.pw_version }}
        run: |
          set -o pipefail
          mkdir -p gap-out && chmod 777 gap-out
          OFFICIAL="mcr.microsoft.com/playwright:v${PW}-noble"
          echo "OFFICIAL=$OFFICIAL" >> "$GITHUB_ENV"

          # binutils is here for the symbols probe, not the timing one: nm and
          # strings have to run against the binary in its shipping form.
          cat > /tmp/Dockerfile.alpine <<EOF
          FROM alpine:edge
          RUN apk update && apk add --no-cache \\
              nodejs npm bash binutils fontconfig gcc musl-dev \\
              nss freetype harfbuzz ca-certificates ttf-freefont libdrm mesa-gl \\
              libwebp libwebpdemux libxcomposite libxdamage libxrandr \\
              libxscrnsaver libxtst libx11 libxcb libxext libxi cups-libs \\
              alsa-lib dbus-libs pango cairo opus dav1d ffmpeg-libavformat \\
              libjpeg-turbo libxslt libatk-1.0 libatk-bridge-2.0 at-spi2-core \\
              minizip double-conversion crc32c libxkbcommon mesa-gbm \\
              eudev-libs flac harfbuzz-subset
          COPY --from=${IMAGE_OURS} /chrome-headless-shell-linux64 \\
               /ms-playwright/chromium_headless_shell-${CHS_REV}/chrome-headless-shell-linux64
          RUN touch /ms-playwright/chromium_headless_shell-${CHS_REV}/INSTALLATION_COMPLETE
          ENV PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          ENV PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
          # musl ldconfig rejects -p, so PW's host validator reports false
          # missing libraries on Alpine.
          ENV PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1
          RUN npm install -g --no-fund --no-audit playwright@${PW}
          EOF
          docker build -t gap-alpine:${{ github.run_id }} \
            -f /tmp/Dockerfile.alpine /tmp

          # The fonts arm. Ubuntu's /etc/fonts references paths Alpine does not
          # have, so its own conf.d is kept underneath and only the font FILES
          # plus the top-level config are overlaid; fc-cache then rebuilds the
          # index and the probe's text_metrics reports whether it took.
          cat > /tmp/Dockerfile.fonts <<EOF
          FROM gap-alpine:${{ github.run_id }}
          COPY --from=${OFFICIAL} /usr/share/fonts /usr/share/fonts
          COPY --from=${OFFICIAL} /etc/fonts/fonts.conf /etc/fonts/fonts.conf
          RUN fc-cache -f >/dev/null 2>&1 && fc-list | wc -l
          EOF
          docker build -t gap-alpine-fonts:${{ github.run_id }} \
            -f /tmp/Dockerfile.fonts /tmp

      - name: Probe — timing and text metrics
        env:
          LABEL_OURS: ${{ inputs.label_ours }}
          PW: ${{ inputs.pw_version }}
        run: |
          set -o pipefail
          run_alpine() {
            local image="$1" label="$2"
            echo "::group::probe ${label}"
            docker run --rm \
              --env "PROBE_TARGET=${label}" \
              -v "$PWD/playwright/bench:/probe:ro" \
              -v "$PWD/gap-out:/out" \
              "$image" \
              sh -c '
                export NODE_PATH="$(npm root -g)"
                node /probe/chromium-gap-probe.cjs \
                  --target "$PROBE_TARGET" --out /out
              ' 2>&1 | tee "gap-out/probe-${label}.log"
            echo "::endgroup::"
          }

          run_alpine "gap-alpine:${{ github.run_id }}" "$LABEL_OURS"
          run_alpine "gap-alpine-fonts:${{ github.run_id }}" "${LABEL_OURS}-noble-fonts"

          echo "::group::probe official"
          docker run --rm --env HOME=/root \
            -v "$PWD/playwright/bench:/probe:ro" \
            -v "$PWD/gap-out:/out" \
            --env "PW_VERSION=${PW}" \
            "$OFFICIAL" \
            sh -c '
              for r in "$(pnpm root -g 2>/dev/null)" "$(npm root -g 2>/dev/null)"; do
                [ -n "$r" ] && NODE_PATH="${NODE_PATH:+$NODE_PATH:}$r"
              done
              export NODE_PATH
              node -e "require(\"playwright\")" 2>/dev/null \
                || npm install -g --no-fund --no-audit \
                     "playwright@$PW_VERSION" >/dev/null 2>&1
              node /probe/chromium-gap-probe.cjs --target official --out /out
            ' 2>&1 | tee "gap-out/probe-official.log"
          echo "::endgroup::"

      - name: Probe — allocator symbols
        env:
          CHS_REV: ${{ inputs.chs_rev }}
          PW: ${{ inputs.pw_version }}
        run: |
          set -o pipefail
          # One script, two containers: the questions have to be asked of each
          # binary in its own image, because neither binary runs on the other's
          # libc and copying one out would lose its dynamic section.
          cat > /tmp/symbols.sh <<'SH'
          set -u
          BIN="$1"
          echo "### $2"
          echo "size: $(stat -c %s "$BIN") bytes"
          echo
          echo "-- allocator entry points in the DYNAMIC symbol table --"
          for sym in malloc free calloc realloc posix_memalign malloc_usable_size; do
            u=$(nm -D --undefined-only "$BIN" 2>/dev/null \
                  | awk -v s="$sym" '$NF == s' | wc -l)
            d=$(nm -D --defined-only "$BIN" 2>/dev/null \
                  | awk -v s="$sym" '$NF == s' | wc -l)
            printf '%-20s undefined=%s defined=%s\n' "$sym" "$u" "$d"
          done
          echo
          echo "-- PartitionAlloc presence --"
          printf 'strings /PartitionAlloc/  : %s\n' \
            "$(strings -a "$BIN" | grep -c 'PartitionAlloc' || true)"
          printf 'strings /partition_alloc/ : %s\n' \
            "$(strings -a "$BIN" | grep -c 'partition_alloc' || true)"
          printf 'strings /allocator_shim/  : %s\n' \
            "$(strings -a "$BIN" | grep -c 'allocator_shim' || true)"
          echo
          echo "-- string/memory routines: imported from libc, or internal? --"
          for sym in memcpy memmove memset memcmp strlen; do
            u=$(nm -D --undefined-only "$BIN" 2>/dev/null \
                  | awk -v s="$sym" '$NF == s' | wc -l)
            d=$(nm -D --defined-only "$BIN" 2>/dev/null \
                  | awk -v s="$sym" '$NF == s' | wc -l)
            printf '%-20s undefined=%s defined=%s\n' "$sym" "$u" "$d"
          done
          echo
          echo "-- toolchain that produced the binary --"
          readelf -p .comment "$BIN" 2>/dev/null | grep -aoE \
            '(clang|GCC) version [0-9][0-9.]*' | sort -u | head -5
          strings -a "$BIN" | grep -aoE 'clang version [0-9][0-9.]*' \
            | sort | uniq -c | sort -rn | head -3

          echo
          echo "-- libc++ hardening: are the assertion messages compiled in? --"
          # Both builds set use_custom_libcxx, so the LIBRARY is the same one.
          # What is not fixed by that is _LIBCPP_HARDENING_MODE: with hardening
          # on, every vector::operator[] carries a bounds check and libc++
          # embeds the literal message it would abort with. Chromium turns it
          # off for official builds; if alpine's clang defaults it on, Blink's
          # container-heavy layout code pays a check per access.
          for msg in 'vector\[\] index out of bounds' \
                     'index out of bounds' \
                     '__libcpp_verbose_abort' \
                     'cannot dereference' \
                     'unordered container'; do
            printf '%-38s %s\n' "$msg" \
              "$(strings -a "$BIN" | grep -acE "$msg" || true)"
          done
          # Chromium has its own "index out of bounds" strings that mean
          # nothing here, so the sample is restricted to libc++'"'"'s own.
          echo "  libc++-specific strings present:"
          strings -a "$BIN" | grep -aiE 'libc\+\+|__libcpp' \
            | sort -u | head -8 | sed 's/^/    /'

          echo
          echo "-- link-time code layout: orderfile and CFI --"
          # An orderfile-linked build uses -z keep-text-section-prefix, which
          # leaves .text.hot / .text.unlikely as separate sections. Their
          # presence on one side and not the other is the orderfile, and the
          # relative .text size is what PGO and ThinLTO move.
          # symbols.sh is written by a QUOTED heredoc, so a plain single quote
          # is literal here; the '"'"' dance belongs in a `sh -c` string and
          # broke the awk program into shell scope when used here.
          readelf -SW "$BIN" 2>/dev/null \
            | awk '$2 ~ /^\.text/ { printf "  %-18s %s\n", $2, $6 }'
          printf '  %-18s %s\n' "CFI symbols" \
            "$(nm -D "$BIN" 2>/dev/null | grep -c cfi || true)"
          printf '  %-18s %s\n' "CFI strings" \
            "$(strings -a "$BIN" | grep -ci 'control flow integrity' || true)"

          echo
          echo "-- thread-local storage: the model, and how much of it there is --"
          # Ranked first among what is left. musl and glibc use different TLS
          # models, and a dynamic-TLS access through __tls_get_addr costs far
          # more than glibc initial-exec. Blink layout touches thread_local
          # constantly, which fits the surviving evidence exactly: compiled C++
          # slow, JIT-emitted code at parity, malloc and libm both excluded.
          printf '  %-26s %s\n' "__tls_get_addr undefined" \
            "$(nm -D --undefined-only "$BIN" 2>/dev/null | grep -c __tls_get_addr || true)"
          for r in TLSGD TLSLD DTPMOD DTPOFF TPOFF GOTTPOFF; do
            printf '  %-26s %s\n' "reloc $r" \
              "$(readelf -rW "$BIN" 2>/dev/null | grep -c "$r" || true)"
          done

          echo
          echo "-- section sizes (ThinLTO should SHRINK .text; if ours is much"
          echo "   smaller than official the inlining differs, not just the libc) --"
          readelf -SW "$BIN" 2>/dev/null \
            | awk '$2 ~ /^\.(text|rodata|data|bss|got|plt)/ { printf "  %-18s %s\n", $2, $6 }'

          echo
          echo "-- DCHECK residue (expected 0 on both) --"
          printf 'strings /Check failed/    : %s\n' \
            "$(strings -a "$BIN" | grep -c 'Check failed' || true)"
          echo
          echo "-- libc the binary is linked against --"
          head -c 4096 "$BIN" | strings -a | grep -iE 'ld-musl|ld-linux' | head -3
          SH

          {
            echo '## Allocator symbols'
            echo
            echo '```'
            docker run --rm -v /tmp/symbols.sh:/symbols.sh:ro \
              "gap-alpine:${{ github.run_id }}" \
              sh /symbols.sh \
                "/ms-playwright/chromium_headless_shell-${CHS_REV}/chrome-headless-shell-linux64/chrome-headless-shell" \
                "ours (alpine, musl)"
            echo
            docker run --rm -v /tmp/symbols.sh:/symbols.sh:ro \
              --entrypoint sh "$OFFICIAL" -c '
                command -v nm >/dev/null 2>&1 \
                  || (apt-get update -qq && apt-get install -y -qq binutils) \
                       >/dev/null 2>&1
                BIN=$(find /ms-playwright -name chrome-headless-shell -type f \
                        | head -1)
                sh /symbols.sh "$BIN" "official (noble, glibc)"
              '
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Probe — libc string routines
        run: |
          set -o pipefail
          # -fno-builtin is the whole point: without it the compiler inlines its
          # own copy for these constant sizes and the bench measures codegen.
          # gcc on both sides so the loop around the call is the same shape;
          # what differs is which libc answers the PLT.
          BUILD='cc -O2 -fno-builtin -o /tmp/libcbench /probe/libc-string-bench.c'

          docker run --rm \
            -v "$PWD/playwright/bench:/probe:ro" \
            -v "$PWD/gap-out:/out" \
            "gap-alpine:${{ github.run_id }}" \
            sh -c "$BUILD && /tmp/libcbench musl > /out/musl-libc.json" \
            2>&1 | tee gap-out/libc-musl.log

          docker run --rm --entrypoint sh \
            -v "$PWD/playwright/bench:/probe:ro" \
            -v "$PWD/gap-out:/out" \
            "$OFFICIAL" -c "
              command -v cc >/dev/null 2>&1 \
                || (apt-get update -qq && apt-get install -y -qq gcc) \
                     >/dev/null 2>&1
              $BUILD && /tmp/libcbench glibc > /out/glibc-libc.json
            " 2>&1 | tee gap-out/libc-glibc.log

      - name: Report — libc string routines
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os

          try:
              musl = json.load(open('gap-out/musl-libc.json'))
              glibc = json.load(open('gap-out/glibc-libc.json'))
          except Exception as e:
              print(f'libc bench produced no comparable pair: {e}')
              raise SystemExit(0)

          sizes = sorted({int(k) for o in musl['ops'].values() for k in o},
                         key=int)
          print('## libc string routines — musl / glibc\n')
          print(f"Same source, same `-O2 -fno-builtin`, "
                f"{musl['bytes_per_run'] // (1024 * 1024)} MiB touched per "
                f"cell, fastest of three passes. `nop` is the loop's own cost, "
                f"so a row near it is measuring nothing.\n")
          print('| op | ' + ' | '.join(f'{s} B' for s in sizes) + ' |')
          print('|---' * (len(sizes) + 1) + '|')
          for op in musl['ops']:
              cells = []
              for size in sizes:
                  a = musl['ops'][op].get(str(size))
                  b = glibc['ops'].get(op, {}).get(str(size))
                  if not (a and b):
                      cells.append('—')
                      continue
                  cells.append(f'{a / b:.2f}x')
              print(f'| `{op}` | ' + ' | '.join(cells) + ' |')
          print()
          print('Absolute ms (musl / glibc):\n')
          print('| op | ' + ' | '.join(f'{s} B' for s in sizes) + ' |')
          print('|---' * (len(sizes) + 1) + '|')
          for op in musl['ops']:
              cells = []
              for size in sizes:
                  a = musl['ops'][op].get(str(size))
                  b = glibc['ops'].get(op, {}).get(str(size))
                  cells.append('—' if not (a and b) else f'{a:.1f} / {b:.1f}')
              print(f'| `{op}` | ' + ' | '.join(cells) + ' |')
          PY

      - name: Probe — the same binary with AVX2 string routines
        env:
          LABEL_OURS: ${{ inputs.label_ours }}
        run: |
          set -o pipefail
          # The one-variable test. Same binary, same fonts, same allocator;
          # only which code answers memcpy changes. An arm that crashes the
          # browser is recorded as absent rather than failing the run, because
          # the other arms are still results.
          docker run --rm \
            -v "$PWD/playwright/bench:/probe:ro" \
            -v "$PWD/gap-out:/out" \
            --env "PROBE_TARGET=${LABEL_OURS}-fast-string" \
            "gap-alpine:${{ github.run_id }}" \
            sh -c '
              set -e
              SHIM="-O3 -mavx2 -fPIC -shared -fno-builtin"
              SHIM="$SHIM -fno-tree-loop-distribute-patterns"
              # shellcheck disable=SC2086
              cc $SHIM -o /tmp/libfast.so /probe/fast-string-preload.c
              # -fno-builtin on the TEST too, or the compiler inlines its own
              # memcpy, the PLT is never taken, and a corrupted shim passes.
              cc -O2 -fno-builtin -fno-tree-loop-distribute-patterns \
                 -o /tmp/shimtest /probe/fast-string-preload-test.c

              echo "--- control: no preload, must pass ---"
              /tmp/shimtest
              echo "--- shim: must pass ---"
              LD_PRELOAD=/tmp/libfast.so /tmp/shimtest
              echo "--- corrupted shim: must fail, or the gate is vacuous ---"
              # Anchored at four spaces so it lands in copy_fwd, the tail
              # both memcpy and the forward memmove share.
              sed "s|^    d\[i\] = s\[i\];|    d[i] = (unsigned char)(s[i] ^ (i + 1 == n));|" \
                  /probe/fast-string-preload.c > /tmp/broken.c
              if diff -q /tmp/broken.c /probe/fast-string-preload.c >/dev/null; then
                echo "the corruption sed matched nothing" >&2
                exit 1
              fi
              # shellcheck disable=SC2086
              cc $SHIM -o /tmp/libbroken.so /tmp/broken.c
              if LD_PRELOAD=/tmp/libbroken.so /tmp/shimtest >/dev/null 2>&1; then
                echo "gate is vacuous: the corrupted shim passed" >&2
                exit 1
              fi
              echo "gate caught it"

              rm -f /out/preload-pids.txt
              FAST_STRING_MARKER=/out/preload-pids.txt \
              LD_PRELOAD=/tmp/libfast.so \
              NODE_PATH="$(npm root -g)" \
                node /probe/chromium-gap-probe.cjs \
                  --target "$PROBE_TARGET" --out /out
              echo "processes that loaded the shim: $(wc -l < /out/preload-pids.txt)"
            ' 2>&1 | tee gap-out/probe-fast-string.log \
            || echo "::warning::the fast-string arm did not complete"

      - name: Report — timing and fonts
        env:
          LABEL_OURS: ${{ inputs.label_ours }}
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, os

          arms = {}
          for f in sorted(glob.glob('gap-out/*-gap.json')):
              d = json.load(open(f))
              arms[d['target']] = d

          ours = os.environ['LABEL_OURS']
          order = [ours, f'{ours}-noble-fonts', f'{ours}-fast-string',
                   'official']
          order = [a for a in order if a in arms]
          if not order:
              print('no arm produced a result')
              raise SystemExit(0)

          ref = arms.get('official')
          print('## Layout — is the gap in the text stack?\n')
          print('`layout_boxonly` re-lays-out 800 empty boxes; `layout_text` '
                'is the same loop over 800 text rows. A gap that lives only in '
                'the text arm is the unbundled fontconfig/freetype/harfbuzz.\n')
          print('| kernel | ' + ' | '.join(order) + ' |')
          print('|---' * (len(order) + 1) + '|')
          kernels = sorted({k for a in arms.values() for k in a['metrics']})
          for k in kernels:
              cells = []
              for a in order:
                  m = arms[a]['metrics'].get(k)
                  cells.append('—' if not m else f"{m['median_ms']:.1f}")
              print(f'| `{k}` | ' + ' | '.join(cells) + ' |')
          print()

          if ref:
              print('Ratios vs `official` (>1 = we are slower):\n')
              print('| kernel | ' + ' | '.join(a for a in order
                                               if a != 'official') + ' |')
              print('|---' * len([a for a in order if a != 'official'] + [0])
                    + '|')
              for k in kernels:
                  rm = ref['metrics'].get(k)
                  cells = []
                  for a in order:
                      if a == 'official':
                          continue
                      m = arms[a]['metrics'].get(k)
                      if not (m and rm and rm['median_ms']):
                          cells.append('—')
                          continue
                      r = m['median_ms'] / rm['median_ms']
                      # Inside the combined per-sample spread, the ratio is not
                      # a measurement of anything.
                      spread = max(max(m['samples']) - min(m['samples']),
                                   max(rm['samples']) - min(rm['samples']))
                      s = f'{r:.2f}x'
                      if abs(m['median_ms'] - rm['median_ms']) < spread:
                          s += ' n.s.'
                      cells.append(s)
                  print(f'| `{k}` | ' + ' | '.join(cells) + ' |')
              print()

          print('## Text metrics — did the arms shape the same glyphs?\n')
          print('Advance widths in CSS px for a fixed string. These are '
                'deterministic: equal widths mean the same face and the same '
                'shaping, and they are also what says whether the font-copy '
                'arm actually varied its variable.\n')
          keys = sorted({k for a in arms.values()
                         for k in (a.get('text_metrics') or {})})
          print('| measurement | ' + ' | '.join(order) + ' |')
          print('|---' * (len(order) + 1) + '|')
          for k in keys:
              cells = [str((arms[a].get('text_metrics') or {}).get(k, '—'))
                       for a in order]
              print(f'| `{k}` | ' + ' | '.join(cells) + ' |')
          print()
          try:
              pids = len(set(open('gap-out/preload-pids.txt').read().split()))
              print(f'`{ours}-fast-string`: the shim was loaded by **{pids}** '
                    f'processes. One would mean it reached only the launcher '
                    f'and the layout row measures nothing.\n')
          except Exception:
              pass

          print('| arm | libc | runner |')
          print('|---|---|---|')
          for a in order:
              print(f"| {a} | {arms[a]['libc']} | "
                    f"{arms[a]['runner']['cpu']} "
                    f"({arms[a]['runner']['cores']} cores) |")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-gap-probes
          path: gap-out/
          if-no-files-found: warn
