name: pnpm store directory
description: >-
  Resolve the pnpm store path actions/cache is able to keep, and the libc tag its key
  needs. Exports, for the steps that follow, `pnpm_config_store_dir` (absolute, what pnpm
  itself reads), `STORE_PATH` (relative to the workspace, the only shape
  actions/cache can tar back; absolute under act, which binds a host store) and `LIBC_TAG` (`-musl` or
  `-glibc`, so a musl image and a glibc VM never share one entry). A store path whose
  shape would split the cache in two, or restore outside the workspace, is refused by
  name. Set `pnpm_config_store_dir` in the job env to override the default
  `$GITHUB_WORKSPACE/.pnpm-store`.

runs:
  using: composite
  steps:
    - shell: bash
      run: bash "$GITHUB_ACTION_PATH/pnpm-store.sh"
