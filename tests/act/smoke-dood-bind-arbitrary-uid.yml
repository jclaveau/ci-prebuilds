# Smoke workflow for the arbitrary-UID variant of the `act --bind` recipe — the host
# UID has no /etc/passwd entry, so the workflow sources nss-wrapper-setup first to
# synthesize one. Wired by test-dood-dind-act in .github/workflows/test-and-publish.yml
# (UID 5000). Does NOT exercise `sudo` (setuid strips LD_PRELOAD; documented limit).
name: act smoke (dood, --bind, arbitrary-uid via nss_wrapper)
on: [push]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - run: id
      # Without the wrapper, `whoami` errors with `cannot find name for user ID 5000`.
      - name: whoami before wrapper (must fail — getpwuid lookup for synthesised UID)
        # Negation guards against a future libc making whoami fall back to $USER —
        # that would silently turn this baseline green even when nss_wrapper is broken.
        run: |
          whoami && { echo "FAIL: expected getpwuid lookup to fail before nss-wrapper-setup runs"; exit 1; } || true
      - name: nss_wrapper passwd synthesis
        run: |
          . /usr/local/bin/nss-wrapper-setup
          { echo "LD_PRELOAD=$LD_PRELOAD"
            echo "NSS_WRAPPER_PASSWD=$NSS_WRAPPER_PASSWD"
            echo "NSS_WRAPPER_GROUP=$NSS_WRAPPER_GROUP"
          } >> "$GITHUB_ENV"
      - name: whoami after wrapper (must say 'runner')
        run: |
          name=$(whoami)
          echo "whoami=$name"
          test "$name" = "runner"
      # Workspace write (TP step asserts host-side ownership matches --user)
      - run: touch ./from-act.txt
      # TODO(pnpm#3699): re-enable once pnpm stops re-`chmod`-ing existing global bin
      # entries during `install -g`. The mkdir canaries below pass under the current
      # image but the real consumer scenario (a fresh `pnpm add -g <pkg>` against a
      # pre-baked playwright) EPERMs on `chmod` regardless of mode bits, because POSIX
      # chmod(2) requires file ownership. Upstream: https://github.com/pnpm/pnpm/issues/3699
      # - name: PNPM_HOME writable (asserts on pnpm-layered images, no-op on bare)
      #   run: |
      #     command -v pnpm || { echo 'no pnpm layer; skipping'; exit 0; }
      #     mkdir "$PNPM_HOME/.act-bind-canary"     && rmdir "$PNPM_HOME/.act-bind-canary"
      #     mkdir "$HOME/.cache/pnpm/.canary"       && rmdir "$HOME/.cache/pnpm/.canary"
      #     mkdir "$HOME/.config/pnpm/.canary"      && rmdir "$HOME/.config/pnpm/.canary"
