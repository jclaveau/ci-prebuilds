# Smoke workflow run through `act` to mirror REAL GitHub Actions usage of these images: a normal
# `runs-on: ubuntu-latest` job that uses our image as the job `container:` (NOT as the runner). The
# image is injected by the test-base-act job via `act --var RUNNER_IMAGE=...`.
# Kept out of .github/workflows so real CI ignores it.
name: act smoke (dind)
on: [push]
jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RUNNER_IMAGE }}
      # dind: point clients at the inner daemon via the container --env (mirrors the GHA setup).
      options: --privileged --env DOCKER_HOST=unix:///var/run/dind.sock
    env:
      DOCKER_STORAGE_DRIVER: fuse-overlayfs
    steps:
      - name: DOCKER_MODE baked in
        run: test "$DOCKER_MODE" = "dind"
      - name: HOST_ADDRESS baked in
        run: test "$HOST_ADDRESS" = "127.0.0.1"
      - run: start-dockerd
      - run: docker info
      # Pull the smoke image from Google's transparent Docker Hub
      # mirror so the test doesn't depend on DH egress (the same
      # flake class that drove the buildkit + syntax-frontend
      # mirroring in build-layer / Dockerfiles).
      - run: docker run --rm mirror.gcr.io/library/hello-world
